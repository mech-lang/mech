[package]
name = "mech-execution-modes"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "mech-execution-modes-compiled"
path = "../../../../../hosts/gpu/src/bin/mech-native-source.rs"

[[bin]]
name = "mech-execution-modes-emit"
path = "../emit.rs"

[dependencies]
serde_json = "1.0"
mech-gpu = { path = "../../../../../hosts/gpu", default-features = false, features = ["native-build", "system-gmp"] }
mech-core = { path = "../../../../../src/core", default-features = false, features = ["program", "std"] }
mech-engine = { path = "../../../../../src/engine", default-features = false, features = ["resident-artifact"] }
mech-runtime = { path = "../../../../../src/runtime", default-features = false, features = ["compiler", "resident-routing-source", "std", "string", "f64", "matrixd", "vectord", "row_vectord"] }
mech-stdlib = { path = "../../../../../src/stdlib", default-features = false, features = ["standard_compiler", "matrix1"] }

[patch.crates-io]
mech-bytecode = { path = "../../../../../src/bytecode" }
mech-core = { path = "../../../../../src/core" }
mech-engine = { path = "../../../../../src/engine" }
mech-runtime = { path = "../../../../../src/runtime" }
mech-syntax = { path = "../../../../../src/syntax" }
mech-stdlib = { path = "../../../../../src/stdlib" }
mech-combinatorics = { path = "../../../../../machines/combinatorics" }
mech-compare = { path = "../../../../../machines/compare" }
mech-logic = { path = "../../../../../machines/logic" }
mech-math = { path = "../../../../../machines/math" }
mech-matrix = { path = "../../../../../machines/matrix" }
mech-range = { path = "../../../../../machines/range" }
mech-set = { path = "../../../../../machines/set" }
mech-stats = { path = "../../../../../machines/stats" }
mech-string = { path = "../../../../../machines/string" }

[workspace]
