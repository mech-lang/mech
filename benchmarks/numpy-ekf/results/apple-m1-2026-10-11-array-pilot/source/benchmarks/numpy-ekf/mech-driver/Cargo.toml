[package]
name = "numpy-ekf-mech-driver"
version = "0.1.0"
edition = "2024"
publish = false

# Keep this diagnostic independent of the main command-line application's
# feature set and do not pull in a native GPU API.
[workspace]

[dependencies]
mech-core = { path = "../../../src/core", default-features = false, features = ["f32", "matrixd"] }
mech-engine = { path = "../../../src/engine", default-features = false, features = ["full_compiler"] }
mech-gpu = { path = "../../../hosts/gpu", default-features = false, features = ["jit"] }
mech-runtime = { path = "../../../src/runtime", default-features = false, features = ["full_compiler", "resident-routing-source", "compute"] }
mech-stdlib = { path = "../../../src/stdlib", default-features = false, features = ["full_compiler", "native-plan"] }
mech-syntax = { path = "../../../src/syntax", default-features = false, features = ["full"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
debug = false

[patch.crates-io]
mech-combinatorics = { path = "../../../machines/combinatorics" }
mech-compare = { path = "../../../machines/compare" }
mech-logic = { path = "../../../machines/logic" }
mech-math = { path = "../../../machines/math" }
mech-matrix = { path = "../../../machines/matrix" }
mech-range = { path = "../../../machines/range" }
mech-set = { path = "../../../machines/set" }
mech-stats = { path = "../../../machines/stats" }
mech-string = { path = "../../../machines/string" }
