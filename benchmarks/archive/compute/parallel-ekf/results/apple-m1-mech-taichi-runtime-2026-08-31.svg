<text x="1291.8" y="443" class="value">222.21</text>
<text x="52" y="506" class="muted" font-size="12">Checked rows validate and publish only valid candidates; unchecked rows omit those checks. Every GPU row submits and waits once per turn; setup, compilation, allocation, warmup, and final readback are excluded.</text>
