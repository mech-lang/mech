<rect x="430" y="357" width="602.4" height="24" rx="3" fill="#40d4b0" opacity="0.9"/>
<text x="1042.4" y="374" class="value">157.14</text>
<text x="414" y="416" text-anchor="end" class="label">Mech SIMD/JIT CPU, unchecked (8 workers)</text>
<rect x="430" y="399" width="423.5" height="24" rx="3" fill="#40d4b0" opacity="0.9"/>
<text x="863.5" y="416" class="value">110.47</text>
<text x="414" y="458" text-anchor="end" class="label">Taichi LLVM CPU, unchecked (8 workers)</text>
<rect x="430" y="441" width="376.2" height="24" rx="3" fill="#b68cff" opacity="0.9"/>
<text x="816.2" y="458" class="value">98.14</text>
<text x="52" y="480" class="muted" font-size="12">Checked rows validate and publish only valid candidates; unchecked rows omit those checks. Every GPU row submits and waits once per turn; setup, compilation, allocation, warmup, and final readback are excluded.</text>
<g aria-label="Test machine">
<rect x="960" y="18" width="390" height="72" rx="4" fill="#111827" stroke="#334155"/>
<text x="972" y="34" fill="#e8edf5" font-size="11" font-weight="700">Test machine</text>
<text x="972" y="49" fill="#91a0b5" font-size="10">Mac mini Macmini9,1 | Apple M1 | 8-core CPU (4P + 4E)</text>
<text x="972" y="64" fill="#91a0b5" font-size="10">8 GB LPDDR4 | 8-core integrated Apple M1 GPU | Metal 3</text>
<text x="972" y="79" fill="#91a0b5" font-size="10">macOS 15.6.1 | arm64</text>
</g>
</svg>
