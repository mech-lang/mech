<text x="813.3" y="504" text-anchor="middle" class="axis">100</text>
<line x1="890.0" y1="120" x2="890.0" y2="480" class="grid"/>
<text x="890.0" y="504" text-anchor="middle" class="axis">120</text>
<line x1="966.7" y1="120" x2="966.7" y2="480" class="grid"/>
<text x="966.7" y="504" text-anchor="middle" class="axis">140</text>
<line x1="1043.3" y1="120" x2="1043.3" y2="480" class="grid"/>
<text x="1043.3" y="504" text-anchor="middle" class="axis">160</text>
<line x1="1120.0" y1="120" x2="1120.0" y2="480" class="grid"/>
<text x="1120.0" y="504" text-anchor="middle" class="axis">180</text>
<line x1="1196.7" y1="120" x2="1196.7" y2="480" class="grid"/>
<text x="1196.7" y="504" text-anchor="middle" class="axis">200</text>
<line x1="1273.3" y1="120" x2="1273.3" y2="480" class="grid"/>
