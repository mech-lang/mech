<text x="890.0" y="548" text-anchor="middle" class="muted" font-size="14">million EKF turns per second</text>
<rect x="1130" y="95" width="14" height="14" rx="2" fill="#40d4b0"/>
<text x="1152" y="107" font-size="14">Mech</text>
<rect x="1245" y="95" width="14" height="14" rx="2" fill="#b68cff"/>
<text x="1267" y="107" font-size="14">Taichi</text>
<text x="414" y="164" text-anchor="end" class="label">Taichi Metal GPU, checked</text>
<rect x="430" y="147" width="688.1" height="24" rx="3" fill="#b68cff" opacity="0.9"/>
<text x="1128.1" y="164" class="value">179.50</text>
<text x="414" y="206" text-anchor="end" class="label">Mech WGPU GPU, checked</text>
<rect x="430" y="189" width="586.4" height="24" rx="3" fill="#40d4b0" opacity="0.9"/>
<text x="1026.4" y="206" class="value">152.97</text>
<text x="414" y="248" text-anchor="end" class="label">Mech SIMD/JIT CPU, checked (8 workers)</text>
<rect x="430" y="231" width="401.7" height="24" rx="3" fill="#40d4b0" opacity="0.9"/>
<text x="841.7" y="248" class="value">104.78</text>
<text x="414" y="290" text-anchor="end" class="label">Taichi LLVM CPU, checked (8 workers)</text>
<rect x="430" y="273" width="329.8" height="24" rx="3" fill="#b68cff" opacity="0.9"/>
<text x="769.8" y="290" class="value">86.05</text>
<text x="414" y="332" text-anchor="end" class="label">Taichi Metal GPU, unchecked</text>
<rect x="430" y="315" width="851.8" height="24" rx="3" fill="#b68cff" opacity="0.9"/>
<text x="1291.8" y="332" class="value">222.21</text>
