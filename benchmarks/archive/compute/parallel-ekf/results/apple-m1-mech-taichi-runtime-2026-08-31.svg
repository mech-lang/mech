<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="576" viewBox="0 0 1500 576">
<rect width="100%" height="100%" fill="#080c14"/>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#e8edf5} .muted{fill:#91a0b5} .grid{stroke:#263246;stroke-width:1} .axis{fill:#91a0b5;font-size:13px} .label{font-size:15px} .value{font-size:14px;font-variant-numeric:tabular-nums}</style>
<text x="52" y="43" font-size="27" font-weight="700">Matched hardware EKF runtime throughput</text>
<text x="52" y="71" class="muted" font-size="15">Apple M1 | 500,000 resident filters x 40 turns | median of 3 isolated samples | checked fastest to slowest, then unchecked</text>
