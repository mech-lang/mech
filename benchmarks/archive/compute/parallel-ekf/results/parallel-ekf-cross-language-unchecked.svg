<text x="52" y="1475" class="muted" font-size="12">Rows are ordered by throughput from fastest to slowest. Hatched bars are GPU lanes; solid bars are CPU lanes. Checked rows include candidate validation/publication; unchecked rows explicitly omit those guarantees. Native Metal rows are direct command submission; WGPU rows are retained as a portable transport control. Futhark multicore rows show worker count explicitly; only the 1-worker row is a single-core comparison. Compilation, allocation, warmup, and final readback are excluded from the timed region.</text>
