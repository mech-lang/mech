<text x="52" y="422" class="muted" font-size="12">Checked rows validate and publish only valid candidates; unchecked rows omit those checks. Every GPU row submits and waits once per turn; setup, compilation, allocation, warmup, and final readback are excluded. Native Metal rows use direct Metal command submission; WGPU-over-Metal rows are shown only as a transport control.</text>
