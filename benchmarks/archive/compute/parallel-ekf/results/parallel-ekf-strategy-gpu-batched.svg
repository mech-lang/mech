<line x1="575.0" y1="110" x2="575.0" y2="180" class="grid"/>
<text x="575.0" y="204" text-anchor="middle" class="muted" font-size="12">1000</text>
<line x1="850.0" y1="110" x2="850.0" y2="180" class="grid"/>
<text x="850.0" y="204" text-anchor="middle" class="muted" font-size="12">2000</text>
<line x1="1125.0" y1="110" x2="1125.0" y2="180" class="grid"/>
<text x="1125.0" y="204" text-anchor="middle" class="muted" font-size="12">3000</text>
