<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="350" viewBox="0 0 1500 350">
<rect width="100%" height="100%" fill="#080c14"/>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#e8edf5}.muted{fill:#91a0b5}.grid{stroke:#263246;stroke-width:1}.label{font-size:15px}.value{font-size:13px;font-variant-numeric:tabular-nums}</style>
<text x="38" y="42" font-size="27" font-weight="700">Parallel EKF: GPU batch ceiling throughput</text>
<text x="38" y="69" class="muted" font-size="15">A device-resident multi-turn submission. This is a throughput ceiling, not a replacement for per-turn observation. Checked is solid; unchecked is lighter. Checked throughput is ranked fastest to slowest. Linear M/s axis.</text>
