<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="portable-combo-title portable-combo-desc">
<title id="portable-combo-title">One EKF source per system, two execution backends</title>
<desc id="portable-combo-desc">A two-panel poster chart compares checked and unchecked EKF throughput on CPU and Metal for Mech, Taichi, and Halide. Each system selects both backends from the same application source. Mech leads both CPU modes and checked Metal; Taichi is 0.08 percent higher on unchecked Metal, below either median absolute deviation. The notes state that this is descriptive and not a general language ranking.</desc>
<defs>
<pattern id="combo-gpu-mech" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><rect width="8" height="8" fill="#f4c430"/><path d="M0 0V8" stroke="#080c14" stroke-opacity="0.52" stroke-width="2"/></pattern>
<pattern id="combo-gpu-taichi" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><rect width="8" height="8" fill="#e36b6b"/><path d="M0 0V8" stroke="#080c14" stroke-opacity="0.52" stroke-width="2"/></pattern>
<pattern id="combo-gpu-halide" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><rect width="8" height="8" fill="#BD5E9E"/><path d="M0 0V8" stroke="#080c14" stroke-opacity="0.52" stroke-width="2"/></pattern>
</defs>
