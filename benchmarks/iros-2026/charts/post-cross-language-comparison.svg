<text x="1287.6" y="502" text-anchor="middle" class="axis">140</text>
<line x1="1421.5" y1="140" x2="1421.5" y2="475" class="grid"/>
<text x="1421.5" y="502" text-anchor="middle" class="axis">160</text>
<line x1="350" y1="199" x2="1455" y2="199" class="row-guide"/>
<text x="326" y="163" text-anchor="end" class="label">Rust packed SIMD</text>
<text x="326" y="184" text-anchor="end" class="detail">four-wide SIMD</text>
<line x1="1298.1" y1="165" x2="1334.4" y2="165" class="whisker"/>
<line x1="1298.1" y1="154" x2="1298.1" y2="176" class="whisker"/>
