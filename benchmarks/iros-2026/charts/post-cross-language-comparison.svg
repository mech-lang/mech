<circle cx="1298.1" cy="157" r="6" fill="#dea584" stroke="#080c14" stroke-width="2"><title>Rust packed SIMD sample: 141.568 million turns/s</title></circle>
<circle cx="1331.2" cy="165" r="6" fill="#dea584" stroke="#080c14" stroke-width="2"><title>Rust packed SIMD sample: 146.509 million turns/s</title></circle>
<circle cx="1334.4" cy="173" r="6" fill="#dea584" stroke="#080c14" stroke-width="2"><title>Rust packed SIMD sample: 146.999 million turns/s</title></circle>
<path d="M 1331.2 155 L 1341.2 165 L 1331.2 175 L 1321.2 165 Z" fill="#ffffff" stroke="#080c14" stroke-width="2"><title>Rust packed SIMD median: 146.509 million turns/s</title></path>
<text x="1352.4" y="170" class="value">146.509 · n=3</text>
<line x1="350" y1="271" x2="1455" y2="271" class="row-guide"/>
