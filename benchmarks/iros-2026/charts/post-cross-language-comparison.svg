<path d="M 1324.9 227 L 1334.9 237 L 1324.9 247 L 1314.9 237 Z" fill="#ffffff" stroke="#080c14" stroke-width="2"><title>Mech SIMD/JIT median: 145.573 million turns/s</title></path>
<text x="1355.0" y="242" class="value">145.573 · n=3</text>
