<line x1="1200.2" y1="298" x2="1200.2" y2="320" class="whisker"/>
<line x1="1211.6" y1="298" x2="1211.6" y2="320" class="whisker"/>
<circle cx="1200.2" cy="301" r="6" fill="#9558b2" stroke="#080c14" stroke-width="2"><title>Julia SIMD.jl sample: 126.952 million turns/s</title></circle>
<circle cx="1210.9" cy="309" r="6" fill="#9558b2" stroke="#080c14" stroke-width="2"><title>Julia SIMD.jl sample: 128.544 million turns/s</title></circle>
<circle cx="1211.6" cy="317" r="6" fill="#9558b2" stroke="#080c14" stroke-width="2"><title>Julia SIMD.jl sample: 128.650 million turns/s</title></circle>
<path d="M 1210.9 299 L 1220.9 309 L 1210.9 319 L 1200.9 309 Z" fill="#ffffff" stroke="#080c14" stroke-width="2"><title>Julia SIMD.jl median: 128.544 million turns/s</title></path>
<text x="1229.6" y="314" class="value">128.544 · n=3</text>
<line x1="350" y1="415" x2="1455" y2="415" class="row-guide"/>
<text x="326" y="379" text-anchor="end" class="label">NumPy/Numba</text>
<text x="326" y="400" text-anchor="end" class="detail">compiled array kernel</text>
<line x1="886.5" y1="381" x2="888.2" y2="381" class="whisker"/>
<line x1="886.5" y1="370" x2="886.5" y2="392" class="whisker"/>
<line x1="888.2" y1="370" x2="888.2" y2="392" class="whisker"/>
<circle cx="886.5" cy="373" r="6" fill="#4d77cf" stroke="#080c14" stroke-width="2"><title>NumPy/Numba sample: 80.111 million turns/s</title></circle>
<circle cx="887.9" cy="381" r="6" fill="#4d77cf" stroke="#080c14" stroke-width="2"><title>NumPy/Numba sample: 80.323 million turns/s</title></circle>
<circle cx="888.2" cy="389" r="6" fill="#4d77cf" stroke="#080c14" stroke-width="2"><title>NumPy/Numba sample: 80.358 million turns/s</title></circle>
<path d="M 887.9 371 L 897.9 381 L 887.9 391 L 877.9 381 Z" fill="#ffffff" stroke="#080c14" stroke-width="2"><title>NumPy/Numba median: 80.323 million turns/s</title></path>
<text x="906.2" y="386" class="value">80.323 · n=3</text>
<line x1="350" y1="475" x2="1455" y2="475" class="grid"/>
<text x="902.5" y="533" text-anchor="middle" class="muted" font-size="15">million EKF turns per second</text>
<text x="42" y="570" class="footnote">Mech and Rust additionally match block-atomic rollback. Julia and Numba reject invalid candidates per lane; all measured samples reported zero faults.</text>
<text x="42" y="595" class="footnote">Use this figure for the matched CPU execution shape; use the Mech backend figure for backend reach.</text>
</svg>
