<path d="M 1123.0 145 L 1133.0 155 L 1123.0 165 L 1113.0 155 Z" fill="#e8edf5" stroke="#080c14" stroke-width="2"><title>Mech SIMD/JIT median: 145.573 million turns/s</title></path>
<text x="245" y="189" class="value">median 145.573 · observed range 139.668–147.381 M turns/s</text>
<text x="221" y="253" text-anchor="end" class="label">Rust packed SIMD</text>
