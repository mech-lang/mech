<text x="1210.0" y="359" text-anchor="middle" class="axis">160</text>
<text x="221" y="161" text-anchor="end" class="label">Mech SIMD/JIT</text>
<line x1="1087.4" y1="155" x2="1133.9" y2="155" class="whisker"/>
<line x1="1087.4" y1="144" x2="1087.4" y2="166" class="whisker"/>
<line x1="1133.9" y1="144" x2="1133.9" y2="166" class="whisker"/>
<circle cx="1087.4" cy="146" r="6" fill="#f4c430" stroke="#080c14" stroke-width="2"><title>Mech SIMD/JIT sample: 139.668 million turns/s</title></circle>
<circle cx="1123.0" cy="155" r="6" fill="#f4c430" stroke="#080c14" stroke-width="2"><title>Mech SIMD/JIT sample: 145.573 million turns/s</title></circle>
