<text x="245" y="281" class="value">median 146.509 · observed range 141.568–146.999 M turns/s</text>
<text x="727.5" y="390" text-anchor="middle" class="muted" font-size="14">million EKF turns per second (zero-based scale)</text>
<text x="42" y="435" class="muted" font-size="13">Circles: retained process samples · diamond: median · whisker: observed min–max. The whisker is descriptive, not a confidence interval.</text>
