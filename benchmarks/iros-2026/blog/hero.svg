<title id="hero-title">A bearing-only EKF after 40 checked Mech turns</title>
<desc id="hero-desc">Generated by the actual Mech v0.4 WebAssembly kernel from source SHA-256 a7cd4077c7bf2f9741559b5748f05cf06e9b48e156c4fdbabfbdc7feea065eb2. Forty steps of 0.1 seconds use the live demo's deterministic sensor source, velocity 1, angular velocity 0.015, and noise scale 0.02. Estimated pose is 58.637, 26.664, 0.46. The purple ellipse uses the position covariance eigenvectors and two times the square roots of its eigenvalues; it is not a 95 percent confidence region. Landmark coordinates are 140, 12. JavaScript supplies sensor observations and draws these computed values.</desc>
