dot_indexing = ["subscript", "mech-core/dot_indexing", "mech-engine/dot_indexing", "mech-syntax/dot_indexing", "mech-runtime/dot_indexing"]
swizzle = ["subscript", "mech-core/swizzle", "mech-engine/swizzle", "mech-syntax/swizzle", "mech-runtime/swizzle"]

[dependencies]
mech-core = {version = "0.3.5", default-features = false}
mech-syntax = { version = "0.3.5", default-features = false}
mech-engine = { version = "0.3.5", default-features = false}
mech-runtime = { path = "../runtime", default-features = false }
mech-stdlib = { version = "0.3.5", path = "../stdlib", default-features = false }
mech-browser = { path = "../../hosts/browser", default-features = false, optional = true }
mech-time = { version = "0.3.5", path = "../../hosts/time", default-features = false, optional = true }
mech-console = { version = "0.3.5", path = "../../hosts/console", default-features = false, optional = true }
mech-timer = { version = "0.3.5", path = "../../hosts/timer", default-features = false, optional = true }
mech-scene = { version = "0.3.5", path = "../../hosts/scene", default-features = false, optional = true }
mech-compute = { version = "0.3.5", path = "../compute", optional = true }
mech-gpu = { version = "0.3.5", path = "../../hosts/gpu", default-features = false, optional = true }

wasm-bindgen = "0.2.100"
serde-wasm-bindgen = "0.6.5"
serde = { version = "1.0.228", features = ["derive"] }
js-sys = "0.3.77"
miniz_oxide = "0.8.9"
bincode = "2.0.1"
base64 = "0.22.1"
brotli = "8.0.1"
gloo-net = {version = "0.6.0", features = ["http"]}
wasm-bindgen-futures = "0.4.50"
web-time = "1.1.0"

[dev-dependencies]
mech-runtime = { path = "../runtime", default-features = false }
serde_json = "1"
wasm-bindgen-test = "0.3.50"

[dependencies.web-sys]
version = "0.3.77"
features = [
  'BinaryType',
  'Blob',
  'CanvasRenderingContext2d',
  'Clipboard',
  'console',
  'Crypto',
  'Document',
  'Element',
  'SvgElement',
  'Event',
  'ErrorEvent',
  'EventTarget',
  'FileReader',
  'HashChangeEvent',
  'HtmlCanvasElement',
  'HtmlCollection',
  'HtmlDivElement',
  'HtmlElement',
  'DomTokenList',
  'HtmlImageElement',
  'HtmlInputElement',
  'HtmlTextAreaElement',
  'InputEvent',
  'KeyboardEvent',
