math_atanh = ["math_trig", "mech-stdlib/math_atanh"]
math_cos = ["math_trig", "mech-stdlib/math_cos"]
math_cosh = ["math_trig", "mech-stdlib/math_cosh"]
math_cot = ["math_trig", "mech-stdlib/math_cot"]
math_csc = ["math_trig", "mech-stdlib/math_csc"]
math_sec = ["math_trig", "mech-stdlib/math_sec"]
math_sin = ["math_trig", "mech-stdlib/math_sin"]
math_sinh = ["math_trig", "mech-stdlib/math_sinh"]
math_tan = ["math_trig", "mech-stdlib/math_tan"]
math_tanh = ["math_trig", "mech-stdlib/math_tanh"]
math_add = ["math_ops", "mech-stdlib/math_add"]
math_sub = ["math_ops", "mech-stdlib/math_sub"]
math_mul = ["math_ops", "mech-stdlib/math_mul"]
math_div = ["math_ops", "mech-stdlib/math_div"]
math_pow = ["math_ops", "mech-stdlib/math_pow"]
math_mod = ["math_ops", "mech-stdlib/math_mod"]
math_neg = ["math_ops", "mech-stdlib/math_neg"]
math_sqrt = ["math_root", "mech-stdlib/math_sqrt"]

# Set
set_default = ["set_membership_default", "set_modify_default",
              "set_operations_default", "set_relations_default",
              "set_comprehensions", "set_setdata_default"]
set_comprehensions = ["set", "mech-stdlib/set_comprehensions"]
set_membership_default = ["set_element_of", "set_not_element_of"]
set_modify_default = ["set_insert", "set_remove"]
set_operations_default = ["set_cartesian_product", "set_difference", "set_intersection", "set_powerset", "set_symmetric_difference", "set_union"]
