# Subscripts
subscript = ["mech-core/subscript", "mech-engine/subscript", "mech-syntax/subscript", "mech-runtime/subscript"]
subscript_slice = ["subscript", "vectord", "mech-core/subscript_slice", "mech-engine/subscript_slice", "mech-syntax/subscript_slice", "mech-runtime/subscript_slice"]
