[package]
name = "mech-compute"
version = "0.3.5"
authors = ["Corey Montella <corey@mech-lang.org>"]
description = "Backend-neutral planning and intermediate representations for resident Mech compute regions."
documentation = "https://docs.mech-lang.org"
homepage = "https://mech-lang.org"
repository = "https://github.com/mech-lang/mech"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.92"

[features]
default = ["runtime-values"]
# Activation consumes canonical snapshots, not legacy F32 ValueCell storage.
# Applications select legacy value gates from their declared schema closure.
runtime-values = []

[dependencies]
mech-core = { version = "0.3.5", path = "../core", default-features = false, features = ["matrixd", "range"] }
mech-engine = { version = "0.3.5", path = "../engine", default-features = false, features = ["resident-artifact"] }

[dev-dependencies]
# Memory-layout fixtures deliberately construct legacy F32 cells. Production
# activation above uses canonical snapshots and does not require this gate.
mech-core = { path = "../core", default-features = false, features = ["f32"] }
