range_exclusive_increment = []

math_default = [
  "math_ops_default", "math_root_default",
  "math_ops_assign_default", "math_trig_default",
]
math = []
math_ops_default = ["math_add", "math_sub", "math_mul", "math_div", "math_pow", "math_mod", "math_neg"]
math_root_default = ["math_sqrt"]
math_ops_assign_default = ["math_add_assign", "math_sub_assign", "math_mul_assign", "math_div_assign"]
math_trig_default = [
  "math_acos", "math_acosh", "math_acot", "math_acsc", "math_asec",
  "math_asin", "math_asinh", "math_atan", "math_atan2", "math_atanh",
  "math_cos", "math_cosh", "math_cot", "math_csc", "math_sec",
  "math_sin", "math_sinh", "math_tan", "math_tanh",
]
math_trig = []
math_root = []
math_ops = []
math_op_assign = []
math_add_assign = []
math_sub_assign = []
math_mul_assign = []
math_div_assign = []
math_acos = []
math_acosh = []
math_acot = []
