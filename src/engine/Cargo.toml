[dependencies]
mech-bytecode = { version = "0.3.5", default-features = false, optional = true }
mech-core = { version = "0.3.5", default-features = false }
mech-syntax = { version = "0.3.5", default-features = false, optional = true }
mech-abi = { path = "../abi", optional = true }
libloading = { version = "0.8.9", optional = true }

paste = "1.0.15"
byteorder = "1.5.0"
grapheme = "1.3.0"
nalgebra = { version = "0.34.1", optional = true }
indexmap = { version = "2.13.0", optional = true }
bincode = { version = "2.0.1", optional = true }
serde = { version = "1.0.228", features = ["derive"] }

[dependencies.num-traits]
version = "0.2.19"
default-features = false
features = ["libm"]
optional = true

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
web-time = "1.1.0"

[[test]]
name = "bytecode_plan_topology"
required-features = ["compiler"]

[[bench]]
name = "program_checkpoint"
harness = false
required-features = ["baselib", "program", "compiler"]

[[bench]]
name = "reactive_turn_rollback"
harness = false
required-features = ["baselib", "program", "compiler"]

[[bench]]
name = "integrity_constraints"
harness = false
required-features = ["baselib", "program", "compiler", "invariant_define"]
