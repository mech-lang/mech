[package]
name = "mech-runtime"
version = "0.3.5"
authors = ["Corey Montella <corey@mech-lang.org>"]
description = "Runtime abstraction layer for Mech execution backends."
documentation = "https://docs.mech-lang.org"
homepage = "https://mech-lang.org"
repository = "https://github.com/mech-lang/mech"
keywords = ["mech", "language", "programming", "dataflow", "runtime"]
categories = ["science::robotics", "science", "game-engines", "web-programming"]
license = "Apache-2.0"
readme = "README.md"
edition = "2024"
rust-version = "1.92"

[features]
no_std = ["mech-core/no_std", "mech-engine/no_std"]

default = ["baselib", "pretty_print", "serde", "compiler", "program", "mika",
      "u8", "u16", "u32", "u64", "u128", 
      "i8", "i16", "i32", "i64", "i128", 
      "f32", "f64", "c64", "r64",
      "statements_default", "subscript_default", "state_machines",
      "watcher",
      "mech-core/default", "mech-engine/default"
      ]
base = ["baselib", "pretty_print", "serde", "compiler", "program", "mika",
      "statements_default", "subscript_default", "state_machines",
      "watcher",
      "mech-core/base", "mech-engine/base"
      ]

async = ["mech-engine/async"]
watcher = ["ignore", "notify"]
statements_default = ["variable_assign","variable_define","invariant_define","kind_define"]
subscript_default = ["subscript_slice", "subscript_range", "logical_indexing", "swizzle", "subscript_formula", "dot_indexing"]

stdlib = ["bool", "string", 
      "u8", "u16", "u32", "u64", "u128", 
      "i8", "i16", "i32", "i64", "i128", 
      "f32", "f64", "c64", "r64", 
      "set", "map", "table", "tuple", "record", "atom", "enum",
      "matrix1", "matrix2", "matrix3", "matrix4", "matrix2x3", "matrix3x2",
      "row_vector2", "row_vector3", "row_vector4",
      "vector2", "vector3", "vector4",
      "row_vectord", "vectord", "matrixd",
      "subscript_range", "logical_indexing", "swizzle",
      "subscript_formula", "dot_indexing",
      "variable_define", "variable_assign", "kind_define",
      "kind_annotation", "variables",
      "functions", "formulas"
    ]

sample_hold = ["mech-engine/sample_hold"]
state_step = ["mech-engine/state_step"]

baselib = ["bool", "string", 
      "f64", "c64", "r64",
      "set", "map", "table", "tuple", "record", "atom", "enum",
      "row_vectord", "vectord", "matrixd",
      "subscript_range", "logical_indexing", 
      "subscript_formula",
      "variable_define", "variable_assign", 
      "kind_define",
      "kind_annotation", "variables",
      "functions", "formulas",
    ]

compiler = ["mech-engine/compiler"]
program = ["mech-engine/program"]
pretty_print = ["mech-engine/pretty_print"]
serde = ["dep:serde", "dep:serde_derive", "mech-engine/serde"]
mika = ["mech-engine/mika"]
linked_stdlib = ["mech-engine/linked_stdlib"]

statements = ["mech-core/statements", "mech-engine/statements"]
variables = ["variable_define", "symbol_table", "mech-core/variables", "mech-engine/variables"]
variable_define = ["statements", "functions", "mech-core/variable_define", "mech-engine/variable_define"]
invariant_define = ["variable_define", "mech-core/invariant_define", "mech-engine/invariant_define"]
variable_assign = ["statements", "mech-core/variable_assign", "mech-engine/variable_assign"]
kind_define = ["kind_annotation", "statements", "mech-core/kind_define", "mech-engine/kind_define"]
kind_annotation = ["functions", "mech-core/kind_annotation", "mech-engine/kind_annotation"]
formulas = ["mech-core/formulas", "mech-engine/formulas"]
functions = ["symbol_table", "mech-core/functions", "mech-engine/functions"]
state_machines = ["functions", "mech-engine/state_machines"]
symbol_table = ["mech-core/symbol_table", "mech-engine/symbol_table"]

bool = ["mech-core/bool", "mech-engine/bool"]
string = ["mech-core/string", "mech-engine/string"]
      
# Numbers
numbers = ["mech-core/numbers", "mech-engine/numbers"]
complex = ["f64", "numbers", "mech-core/complex", "mech-engine/complex"]
rational = ["i64", "numbers", "mech-core/rational", "mech-engine/rational"]
signed_ints = ["numbers", "mech-core/signed_ints", "mech-engine/signed_ints"]
unsigned_ints = ["numbers", "mech-core/unsigned_ints", "mech-engine/unsigned_ints"]
floats = ["numbers", "mech-core/floats", "mech-engine/floats"]
u8 = ["unsigned_ints", "mech-core/u8", "mech-engine/u8"]
u16 = ["unsigned_ints", "mech-core/u16", "mech-engine/u16"]
u32 = ["unsigned_ints", "mech-core/u32", "mech-engine/u32"]
u64 = ["unsigned_ints", "mech-core/u64", "mech-engine/u64"]
u128 = ["unsigned_ints", "mech-core/u128", "mech-engine/u128"]
i8 = ["signed_ints", "mech-core/i8", "mech-engine/i8"]
i16 = ["signed_ints", "mech-core/i16", "mech-engine/i16"]
i32 = ["signed_ints", "mech-core/i32", "mech-engine/i32"]
i64 = ["signed_ints", "mech-core/i64", "mech-engine/i64"]
i128 = ["signed_ints", "mech-core/i128", "mech-engine/i128"]
f32 = ["floats", "mech-core/f32", "mech-engine/f32"]
f64 = ["floats", "mech-core/f64", "mech-engine/f64"]
c64 = ["complex", "mech-core/c64", "mech-engine/c64"]
r64 = ["rational", "mech-core/r64", "mech-engine/r64"]

# Structs
set = ["mech-core/set", "mech-engine/set"]
map = ["mech-core/map", "mech-engine/map"]
table = ["vectord", "record", "kind_annotation", "mech-core/table", "mech-engine/table"]
tuple = ["mech-core/tuple", "mech-engine/tuple"]
enum = ["mech-core/enum", "mech-engine/enum"]
record = ["tuple", "kind_annotation", "mech-core/record", "mech-engine/record"]
atom = ["mech-core/atom", "mech-engine/atom"]

# Matrix
matrix = ["mech-core/matrix", "mech-engine/matrix"]
fixed_row_vector = ["row_vector4", "row_vector3", "row_vector2", "mech-core/fixed_row_vector", "mech-engine/fixed_row_vector"]
fixed_vector = ["vector4", "vector3", "vector2", "mech-core/fixed_vector", "mech-engine/fixed_vector"]
fixed_matrix = ["matrix4", "matrix3", "matrix2", "matrix1", "matrix2x3", "matrix3x2", "mech-core/fixed_matrix", "mech-engine/fixed_matrix"]
dynamic_matrix = ["matrixd", "vectord", "row_vectord", "mech-core/dynamic_matrix", "mech-engine/dynamic_matrix"]
row_vector4 = ["matrix", "mech-core/row_vector4", "mech-engine/row_vector4"]
row_vector3 = ["matrix", "mech-core/row_vector3", "mech-engine/row_vector3"]
row_vector2 = ["matrix", "mech-core/row_vector2", "mech-engine/row_vector2"]
vector4 = ["matrix", "mech-core/vector4", "mech-engine/vector4"]
vector3 = ["matrix", "mech-core/vector3", "mech-engine/vector3"]
vector2 = ["matrix", "mech-core/vector2", "mech-engine/vector2"]
matrix4 = ["matrix", "mech-core/matrix4", "mech-engine/matrix4"]
matrix3 = ["matrix", "mech-core/matrix3", "mech-engine/matrix3"]
matrix2 = ["matrix", "mech-core/matrix2", "mech-engine/matrix2"]
matrix1 = ["matrix", "mech-core/matrix1", "mech-engine/matrix1"]
matrix2x3 = ["matrix", "mech-core/matrix2x3", "mech-engine/matrix2x3"]
matrix3x2 = ["matrix", "mech-core/matrix3x2", "mech-engine/matrix3x2"]
row_vectord =["matrix", "mech-core/row_vectord", "mech-engine/row_vectord"]
vectord = ["matrix", "mech-core/vectord", "mech-engine/vectord"]
matrixd = ["matrix", "mech-core/matrixd", "mech-engine/matrixd"]

# Subscripts
subscript = ["mech-core/subscript", "mech-engine/subscript"]
subscript_slice = ["subscript", "vectord", "mech-core/subscript_slice", "mech-engine/subscript_slice"]
subscript_range = ["subscript_slice","vectord", "mech-core/subscript_range", "mech-engine/subscript_range"]
subscript_formula = ["subscript_slice","formulas", "mech-core/subscript_formula", "mech-engine/subscript_formula"]
logical_indexing = ["subscript","vectord","bool", "mech-core/logical_indexing", "mech-engine/logical_indexing"]
dot_indexing = ["subscript", "mech-core/dot_indexing", "mech-engine/dot_indexing"]
swizzle = ["subscript", "mech-core/swizzle", "mech-engine/swizzle"]
notify = ["dep:notify"]
host_delegation = ["serde"]
host_delegation_signing = ["host_delegation", "dep:ed25519-dalek", "dep:rand_core"]

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
mech-host-cli = { path = "../../hosts/cli", features = ["provider"] }
serde_json = "1.0.150"
trybuild = "1.0.118"

[dependencies]
blake3 = "1.8.5"
mech-engine = { version = "0.3.5", default-features = false }
mech-core = { version = "0.3.5", default-features = false }
mech-interpreter = { version = "0.3.5", default-features = false }
mech-syntax = { version = "0.3.5", default-features = false }
serde = { version = "1.0.228", optional = true }
serde_derive = { version = "1.0.228", optional = true }
tracing = { version = "0.1.41", optional = true }
ignore = {version = "0.4.24", optional = true }
uuid = { version = "1.23.1", features = ["v7", "serde"] }
notify = { version = "8.2.0", optional = true }
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["alloc", "fast", "zeroize"], optional = true }
rand_core = { version = "0.6.4", optional = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
uuid = { version = "1.23.1", features = ["js"] }
web-time = "1.1.0"

[[bin]]
name = "address_target_diagnostics"
path = "src/bin/address_target_diagnostics.rs"
required-features = ["program", "bool"]

[[bin]]
name = "module_smoke"
path = "src/bin/module_smoke.rs"
required-features = ["program"]

[[example]]
name = "actor_context_host"
path = "examples/actor_context_host.rs"
required-features = ["program"]

[[example]]
name = "actor_state_host"
path = "examples/actor_state_host.rs"
required-features = ["program"]

[[example]]
name = "arbitrary_rust_host_function"
path = "examples/arbitrary_rust_host_function.rs"
required-features = ["program"]

[[example]]
name = "arbitrary_rust_host_functions2"
path = "examples/arbitrary_rust_host_functions2.rs"
required-features = ["program"]

[[example]]
name = "basic_runtime"
path = "examples/basic_runtime.rs"
required-features = ["program"]

[[example]]
name = "dep_cycle"
path = "examples/dep_cycle.rs"
required-features = ["program"]

[[example]]
name = "dep_diamond"
path = "examples/dep_diamond.rs"
required-features = ["program"]

[[example]]
name = "host_value_roundtrip"
path = "examples/host_value_roundtrip.rs"
required-features = ["program"]

[[example]]
name = "matrix_multiply"
path = "examples/matrix_multiply.rs"
required-features = ["program"]

[[example]]
name = "runtime_dep_src"
path = "examples/runtime_dep_src.rs"
required-features = ["program"]

[[example]]
name = "runtime_services_host"
path = "examples/runtime_services_host.rs"
required-features = ["program"]

[[example]]
name = "scheduled_actor_native_functions"
path = "examples/scheduled_actor_native_functions.rs"
required-features = ["program"]

[[example]]
name = "scheduled_actor_state_host"
path = "examples/scheduled_actor_state_host.rs"
required-features = ["program"]

[[example]]
name = "scheduled_runtime"
path = "examples/scheduled_runtime.rs"
required-features = ["program"]

[[example]]
name = "source_import_dependency"
path = "examples/source_import_dependency.rs"
required-features = ["program"]

[[example]]
name = "transactional_runtime"
path = "examples/transactional_runtime.rs"
required-features = ["program"]

[[test]]
name = "config_profile"
path = "tests/config_profile.rs"
required-features = ["program"]

[[test]]
name = "module_smoke"
path = "tests/module_smoke.rs"
required-features = ["program"]

[[bench]]
name = "program_transaction"
harness = false
required-features = ["baselib"]

[[bench]]
name = "reactive_transaction"
harness = false
required-features = ["baselib"]
