[package]
name = "mech-build"
version = "0.3.5"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
description = "Deterministic native application planning and generation for Mech."
publish = true

[features]
default = []
standard-hosts = [
  "dep:mech-host-cli",
  "dep:mech-host-console",
  "dep:mech-host-robot-arm",
  "dep:mech-host-scene",
  "dep:mech-host-time",
  "dep:mech-host-timer",
]

[dependencies]
mech-core = { version = "0.3.5", default-features = false, features = ["native-plan", "program", "serde"] }
mech-runtime = { version = "0.3.5", default-features = false, features = ["runtime", "serde", "string"] }
mech-host-cli = { version = "0.3.5", default-features = false, features = ["provider"], optional = true }
mech-host-console = { version = "0.3.5", default-features = false, features = ["native"], optional = true }
mech-host-robot-arm = { version = "0.3.5", default-features = false, features = ["provider"], optional = true }
mech-host-scene = { version = "0.3.5", default-features = false, features = ["native"], optional = true }
mech-host-time = { version = "0.3.5", default-features = false, features = ["native"], optional = true }
mech-host-timer = { version = "0.3.5", default-features = false, features = ["native"], optional = true }
cargo_metadata = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml_edit = "0.23"

[dev-dependencies]
mech-runtime = { version = "0.3.5", default-features = false, features = ["compiler_default"] }
mech-stdlib = { version = "0.3.5", default-features = false, features = ["standard_compiler"] }
tempfile = "3"
