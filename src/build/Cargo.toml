[package]
name = "mech-build"
version = "0.3.5"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
description = "Deterministic native application planning and generation for Mech."
publish = true

[features]
default = []
standard-hosts = [
  "dep:mech-terminal",
  "dep:mech-console",
  "dep:mech-scene",
  "dep:mech-time",
  "dep:mech-timer",
]
full-hosts = ["standard-hosts", "dep:mech-robot-arm"]

[dependencies]
mech-core = { version = "0.3.5", default-features = false, features = ["native-plan", "program", "serde"] }
mech-runtime = { version = "0.3.5", default-features = false, features = ["runtime", "serde", "string"] }
mech-terminal = { version = "0.3.5", default-features = false, features = ["provider"], optional = true }
mech-console = { version = "0.3.5", default-features = false, features = ["native"], optional = true }
mech-robot-arm = { version = "0.3.5", default-features = false, features = ["provider"], optional = true }
mech-scene = { version = "0.3.5", default-features = false, features = ["native"], optional = true }
mech-time = { version = "0.3.5", default-features = false, features = ["native"], optional = true }
mech-timer = { version = "0.3.5", default-features = false, features = ["native"], optional = true }
cargo_metadata = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml_edit = "0.23"

[dev-dependencies]
mech-native-live-host-fixture = { version = "0.3.5", path = "../../tests/fixtures/native-live-host" }
mech-runtime = { version = "0.3.5", default-features = false, features = ["compiler_default", "resident-routing-source"] }
mech-stdlib = { version = "0.3.5", default-features = false, features = ["native-plan", "full_compiler"] }
tempfile = "3"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }
