[package]
name = "mech-stdlib"
version = "0.3.5"
edition = "2024"
rust-version = "1.92"
description = "Explicit standard-library composition for Mech."
license = "Apache-2.0"
publish = false

[features]
default = ["standard_source"]

no_std = [
  "mech-core/no_std",
  "mech-engine/no_std",
  "mech-math?/no_std",
  "mech-compare?/no_std",
  "mech-logic?/no_std",
  "mech-range?/no_std",
  "mech-matrix?/no_std",
  "mech-set?/no_std",
  "mech-string?/no_std",
  "mech-stats?/no_std",
  "mech-combinatorics?/no_std",
]

runtime = ["mech-engine/runtime"]
source = [
  "runtime",
  "mech-engine/source",
  "mech-math?/source",
  "mech-compare?/source",
  "mech-logic?/source",
  "mech-range?/source",
  "mech-matrix?/source",
  "mech-set?/source",
  "mech-string?/source",
  "mech-stats?/source",
  "mech-combinatorics?/source",
]
compiler = [
  "source",
  "mech-engine/compiler",
  "mech-math?/compiler",
  "mech-compare?/compiler",
  "mech-logic?/compiler",
  "mech-range?/compiler",
  "mech-matrix?/compiler",
  "mech-set?/compiler",
  "mech-string?/compiler",
  "mech-stats?/compiler",
  "mech-combinatorics?/compiler",
]

mech-math = ["dep:mech-math"]
mech-compare = ["dep:mech-compare"]
mech-logic = ["dep:mech-logic"]
mech-range = ["dep:mech-range"]
mech-matrix = ["dep:mech-matrix"]
mech-set = ["dep:mech-set"]
mech-string = ["dep:mech-string"]
mech-stats = ["dep:mech-stats"]
mech-combinatorics = ["dep:mech-combinatorics"]

standard_runtime = ["runtime", "standard_values", "standard_operations"]
standard_source = ["standard_runtime", "source", "variables"]
standard_compiler = ["standard_source", "compiler"]

standard_values = [
  "bool", "string",
  "u8", "u16", "u32", "u64", "u128",
  "i8", "i16", "i32", "i64", "i128",
  "f32", "f64", "c64", "r64",
  "set", "map", "table", "tuple", "record", "atom", "enum",
  "row_vectord", "vectord", "matrixd",
]

standard_operations = [
  "access", "assign", "convert", "variable_define",
  "matrix_horzcat", "matrix_vertcat", "matrix_comprehensions",
  "set_define", "set_comprehensions", "table_ops",
  "math_default", "compare_default", "logic_default", "range_default",
  "matrix_default", "set_default", "string_default", "stats_default",
  "combinatorics_default",
]

# Engine-owned intrinsic operations.
access = ["mech-engine/access"]
assign = ["mech-engine/assign"]
convert = ["mech-engine/convert"]
variable_define = ["mech-engine/variable_define"]
variables = ["mech-engine/variables"]
matrix_horzcat = ["mech-engine/matrix_horzcat"]
matrix_vertcat = ["mech-engine/matrix_vertcat"]
matrix_comprehensions = ["mech-engine/matrix_comprehensions"]
set_define = ["mech-engine/set"]
set_comprehensions = ["mech-engine/set_comprehensions"]
table_ops = ["mech-engine/table"]

# Machine operation profiles.
math_default = [
  "mech-math", "mech-math/math_default",
  "math_add", "math_sub", "math_mul", "math_div", "math_pow", "math_mod",
  "math_neg", "math_add_assign", "math_sub_assign", "math_mul_assign",
  "math_div_assign", "math_sqrt", "math_acos", "math_acosh", "math_acot",
  "math_acsc", "math_asec", "math_asin", "math_asinh", "math_atan",
  "math_atan2", "math_atanh", "math_cos", "math_cosh", "math_cot",
  "math_csc", "math_sec", "math_sin", "math_sinh", "math_tan", "math_tanh",
]
compare_default = [
  "compare_eq", "compare_neq", "compare_seq", "compare_sneq", "compare_lt",
  "compare_gt", "compare_lte", "compare_gte", "compare_min", "compare_max",
]
logic_default = ["logic_and", "logic_or", "logic_not", "logic_xor"]
range_default = [
  "range_inclusive", "range_exclusive", "range_inclusive_increment",
  "range_exclusive_increment",
]
matrix_default = [
  "matrix_solve", "matrix_dot", "matrix_matmul", "matrix_transpose",
]
set_default = [
  "set_element_of", "set_not_element_of", "set_insert", "set_remove",
  "set_cartesian_product", "set_difference", "set_intersection", "set_powerset",
  "set_symmetric_difference", "set_union", "set_disjoint", "set_equals",
  "set_not_equals", "set_proper_subset", "set_proper_superset", "set_subset",
  "set_superset", "set_size",
]
string_default = ["string_concat"]
stats_default = ["stats_sum"]
combinatorics_default = ["combinatorics_n_choose_k"]

# Machine-owned leaf operations select the owning crate's concrete runtime
# implementation and, where syntax has a dedicated branch, its engine marker.
math_add = ["mech-math", "mech-math/add", "mech-engine/math_add"]
math_sub = ["mech-math", "mech-math/sub", "mech-engine/math_sub"]
math_mul = ["mech-math", "mech-math/mul", "mech-engine/math_mul"]
math_div = ["mech-math", "mech-math/div", "mech-engine/math_div"]
math_pow = ["mech-math", "mech-math/pow", "mech-engine/math_pow"]
