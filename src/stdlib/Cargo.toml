math_neg = ["mech-math", "mech-math/neg", "mech-engine/math_neg"]
math_add_assign = ["mech-math", "mech-math/add_assign", "mech-engine/math_add_assign"]
math_sub_assign = ["mech-math", "mech-math/sub_assign", "mech-engine/math_sub_assign"]
math_mul_assign = ["mech-math", "mech-math/mul_assign", "mech-engine/math_mul_assign"]
math_div_assign = ["mech-math", "mech-math/div_assign", "mech-engine/math_div_assign"]
math_sqrt = ["mech-math", "mech-math/sqrt", "mech-engine/math_sqrt"]
math_acos = ["mech-math", "mech-math/acos", "mech-engine/math_acos"]
math_acosh = ["mech-math", "mech-math/acosh", "mech-engine/math_acosh"]
math_acot = ["mech-math", "mech-math/acot", "mech-engine/math_acot"]
math_acsc = ["mech-math", "mech-math/acsc", "mech-engine/math_acsc"]
math_asec = ["mech-math", "mech-math/asec", "mech-engine/math_asec"]
math_asin = ["mech-math", "mech-math/asin", "mech-engine/math_asin"]
math_asinh = ["mech-math", "mech-math/asinh", "mech-engine/math_asinh"]
math_atan = ["mech-math", "mech-math/atan", "mech-engine/math_atan"]
math_atan2 = ["mech-math", "mech-math/atan2", "mech-engine/math_atan2"]
math_atanh = ["mech-math", "mech-math/atanh", "mech-engine/math_atanh"]
math_cos = ["mech-math", "mech-math/cos", "mech-engine/math_cos"]
math_cosh = ["mech-math", "mech-math/cosh", "mech-engine/math_cosh"]
math_cot = ["mech-math", "mech-math/cot", "mech-engine/math_cot"]
math_csc = ["mech-math", "mech-math/csc", "mech-engine/math_csc"]
math_sec = ["mech-math", "mech-math/sec", "mech-engine/math_sec"]
math_sin = ["mech-math", "mech-math/sin", "mech-engine/math_sin"]
math_sinh = ["mech-math", "mech-math/sinh", "mech-engine/math_sinh"]
math_tan = ["mech-math", "mech-math/tan", "mech-engine/math_tan"]
math_tanh = ["mech-math", "mech-math/tanh", "mech-engine/math_tanh"]

