[package]
name = "function-system-baseline"
version = "0.0.0"
edition = "2024"
publish = false

[features]
default = ["fixed-specialization-cases"]
fixed-specialization-cases = ["mech-stdlib/matrix2", "mech-stdlib/vector2"]

[dependencies]
mech-bytecode = {
  path = "../../../src/bytecode",
  default-features = false,
}
mech-core = {
  path = "../../../src/core",
  default-features = false,
}
mech-compare = {
  path = "../../../machines/compare",
  default-features = false,
}
mech-combinatorics = {
  path = "../../../machines/combinatorics",
  default-features = false,
  features = ["n_choose_k"],
}
mech-engine = {
  path = "../../../src/engine",
  default-features = false,
  features = ["compiler"],
}
mech-stdlib = {
  path = "../../../src/stdlib",
  default-features = false,
  features = ["standard_compiler"],
}
mech-logic = {
  path = "../../../machines/logic",
  default-features = false,
}
mech-math = {
  path = "../../../machines/math",
  default-features = false,
}
mech-matrix = {
  path = "../../../machines/matrix",
  default-features = false,
}
mech-range = {
  path = "../../../machines/range",
  default-features = false,
}
mech-set = {
  path = "../../../machines/set",
  default-features = false,
}
mech-stats = {
  path = "../../../machines/stats",
  default-features = false,
}
mech-string = {
  path = "../../../machines/string",
  default-features = false,
}
nalgebra = "0.34.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[patch.crates-io]
mech-bytecode = { path = "../../../src/bytecode" }
mech-core = { path = "../../../src/core" }
mech-syntax = { path = "../../../src/syntax" }
mech-engine = { path = "../../../src/engine" }
mech-stdlib = { path = "../../../src/stdlib" }
mech-runtime = { path = "../../../src/runtime" }
mech-abi = { path = "../../../src/abi" }
mech-math = { path = "../../../machines/math" }
mech-compare = { path = "../../../machines/compare" }
mech-logic = { path = "../../../machines/logic" }
mech-range = { path = "../../../machines/range" }
mech-matrix = { path = "../../../machines/matrix" }
mech-set = { path = "../../../machines/set" }
mech-string = { path = "../../../machines/string" }
mech-stats = { path = "../../../machines/stats" }
mech-combinatorics = { path = "../../../machines/combinatorics" }

[workspace]
