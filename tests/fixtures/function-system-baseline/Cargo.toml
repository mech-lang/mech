[package]
name = "function-system-baseline"
version = "0.0.0"
edition = "2024"
publish = false

[features]
default = ["fixed-specialization-cases"]
fixed-specialization-cases = ["mech-stdlib/matrix2", "mech-stdlib/vector2"]

[dependencies]
mech-core = {
  path = "../../../src/core",
  default-features = false,
}
mech-compare = {
  git = "https://github.com/mech-machines/compare",
  rev = "76ede1334959cad82fe9d2910f81a7443523a65e",
  default-features = false,
}
mech-combinatorics = {
  git = "https://github.com/mech-machines/combinatorics",
  rev = "56f63b9307cbae42ca006bd1b64000e204204f13",
  default-features = false,
  features = ["n_choose_k"],
}
mech-engine = {
  path = "../../../src/engine",
  default-features = false,
  features = ["compiler"],
}
mech-stdlib = {
  path = "../../../src/stdlib",
  default-features = false,
  features = ["full_compiler"],
}
mech-logic = {
  git = "https://github.com/mech-machines/logic",
  rev = "48e4af75049de392096a476953d75730ed994be7",
  default-features = false,
}
mech-math = {
  path = "../../../machines/math",
  default-features = false,
}
mech-matrix = {
  git = "https://github.com/mech-machines/matrix",
  rev = "c42d160582abd08a4d541a917786177ae1a59279",
  default-features = false,
}
mech-range = {
  git = "https://github.com/mech-machines/range",
  rev = "dde5e840605447d08317c85f4ccc6926463c0a1d",
  default-features = false,
}
mech-set = {
  path = "../../../machines/set",
  default-features = false,
}
mech-stats = {
  path = "../../../machines/stats",
  default-features = false,
}
mech-string = {
  path = "../../../machines/string",
  default-features = false,
}
nalgebra = "0.34.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[patch.crates-io]
mech-bytecode = { path = "../../../src/bytecode" }
mech-core = { path = "../../../src/core" }
mech-syntax = { path = "../../../src/syntax" }
mech-engine = { path = "../../../src/engine" }
mech-stdlib = { path = "../../../src/stdlib" }
mech-runtime = { path = "../../../src/runtime" }
mech-abi = { path = "../../../src/abi" }
mech-math = { path = "../../../machines/math" }
mech-compare = { git = "https://github.com/mech-machines/compare", rev = "76ede1334959cad82fe9d2910f81a7443523a65e" }
mech-logic = { git = "https://github.com/mech-machines/logic", rev = "48e4af75049de392096a476953d75730ed994be7" }
mech-range = { git = "https://github.com/mech-machines/range", rev = "dde5e840605447d08317c85f4ccc6926463c0a1d" }
mech-matrix = { git = "https://github.com/mech-machines/matrix", rev = "c42d160582abd08a4d541a917786177ae1a59279" }
mech-set = { path = "../../../machines/set" }
mech-string = { path = "../../../machines/string" }
mech-stats = { path = "../../../machines/stats" }
mech-combinatorics = { git = "https://github.com/mech-machines/combinatorics", rev = "56f63b9307cbae42ca006bd1b64000e204204f13" }

[workspace]
