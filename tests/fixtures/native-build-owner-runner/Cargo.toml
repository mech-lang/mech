[package]
name = "native-build-owner-runner"
version = "0.0.0"
edition = "2024"
publish = false

[features]
default = []
standard = [
  "dep:mech-stdlib",
  "mech-runtime/invariant_define",
  "mech-stdlib/native-plan",
  "mech-stdlib/full_runtime",
]
fixed = [
  "dep:mech-engine",
  "dep:mech-math",
  "mech-engine/bool",
  "mech-engine/f64",
  "mech-engine/matrix2",
  "mech-engine/matrix_horzcat",
  "mech-engine/matrix_vertcat",
  "mech-engine/native-plan",
  "mech-engine/row_vector2",
  "mech-engine/runtime",
  "mech-engine/vector2",
  "mech-math/add",
  "mech-math/f64",
  "mech-math/matrix2",
  "mech-math/native-plan",
  "mech-math/runtime",
]

[dependencies]
mech-build = {
  path = "../../../src/build",
  default-features = false,
  features = ["full-hosts"],
}
mech-core = {
  path = "../../../src/core",
  default-features = false,
  features = ["native-plan", "program", "serde"],
}
mech-engine = { path = "../../../src/engine", default-features = false, optional = true }
mech-math = { path = "../../../machines/math", default-features = false, optional = true }
mech-runtime = {
  path = "../../../src/runtime",
  default-features = false,
  features = ["runtime", "serde", "string"],
}
mech-stdlib = { path = "../../../src/stdlib", default-features = false, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[patch.crates-io]
mech-build = { path = "../../../src/build" }
mech-bytecode = { path = "../../../src/bytecode" }
mech-core = { path = "../../../src/core" }
mech-syntax = { path = "../../../src/syntax" }
mech-engine = { path = "../../../src/engine" }
mech-runtime = { path = "../../../src/runtime" }
mech-stdlib = { path = "../../../src/stdlib" }
mech-terminal = { path = "../../../hosts/terminal" }
mech-console = { path = "../../../hosts/console" }
mech-robot-arm = { path = "../../../hosts/robot-arm" }
mech-scene = { path = "../../../hosts/scene" }
mech-time = { path = "../../../hosts/time" }
mech-timer = { path = "../../../hosts/timer" }
mech-combinatorics = { git = "https://github.com/mech-machines/combinatorics", rev = "56f63b9307cbae42ca006bd1b64000e204204f13" }
mech-compare = { git = "https://github.com/mech-machines/compare", rev = "76ede1334959cad82fe9d2910f81a7443523a65e" }
mech-logic = { git = "https://github.com/mech-machines/logic", rev = "48e4af75049de392096a476953d75730ed994be7" }
mech-math = { path = "../../../machines/math" }
mech-matrix = { git = "https://github.com/mech-machines/matrix", rev = "c42d160582abd08a4d541a917786177ae1a59279" }
mech-range = { git = "https://github.com/mech-machines/range", rev = "dde5e840605447d08317c85f4ccc6926463c0a1d" }
mech-set = { path = "../../../machines/set" }
mech-stats = { path = "../../../machines/stats" }
mech-string = { path = "../../../machines/string" }

[workspace]
