[package]
name = "bytecode-v1-source-generator"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
mech-build = {
  path = "../../../src/build",
  default-features = false,
  features = ["full-hosts"],
}
mech-core = {
  path = "../../../src/core",
  default-features = false,
  features = ["program"],
}
mech-engine = {
  path = "../../../src/engine",
  default-features = false,
  features = ["compiler"],
}
mech-native-live-host-fixture = { path = "../native-live-host" }
mech-runtime = {
  path = "../../../src/runtime",
  default-features = false,
  features = ["compiler", "runtime_default", "serde"],
}
mech-stdlib = {
  path = "../../../src/stdlib",
  default-features = false,
  features = ["native-plan", "full_compiler"],
}
serde_json = "1"

[patch.crates-io]
mech-build = { path = "../../../src/build" }
mech-bytecode = { path = "../../../src/bytecode" }
mech-core = { path = "../../../src/core" }
mech-syntax = { path = "../../../src/syntax" }
mech-engine = { path = "../../../src/engine" }
mech-runtime = { path = "../../../src/runtime" }
mech-stdlib = { path = "../../../src/stdlib" }
mech-terminal = { path = "../../../hosts/terminal" }
mech-console = { path = "../../../hosts/console" }
mech-time = { path = "../../../hosts/time" }
mech-timer = { path = "../../../hosts/timer" }
mech-scene = { path = "../../../hosts/scene" }
mech-robot-arm = { path = "../../../hosts/robot-arm" }
mech-native-live-host-fixture = { path = "../native-live-host" }
mech-combinatorics = { path = "../../../machines/combinatorics" }
mech-compare = { path = "../../../machines/compare" }
mech-logic = { path = "../../../machines/logic" }
mech-math = { path = "../../../machines/math" }
mech-matrix = { path = "../../../machines/matrix" }
mech-range = { path = "../../../machines/range" }
mech-set = { path = "../../../machines/set" }
mech-stats = { path = "../../../machines/stats" }
mech-string = { path = "../../../machines/string" }

[workspace]
