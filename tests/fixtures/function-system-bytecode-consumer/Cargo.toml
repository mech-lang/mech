[package]
name = "function-system-bytecode-consumer"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
mech-core = {
  path = "../../../src/core",
  default-features = false,
  features = ["bool"],
}
mech-interpreter = {
  path = "../../../src/interpreter",
  default-features = false,
  features = [
    "program",
    "functions",
    "symbol_table",
    "f64",
    "row_vectord",
    "vectord",
    "matrix_horzcat",
  ],
}
mech-program = {
  path = "../../../src/program",
  default-features = false,
  features = [
    "program",
    "functions",
    "symbol_table",
  ],
}
mech-math = {
  path = "../../../machines/math",
  default-features = false,
  features = ["program", "functions", "f64", "row_vectord", "add", "cos"],
}
mech-range = {
  path = "../../../machines/range",
  default-features = false,
  features = ["program", "functions", "formulas", "f64", "row_vectord", "inclusive"],
}
mech-string = {
  path = "../../../machines/string",
  default-features = false,
  features = ["program", "functions", "string", "concat"],
}
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[patch.crates-io]
mech-core = { path = "../../../src/core" }
mech-syntax = { path = "../../../src/syntax" }
mech-interpreter = { path = "../../../src/interpreter" }
mech-program = { path = "../../../src/program" }
mech-compare = { path = "../../../machines/compare" }
mech-logic = { path = "../../../machines/logic" }
mech-math = { path = "../../../machines/math" }
mech-matrix = { path = "../../../machines/matrix" }
mech-range = { path = "../../../machines/range" }
mech-set = { path = "../../../machines/set" }
mech-string = { path = "../../../machines/string" }

[workspace]
