[dependencies]
mech-combinatorics = { path = "../../../machines/combinatorics", default-features = false, optional = true }
mech-compare = { path = "../../../machines/compare", default-features = false, optional = true }
mech-core = { path = "../../../src/core", default-features = false, optional = true }
mech-engine = { path = "../../../src/engine", default-features = false, optional = true }
mech-logic = { path = "../../../machines/logic", default-features = false, optional = true }
mech-math = { path = "../../../machines/math", default-features = false, optional = true }
mech-matrix = { path = "../../../machines/matrix", default-features = false, optional = true }
mech-range = { path = "../../../machines/range", default-features = false, optional = true }
mech-set = { path = "../../../machines/set", default-features = false, optional = true }
mech-stats = { path = "../../../machines/stats", default-features = false, optional = true }
mech-stdlib = { path = "../../../src/stdlib", default-features = false, optional = true }
mech-string = { path = "../../../machines/string", default-features = false, optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[patch.crates-io]
mech-core = { path = "../../../src/core" }
mech-syntax = { path = "../../../src/syntax" }
mech-engine = { path = "../../../src/engine" }
mech-stdlib = { path = "../../../src/stdlib" }
mech-math = { path = "../../../machines/math" }
mech-compare = { path = "../../../machines/compare" }
mech-logic = { path = "../../../machines/logic" }
mech-range = { path = "../../../machines/range" }
mech-matrix = { path = "../../../machines/matrix" }
mech-set = { path = "../../../machines/set" }
mech-string = { path = "../../../machines/string" }
mech-stats = { path = "../../../machines/stats" }
mech-combinatorics = { path = "../../../machines/combinatorics" }

[workspace]
