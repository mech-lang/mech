  "installer-profile",
  "dep:mech-core",
  "dep:mech-engine",
  "mech-engine/bool",
  "mech-engine/f64",
  "mech-engine/matrix_horzcat",
  "mech-engine/matrixd",
  "mech-engine/native-link",
  "mech-engine/row_vectord",
  "mech-engine/runtime",
  "mech-engine/vectord",
]
