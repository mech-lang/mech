installer-vertical-concatenate-r2-r2-f64 = [
  "installer-profile",
  "dep:mech-core",
  "dep:mech-engine",
  "mech-engine/bool",
  "mech-engine/f64",
  "mech-engine/matrix2",
  "mech-engine/matrix_vertcat",
