  "mech-engine/vector2",
]
installer-vertical-concatenate-n-args-f64 = [
  "installer-profile",
  "dep:mech-core",
  "dep:mech-engine",
  "mech-engine/bool",
  "mech-engine/f64",
  "mech-engine/matrix_vertcat",
