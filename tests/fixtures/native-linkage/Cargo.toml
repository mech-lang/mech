[package]
name = "native-linkage-fixture"
version = "0.0.0"
edition = "2024"
publish = false

[features]
default = []
standard = [
  "dep:mech-core",
  "dep:mech-stdlib",
  "dep:serde",
  "dep:serde_json",
  "mech-stdlib/native-plan",
  "mech-stdlib/standard_runtime",
]
representatives = [
  "dep:mech-core",
  "dep:mech-engine",
  "dep:mech-math",
  "dep:serde",
  "dep:serde_json",
  "mech-core/native-plan",
  "mech-engine/bool",
  "mech-engine/f64",
  "mech-engine/matrix2",
  "mech-engine/matrix_horzcat",
  "mech-engine/matrix_vertcat",
  "mech-engine/matrixd",
  "mech-engine/native-plan",
  "mech-engine/row_vector2",
  "mech-engine/row_vectord",
  "mech-engine/string",
  "mech-engine/variable_define",
  "mech-engine/vector2",
