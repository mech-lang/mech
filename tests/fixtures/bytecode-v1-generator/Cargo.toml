[package]
name = "bytecode-v1-generator"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
mech-core = {
  path = "../../../src/core",
  default-features = false,
  features = ["program"],
}
mech-engine = {
  path = "../../../src/engine",
  default-features = false,
  features = ["compiler"],
}
mech-host-cli = {
  path = "../../../hosts/cli",
  default-features = false,
  features = ["provider"],
}
mech-native-live-host-fixture = {
  path = "../native-live-host",
}
mech-runtime = {
  path = "../../../src/runtime",
  default-features = false,
  features = ["compiler", "f64", "string"],
}
mech-stdlib = {
  path = "../../../src/stdlib",
  default-features = false,
  features = ["standard_compiler"],
}
serde_json = "1.0.149"
sha2 = "0.10"
tempfile = "3"

[patch.crates-io]
mech-bytecode = { path = "../../../src/bytecode" }
mech-core = { path = "../../../src/core" }
mech-syntax = { path = "../../../src/syntax" }
mech-engine = { path = "../../../src/engine" }
mech-runtime = { path = "../../../src/runtime" }
mech-stdlib = { path = "../../../src/stdlib" }
mech-host-cli = { path = "../../../hosts/cli" }
mech-combinatorics = { path = "../../../machines/combinatorics" }
mech-compare = { path = "../../../machines/compare" }
mech-logic = { path = "../../../machines/logic" }
mech-math = { path = "../../../machines/math" }
mech-matrix = { path = "../../../machines/matrix" }
mech-range = { path = "../../../machines/range" }
mech-set = { path = "../../../machines/set" }
mech-stats = { path = "../../../machines/stats" }
mech-string = { path = "../../../machines/string" }

[workspace]
