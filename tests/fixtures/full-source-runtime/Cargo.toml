[package]
name = "full-source-runtime"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
mech-core = {
  path = "../../../src/core",
  default-features = false,
}
mech-runtime = {
  path = "../../../src/runtime",
  default-features = false,
  features = ["full_source", "resident-routing-source"],
}
mech-stdlib = {
  path = "../../../src/stdlib",
  default-features = false,
  features = ["full_source"],
}
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[patch.crates-io]
mech-core = { path = "../../../src/core" }
mech-syntax = { path = "../../../src/syntax" }
mech-engine = { path = "../../../src/engine" }
mech-runtime = { path = "../../../src/runtime" }
mech-stdlib = { path = "../../../src/stdlib" }
mech-combinatorics = { path = "../../../machines/combinatorics" }
mech-compare = { path = "../../../machines/compare" }
mech-logic = { path = "../../../machines/logic" }
mech-math = { path = "../../../machines/math" }
mech-matrix = { path = "../../../machines/matrix" }
mech-range = { path = "../../../machines/range" }
mech-set = { path = "../../../machines/set" }
mech-stats = { path = "../../../machines/stats" }
mech-string = { path = "../../../machines/string" }

[workspace]

# This isolated product fixture does not inherit the workspace's build profile.
# Its large source catalog must use the same bounded preparation policy in CI
# and local invocations, including browser consumers without Cargo environment.
[profile.dev]
debug = 0
incremental = false
