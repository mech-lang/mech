<!doctype html>
<html lang="en" data-mech-document-status="loading" data-mech-shim="docs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <link rel="icon" href="https://gitlab.com/mech-lang/assets/-/raw/main/images/icons/favicon.ico?ref_type=heads" type="image/x-icon">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css" crossorigin="anonymous">
  <script defer src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js" crossorigin="anonymous"></script>
  <style data-mech-style-layer="source">{{MECH_SOURCE_STYLESHEET}}</style>
  <style data-mech-style-layer="mechdown">{{MECHDOWN_STYLESHEET}}</style>
  <style data-mech-style-layer="page">{{PAGE_STYLESHEET}}</style>
  <style data-mech-style-layer="repl">{{MECH_REPL_STYLESHEET}}</style>
</head>
<body>
  <main
    class="workspace mech-root"
    id="workspace"
    data-mech-document-status="loading"
    data-mech-presentation="{{PRESENTATION}}"
    data-mech-console-mode="docked"
    mech-engine-id="0"
    data-mech-source-url-key="{{SOURCE_URL_KEY}}"
    aria-label="Documentation workspace"
    data-mech-repl-host>
    <section class="content-shell" id="contentShell">
      <div class="content-column">
        <div
          class="docs-layout article-layout"
          id="articleLayout"
          data-mech-toc-mode="persistent"
          data-mech-compact-toc="hidden">
          {{TOC}}
          <article class="main-content docs-content" aria-label="Documentation article" data-mechdown>
            <header class="docs-header">
              <p class="docs-kicker">{{SECTION}}</p>
              <h1>{{TITLE}}</h1>
              <div class="version-badge"><span>{{VERSION}}</span></div>
            </header>
            <section class="article-intro docs-intro" id="articleIntro" aria-label="Introduction">
              {{ABSTRACT}}
              {{INTRO}}
            </section>
            {{CONTENT}}
          </article>
        </div>

        <section class="article-backmatter" aria-label="Documentation notes and works cited">
          <div class="backmatter-row backmatter-notes">
            <div class="backmatter-body" data-mechdown>{{FOOTNOTES}}</div>
          </div>
          <div class="backmatter-row backmatter-cited">
            <div class="backmatter-body" data-mechdown>{{CITED}}</div>
          </div>
        </section>

      </div>
    </section>

    <div class="resize-handle" role="separator" aria-orientation="vertical" aria-label="Resize console" data-mech-console-resizer data-mech-console-resize-axis="width"></div>
    <div class="edge-handle" aria-hidden="true" data-mech-console-edge-handle data-mech-console-resizer data-mech-console-resize-axis="width"></div>

    <aside class="console-pane" aria-label="Document console" data-mech-console-pane>
      <div class="console-topbar">
        <div class="console-tabs" role="tablist" aria-label="Console sections">
          <button class="console-tab" id="mech-console-tab-output" type="button" role="tab" aria-selected="false" aria-controls="mech-console-panel-output" data-mech-console-tab="output">Output</button>
          <button class="console-tab" id="mech-console-tab-console" type="button" role="tab" aria-selected="true" aria-controls="mech-console-panel-console" data-mech-console-tab="console">Console</button>
          <button class="console-tab" id="mech-console-tab-errors" type="button" role="tab" aria-selected="false" aria-controls="mech-console-panel-errors" data-mech-console-tab="errors">Errors</button>
        </div>
        <button class="output-fullscreen-toggle" type="button" aria-pressed="false" aria-label="Enter fullscreen output" data-mech-output-fullscreen>
          <span aria-hidden="true">⛶</span>
        </button>
        <button class="console-fullscreen-toggle" type="button" aria-pressed="false" aria-label="Enter fullscreen workspace" data-mech-console-fullscreen>
          <span aria-hidden="true">⛶</span>
        </button>
      </div>
      <div class="console-panels">
        <section class="console-panel" id="mech-console-panel-console" role="tabpanel" aria-labelledby="mech-console-tab-console" data-mech-console-panel="console">
          {{REPL}}
        </section>
        <section class="console-panel" id="mech-console-panel-output" role="tabpanel" aria-labelledby="mech-console-tab-output" data-mech-console-panel="output" hidden>
          <div class="console-scroll" data-mech-output-panel></div>
        </section>
        <section class="console-panel" id="mech-console-panel-errors" role="tabpanel" aria-labelledby="mech-console-tab-errors" data-mech-console-panel="errors" hidden>
          <div class="console-scroll" data-mech-errors-panel aria-live="polite"></div>
        </section>
      </div>
    </aside>
  </main>

  <script type="application/x-mech-code" id="mech-document-code" data-mech-document-code>
{{CODE}}
  </script>
  <script>
    window.addEventListener("error", event => {
      if (!event.error) return;
      document.documentElement.dataset.mechWindowError = event.message || String(event.error);
    });
    window.addEventListener("unhandledrejection", event => {
      document.documentElement.dataset.mechUnhandledRejection = String(event.reason);
    });
  </script>
  <script
    type="module"
    data-mech-document-controller
    data-mech-wasm-module="{{WASM_MODULE_URL}}">
{{DOCUMENT_SCRIPT}}
  </script>
  <script type="application/x-mech-source-bundle" data-mech-document-sources>
{{DOCUMENT_SOURCES}}
  </script>
</body>
</html>
