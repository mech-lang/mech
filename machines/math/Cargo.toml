[package]
name = "mech-math"
version = "0.3.5"
authors = ["Corey Montella <corey@mech-lang.org>", "Steven McPhillimey <slm526@lehigh.edu>", "Liam Messinger <ljm426@lehigh.edu>", "Natalie Dumler <nad326@lehigh.edu>"]
description = "Math library for the Mech language"
documentation = "http://docs.mech-lang.org"
homepage = "https://mech-lang.org"
repository = "https://github.com/mech-machines/math"
keywords = ["mech", "language", "programming"]
license = "Apache-2.0"
readme = "README.md"
edition = "2024"

[badges]
gitlab = { repository = "mech-lang/machines/math", branch = "main" }
maintenance = { status = "actively-developed" }

[lib]
crate-type = ["rlib", "cdylib"]

[features]
no_std = ["dep:mech-core", "mech-core/no_std"]

default = []
runtime = ["dep:mech-core", "mech-core/functions"]
source = ["runtime"]
compiler = ["runtime", "mech-core/compiler"]
native-plan = ["runtime", "mech-core/native-plan"]
native-link = ["runtime"]
full_values = [
  "bool", "u8", "u16", "u32", "u64", "u128",
  "i8", "i16", "i32", "i64", "i128", "f32", "f64", "c64", "r64",
  "matrix1", "matrix2", "matrix3", "matrix4", "matrix2x3", "matrix3x2",
  "row_vector2", "row_vector3", "row_vector4",
  "vector2", "vector3", "vector4", "row_vectord", "vectord", "matrixd",
]
full_runtime = ["runtime", "full_values", "math_default"]
full_source = ["full_runtime", "source"]
full_compiler = ["full_source", "compiler"]

arithmetic_default = ["copysign", "abs", "fdim", "fmod", "nextafter", "remainder"]
bessel_default = ["j0", "j1", "jn", "y0", "y1", "yn"]
exponential_default = ["exp", "exp2", "exp10", "expm1"]
gamma_default = ["lgamma", "tgamma"]
logarithm_default = ["log", "log1p", "log10", "log2"]
ops_default = ["add", "sub", "mul", "div", "pow", "mod", "neg"]
ops_assign_default = ["add_assign", "sub_assign", "mul_assign", "div_assign"]
root_default = ["cbrt", "sqrt"]
rounding_default = ["ceil", "floor", "rint", "round", "roundeven", "trunc"]
stat_error_default = ["erf", "erfc"]
trig_default = ["acos", "acosh", "acot", "acsc", "asec", "asin", "asinh", "atan", "atan2", "atanh", "cos", "cosh", "cot", "csc", "hypot", "sec", "sin", "sinh", "tan", "tanh"]

math_default = ["arithmetic_default", "bessel_default", "exponential_default",
                "gamma_default", "logarithm_default", "ops_default", "ops_assign_default",
                "root_default", "rounding_default", "stat_error_default", "trig_default"] 

math = ["runtime", "dep:num-traits", "dep:libm", "dep:paste"]
dynamic-module = ["dep:mech-abi", "dep:libm"]
arithmetic = ["runtime", "math"]
bessel = ["runtime", "math"]
exp = ["runtime", "math"]
gamma = ["runtime", "math"]
logarithm = ["runtime", "math"]
ops = ["runtime", "math"]
op_assign = ["runtime", "math"]
root = ["runtime", "math"]
rounding = ["runtime", "math"]
stat_error = ["runtime", "math"]
trig = ["runtime", "math"]
add_assign = ["runtime", "op_assign"]
sub_assign = ["runtime", "op_assign"]
mul_assign = ["runtime", "op_assign"]
div_assign = ["runtime", "op_assign"]

copysign = ["runtime", "arithmetic"]
abs = ["runtime", "arithmetic"]
fdim = ["runtime", "arithmetic"]
fmod = ["runtime", "arithmetic"]
nextafter = ["runtime", "arithmetic"]
remainder = ["runtime", "arithmetic"]

j0 = ["runtime", "bessel"]
j1 = ["runtime", "bessel"]
jn = ["runtime", "bessel"]
y0 = ["runtime", "bessel"]
y1 = ["runtime", "bessel"]
yn = ["runtime", "bessel"]

exp2 = ["runtime", "exp"]
exp10 = ["runtime", "exp"]
expm1 = ["runtime", "exp"]

lgamma = ["runtime", "gamma"]
tgamma = ["runtime", "gamma"]

log = ["runtime", "logarithm"]
log1p = ["runtime", "logarithm"]
log10 = ["runtime", "logarithm"]
log2 = ["runtime", "logarithm"]

add = ["runtime", "ops"]
div = ["runtime", "ops"]
pow = ["runtime", "ops", "mech-core/math_pow"]
mod = ["runtime", "ops"]
mul = ["runtime", "ops"]
neg = ["runtime", "dep:simba", "ops"]
sub = ["runtime", "ops"]

cbrt = ["runtime", "root"]
sqrt = ["runtime", "root"]

ceil = ["runtime", "rounding"]
floor = ["runtime", "rounding"]
rint = ["runtime", "rounding"]
round = ["runtime", "rounding"]
roundeven = ["runtime", "rounding"]
trunc = ["runtime", "rounding"]

erf = ["runtime", "stat_error"]
erfc = ["runtime", "stat_error"]

acos = ["runtime", "trig"]
acosh = ["runtime", "trig"]
acot = ["runtime", "trig"]
acsc = ["runtime", "trig"]
asec = ["runtime", "trig"]
asin = ["runtime", "trig"]
asinh = ["runtime", "trig"]
atan = ["runtime", "trig"]
atan2 = ["runtime", "trig"]
atanh = ["runtime", "trig"]
cos = ["runtime", "trig"]
cosh = ["runtime", "trig"]
cot = ["runtime", "trig"]
csc = ["runtime", "trig"]
hypot = ["runtime", "trig"]
sec = ["runtime", "trig"]
sin = ["runtime", "trig"]
sinh = ["runtime", "trig"]
tan = ["runtime", "trig"]
tanh = ["runtime", "trig"]

bool = ["mech-core/bool"]

# Numbers
numbers = ["mech-core/numbers"]
complex = ["f64", "numbers", "mech-core/complex"]
rational = ["i64", "numbers", "mech-core/rational"]
signed_ints = ["numbers", "mech-core/signed_ints"]
unsigned_ints = ["numbers", "mech-core/unsigned_ints"]
floats = ["numbers", "mech-core/floats"]
u8 = ["unsigned_ints", "mech-core/u8"]
u16 = ["unsigned_ints", "mech-core/u16"]
u32 = ["unsigned_ints", "mech-core/u32"]
u64 = ["unsigned_ints", "mech-core/u64"]
u128 = ["unsigned_ints", "mech-core/u128"]
i8 = ["signed_ints", "mech-core/i8"]
i16 = ["signed_ints", "mech-core/i16"]
i32 = ["signed_ints", "mech-core/i32"]
i64 = ["signed_ints", "mech-core/i64"]
i128 = ["signed_ints", "mech-core/i128"]
f32 = ["floats", "mech-core/f32"]
f64 = ["floats", "mech-core/f64"]
c64 = ["complex", "mech-core/c64"]
r64 = ["rational", "mech-core/r64"]

# Matrix
matrix = ["nalgebra", "mech-core/matrix"]
row_vector4 = ["matrix", "mech-core/row_vector4"]
row_vector3 = ["matrix", "mech-core/row_vector3"]
row_vector2 = ["matrix", "mech-core/row_vector2"]
vector4 = ["matrix", "mech-core/vector4"]
vector3 = ["matrix", "mech-core/vector3"]
vector2 = ["matrix", "mech-core/vector2"]
matrix4 = ["matrix", "mech-core/matrix4"]
matrix3 = ["matrix", "mech-core/matrix3"]
matrix2 = ["matrix", "mech-core/matrix2", "mech-core/matrix"]
matrix1 = ["matrix", "mech-core/matrix1"]
# Source programs can receive a fixed 1x1 result from the feature-invariant
# dynamic row-vector x vector contract without enabling the full Matrix1 math
# runtime surface.
matrix1_interop = ["matrix", "mech-core/matrix1"]
matrix2x3 = ["matrix", "mech-core/matrix2x3"]
matrix3x2 = ["matrix", "mech-core/matrix3x2"]
row_vectord =["matrix",  "mech-core/row_vectord"]
vectord = ["matrix",  "mech-core/vectord"]
matrixd = ["matrix",  "mech-core/matrixd"]

[dependencies]
mech-core = { path = "../../src/core", version = "0.3.5", default-features = false, optional = true }
mech-abi = { path = "../../src/abi", version = "0.3.5", optional = true }

libm = {version = "0.2.15", optional = true}
simba = {version = "0.9.0", optional = true}
paste = { version = "1.0.15", optional = true }
nalgebra = {version="0.34.1", optional = true}

[dependencies.num-traits]
version = "0.2.19"
default-features = false
features = ["libm"]
optional = true

[workspace]
