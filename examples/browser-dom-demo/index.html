<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Mech Browser DOM Static Bundle Demo</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 2rem;
      }

      #mech-sandbox {
        border: 1px solid #ccc;
        padding: 1rem;
        max-width: 620px;
      }

      label {
        display: block;
        margin: 0.75rem 0;
      }

      input {
        min-width: 24rem;
      }

      #status {
        margin-top: 1rem;
        padding: 0.5rem;
      }

      #status.ready {
        border: 1px solid green;
      }

      #status.error {
        border: 1px solid red;
      }

      pre {
        background: #f6f6f6;
        padding: 1rem;
        white-space: pre-wrap;
      }
    </style>
  </head>

  <body>
    <h1>Mech Browser DOM Static Bundle Demo</h1>

    <section id="mech-sandbox">
      <label>
        Source DOM input:
        <input id="name-input" value="Ada" />
      </label>

      <label>
        Computed DOM output:
        <input id="roundtrip-output" readonly value="Not updated yet" />
      </label>

      <h2 id="title">Not updated yet</h2>

      <div id="status" class="idle">Idle</div>
    </section>

    <p>The configured Mech project reads the input when it starts and writes the computed result back to this page.</p>

    <script
      type="module"
      src="./_mech/project.js"
      data-mech-project="."
      data-mech-max-inputs="8"></script>
  </body>
</html>
