<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mech GPU Particle Field</title>
  <link rel="stylesheet" href="particles.css" />
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">Mech GPU executor</p>
        <h1>Particle Field</h1>
      </div>
      <p class="status" data-mech-gpu-status><span aria-hidden="true"></span>Loading Mech</p>
    </header>

    <section class="simulation" aria-label="Mech particle simulation">
      <canvas
        data-mech-gpu-renderer="points2d"
        data-mech-gpu-output="result.0"
      ></canvas>
      <p class="canvas-message" data-mech-gpu-message role="status">Compiling particles.mec</p>
    </section>

    <dl class="telemetry">
      <div><dt>Particles</dt><dd data-mech-gpu-item-count>--</dd></div>
      <div><dt>Displayed</dt><dd data-mech-gpu-render-count>--</dd></div>
      <div><dt>Frame rate</dt><dd data-mech-gpu-frame-rate>-- Hz</dd></div>
      <div><dt>Throughput</dt><dd data-mech-gpu-throughput>-- M updates/s</dd></div>
      <div><dt>State</dt><dd data-mech-gpu-state-size>-- MB resident</dd></div>
      <div><dt>Compile</dt><dd data-mech-gpu-compile-time>--</dd></div>
    </dl>
  </main>

  <script type="module" src="/_mech/project.js" data-mech-project="." data-mech-max-inputs="8"></script>
</body>
</html>
