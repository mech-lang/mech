<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mech Solar-System Orbit Viewer</title>
  <link rel="stylesheet" href="n-body.css" />
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Mech runtime orbital model</p>
      <h1>Solar-System Orbit Viewer</h1>
      <p class="status"><span aria-hidden="true"></span>15 simulation steps per second</p>
    </header>

    <section class="simulation" aria-label="Solar system orbit model">
      <svg id="solar-system" viewBox="0 0 600 600" role="img" aria-label="Animated circular orbits of the Sun and nine planets">
        <g class="axes" aria-hidden="true">
          <line x1="300" y1="28" x2="300" y2="572" />
          <line x1="28" y1="300" x2="572" y2="300" />
        </g>
        <g class="orbits" aria-hidden="true">
          <circle cx="300" cy="300" r="27.4" />
          <circle cx="300" cy="300" r="37.4" />
          <circle cx="300" cy="300" r="44" />
          <circle cx="300" cy="300" r="54.3" />
          <circle cx="300" cy="300" r="100.4" />
          <circle cx="300" cy="300" r="136.0" />
          <circle cx="300" cy="300" r="192.5" />
          <circle cx="300" cy="300" r="241.2" />
          <circle cx="300" cy="300" r="276.5" />
        </g>
      </svg>
    </section>

    <aside class="legend" aria-label="Bodies">
      <span class="sun">Sun</span>
      <span class="mercury">Mercury</span>
      <span class="venus">Venus</span>
      <span class="earth">Earth</span>
      <span class="mars">Mars</span>
      <span class="jupiter">Jupiter</span>
      <span class="saturn">Saturn</span>
      <span class="uranus">Uranus</span>
      <span class="neptune">Neptune</span>
      <span class="pluto">Pluto</span>
    </aside>

    <p class="scale-note">Orbital angles are physical. Radial distance uses a square-root scale so inner and outer bodies remain visible together.</p>
  </main>
  <script
    type="module"
    src="/_mech/project.js"
    data-mech-project="."
    data-mech-max-inputs="8"></script>
</body>
</html>
