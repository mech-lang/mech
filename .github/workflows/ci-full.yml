      - name: Retain linked application evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: canonical-linked-applications-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/canonical-native-evidence
            ${{ runner.temp }}/canonical-cast-evidence
            ${{ runner.temp }}/canonical-match-evidence
            ${{ runner.temp }}/canonical-iteration-evidence
            ${{ runner.temp }}/canonical-program-evidence
            ${{ runner.temp }}/canonical-cli-evidence
            ${{ runner.temp }}/native-host-evidence
