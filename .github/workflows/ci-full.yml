          CLI_RESULT: ${{ needs.windows-cli-contracts.result }}
          RUNTIME_RESULT: ${{ needs.windows-runtime-paths.result }}
        run: |
          test "$CLI_RESULT" = "$(if test "$CLI_REQUIRED" = true; then echo success; else echo skipped; fi)"
          test "$RUNTIME_RESULT" = "$(if test "$RUNTIME_REQUIRED" = true; then echo success; else echo skipped; fi)"

  dynamic-modules:
    if: ${{ contains(fromJSON(inputs.contract_families), 'all') || contains(fromJSON(inputs.contract_families), 'runtime') }}
    name: Dynamic modules
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: full
      CARGO_INCREMENTAL: 0
      RUSTUP_TOOLCHAIN: nightly-2026-03-03
    steps:
      - uses: actions/checkout@v7.0.1
        id: checkout
        with:
          ref: ${{ inputs.validation_ref || github.sha }}
      - name: Record exact-ref checkout identity
        env:
          VALIDATION_KIND: exact-ref
          REQUESTED_REF: ${{ inputs.validation_ref || github.sha }}
          CHECKOUT_REF: ${{ steps.checkout.outputs.ref }}
          CHECKOUT_SHA: ${{ steps.checkout.outputs.commit }}
        shell: bash
        run: bash --noprofile --norc -euo pipefail -c "$RECORD_CHECKOUT_IDENTITY"
      - name: Install Rust nightly-2026-03-03
        run: rustup toolchain install nightly-2026-03-03 --profile minimal

      - uses: Swatinem/rust-cache@v2

      - name: Fetch complete locked dependency graph
        run: cargo fetch --locked

      - name: Run dynamic module smoke path
        run: bash scripts/test-dynamic-modules.sh

  release-package-dry-run:
    if: ${{ contains(fromJSON(inputs.contract_families), 'all') || contains(fromJSON(inputs.contract_families), 'distribution') }}
    name: ${{ matrix.distribution }} release package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        distribution:
          - standard
          - full
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_RELEASE_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7.0.1
        id: checkout
        with:
          ref: ${{ inputs.validation_ref || github.sha }}
      - name: Record exact-ref checkout identity
        env:
          VALIDATION_KIND: exact-ref
          REQUESTED_REF: ${{ inputs.validation_ref || github.sha }}
          CHECKOUT_REF: ${{ steps.checkout.outputs.ref }}
          CHECKOUT_SHA: ${{ steps.checkout.outputs.commit }}
        shell: bash
        run: bash --noprofile --norc -euo pipefail -c "$RECORD_CHECKOUT_IDENTITY"
      - name: Install Rust nightly-2026-03-03
        run: rustup toolchain install nightly-2026-03-03 --profile minimal
      - name: Build and package the exact distribution
        id: package
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/mech-release-target
        run: >-
          python3 scripts/build-distribution-artifact.py
          --channel "${{ inputs.release_channel }}"
          --distribution "${{ matrix.distribution }}"
          --output-dir target/distribution-artifacts
          --date "${{ inputs.release_date }}"
      - name: Retain the dry-run distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: distribution-${{ matrix.distribution }}-${{ runner.os }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.report }}
          if-no-files-found: error
          retention-days: 14
