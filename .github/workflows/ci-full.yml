        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        env:
          WASM_PACK_VERSION: v0.15.0
        run: |
          curl -fsSL \
            "https://github.com/wasm-bindgen/wasm-pack/releases/download/${WASM_PACK_VERSION}/wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            -o /tmp/wasm-pack.tar.gz
          tar -xzf /tmp/wasm-pack.tar.gz -C /tmp
          sudo install "/tmp/wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl/wasm-pack" /usr/local/bin/wasm-pack
          wasm-pack --version

      - name: Show Chrome version
        run: google-chrome --version

      - name: Check shipped rich document shell contracts
        run: bash scripts/check-shipped-document-shims.sh

      - name: Remove old browser package
        run: rm -rf src/wasm/pkg

      - name: Check browser project feature boundaries
        run: |
          cargo check \
            -p mech-wasm \
            --target wasm32-unknown-unknown \
            --no-default-features \
            --features browser_project
          cargo check \
            -p mech-wasm \
            --target wasm32-unknown-unknown \
            --no-default-features \
            --features "browser_project,browser_host_dom,browser_host_time,browser_host_console,browser_host_scene,statements_default,compare_default,logic_default,subscript_default,math_default,matrix_default,f64,bool,string_default,record,tuple,table,atom,enum,variables"

      - name: Build browser project package
        run: python3 scripts/build-wasm.py --profile browser

      - name: Build embedded browser server in dedicated target
        run: |
          cargo build \
            --bin mech \
            --no-default-features \
            --features "serve,bundle_web,formatter"
          cp "$CARGO_TARGET_DIR/debug/mech" \
            "$CARGO_TARGET_DIR/embedded-browser-mech"
          cargo test \
            -p mech \
            --no-default-features \
            --features "serve,bundle_web,formatter" \
            --test mech_format_shims \
            -- --nocapture
          cargo test \
            -p mech \
            --no-default-features \
            --features "serve,bundle_web,formatter" \
            --test mech_serve \
            formatted_blog_page_executes_when_served \
            -- --exact --nocapture
          cargo test \
            -p mech \
            --no-default-features \
            --features "serve,bundle_web,formatter" \
            --test mech_serve \
            formatted_docs_page_executes_when_served \
            -- --exact --nocapture

      # Run this while the package produced above is still present. Later
      # served-document checks deliberately remove it from the source tree.
      - name: Smoke test documented static browser bundle
        run: |
          MECH_BIN="$CARGO_TARGET_DIR/embedded-browser-mech" \
            bash scripts/smoke-bundle-web.sh

      - name: Verify actual browser-package admission before publication
        env:
          MECH_STATIC_TEST_WASM_PKG: ${{ github.workspace }}/src/wasm/pkg
        run: >-
          cargo test --locked -p mech --no-default-features
          --features full_source,bundle_web_core
          --lib bundle_web::tests::actual_browser_package_admits_compatible_source_and_refuses_missing_language
          -- --ignored --exact --nocapture

      - name: Remove generated browser package
        run: rm -rf src/wasm/pkg

      - name: Run headless Chrome WASM tests
        # wasm-bindgen-test polls DOM output with execute/sync. Its synchronous
        # Rust tests can share one browser task, so Chrome's default 30s script
        # limit can expire before the runner can scrape any completed output.
        # Keep explicit finite script/runner/step limits; never retry or filter
        # tests to turn an unobserved result into a success.
        timeout-minutes: 15
        env:
          WASM_BINDGEN_TEST_WEBDRIVER_JSON: ${{ github.workspace }}/tests/browser/wasm-bindgen-webdriver.json
          WASM_BINDGEN_TEST_TIMEOUT: "180"
          CHROMEDRIVER_ARGS: --verbose --log-path=${{ runner.temp }}/mech-project-browser-chromedriver.log
        run: |
          wasm-pack test \
            --headless \
            --chrome \
            --release \
            src/wasm \
            --lib \
            --no-default-features \
            --features "browser_project,set_union,set_element_of" \
            -- \
            --nocapture

      - name: Retain headless WebDriver failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: project-browser-webdriver
          path: ${{ runner.temp }}/mech-project-browser-chromedriver.log
          if-no-files-found: warn

      - name: Smoke test formatted static document in Chrome
        run: |
          MECH_BIN="$CARGO_TARGET_DIR/embedded-browser-mech" \
            bash scripts/smoke-formatted-document-browser.sh

      - name: Smoke test standalone and inline-shim FizzBuzz in Chrome
        run: |
          MECH_BIN="$CARGO_TARGET_DIR/embedded-browser-mech" \
            bash scripts/smoke-served-fizzbuzz-browser.sh

      - name: Smoke test rich standalone documents in Chrome
        if: ${{ !inputs.rich_browser_smoke_in_caller }}
        run: |
          MECH_BIN="$CARGO_TARGET_DIR/embedded-browser-mech" \
            bash scripts/smoke-served-rich-document-browser.sh

      - name: Check browser document lifecycle sequences
        if: ${{ !inputs.rich_browser_smoke_in_caller }}
        run: python3 -B scripts/smoke-browser-document-lifecycle.py --mech-bin "$CARGO_TARGET_DIR/embedded-browser-mech"

      - name: Smoke test served analog clock in Chrome
        run: |
          MECH_BIN="$CARGO_TARGET_DIR/embedded-browser-mech" \
            bash scripts/smoke-served-analog-clock-browser.sh

      - name: Smoke test bounded server shutdown
        run: |
          cargo test \
            -p mech \
            --no-default-features \
            --features serve \
            --test mech_serve \
            mech_serve_interrupt_closes_keep_alive_server_once \
            -- --exact --nocapture

      - name: Remove generated browser package
        if: always()
        run: rm -rf src/wasm/pkg

      - name: Disk report at end
        if: always()
        run: bash scripts/ci-disk-report.sh

      - name: Disk report on failure
        if: failure()
        run: bash scripts/ci-disk-report.sh
