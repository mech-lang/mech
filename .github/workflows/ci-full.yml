  catalog-closure:
    if: ${{ contains(fromJSON(inputs.contract_families), 'all') || contains(fromJSON(inputs.contract_families), 'linkage') }}
    name: Generated catalog closure (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        profile:
          - standard
          - full
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7.0.1
        id: checkout
        with:
          ref: ${{ inputs.validation_ref || github.sha }}
      - name: Record exact-ref checkout identity
        env:
          VALIDATION_KIND: exact-ref
          REQUESTED_REF: ${{ inputs.validation_ref || github.sha }}
          CHECKOUT_REF: ${{ steps.checkout.outputs.ref }}
          CHECKOUT_SHA: ${{ steps.checkout.outputs.commit }}
        shell: bash
        run: bash --noprofile --norc -euo pipefail -c "$RECORD_CHECKOUT_IDENTITY"
