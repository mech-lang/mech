      - name: Build and execute the full generated fixture matrix
        timeout-minutes: 150
        uses: ./.github/actions/native-applications
        with:
          suite: engine

  native-hosted:
    if: ${{ contains(fromJSON(inputs.contract_families), 'all') || contains(fromJSON(inputs.contract_families), 'native') }}
    name: Native hosted applications
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-03-03
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      MECH_NATIVE_OWNER_BUILD_TIMEOUT_SECS: "900"
      MECH_NATIVE_OWNER_RUN_TIMEOUT_SECS: "540"
      MECH_NATIVE_HOST_TARGET_TIMEOUT_SECS: "30"
    steps:
      - uses: actions/checkout@v7.0.1
        id: checkout
        with:
          ref: ${{ inputs.validation_ref || github.sha }}
      - name: Record exact-ref checkout identity
        env:
          VALIDATION_KIND: exact-ref
          REQUESTED_REF: ${{ inputs.validation_ref || github.sha }}
          CHECKOUT_REF: ${{ steps.checkout.outputs.ref }}
          CHECKOUT_SHA: ${{ steps.checkout.outputs.commit }}
        shell: bash
        run: bash --noprofile --norc -euo pipefail -c "$RECORD_CHECKOUT_IDENTITY"
      - name: Install Rust nightly-2026-03-03
        run: rustup toolchain install nightly-2026-03-03 --profile minimal
      - name: Fetch locked generated-project dependencies
        run: |
          cargo +nightly-2026-03-03 fetch --locked
          cargo +nightly-2026-03-03 fetch --locked --manifest-path tests/fixtures/native-build-owner-runner/Cargo.toml
      - name: Install activated native application build tools
        run: |
          if ! command -v rg >/dev/null 2>&1 || ! command -v cc >/dev/null 2>&1 || ! command -v make >/dev/null 2>&1 || ! command -v m4 >/dev/null 2>&1
          then
            sudo apt-get update -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=-
            sudo apt-get install --yes ripgrep build-essential m4
          fi
      - name: Execute activated native admission and pipe regressions
        timeout-minutes: 30
        run: >-
          cargo +nightly-2026-03-03 test --locked --offline -p mech-gpu
          --no-default-features --features native-build,native-io
          --test native_host_io --test repeated_application
          --test native_host_application --test native_source_admission -- --test-threads=1
      - name: Qualify activated native launches with one linked executable
        timeout-minutes: 30
        env:
          MECH_NATIVE_QUALIFICATION_DIRECTORY: ${{ runner.temp }}/activated-native-host-evidence
        run: >-
          cargo +nightly-2026-03-03 test --locked --offline -p mech-gpu
          --no-default-features --features native-build,native-io
          --test native_host_application -- --ignored --exact
          one_linked_executable_runs_secure_and_trusted_without_rebuilding
          --test-threads=1
      - name: Retain activated native launch qualification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: activated-native-host-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/activated-native-host-evidence
          if-no-files-found: error
          retention-days: 14
      - name: Build hosted applications and CLI integration
        timeout-minutes: 150
        uses: ./.github/actions/native-applications
        with:
          suite: hosted

  native-live:
    if: ${{ contains(fromJSON(inputs.contract_families), 'all') || contains(fromJSON(inputs.contract_families), 'native') }}
    name: Native live applications
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        id: checkout
        with:
          ref: ${{ inputs.validation_ref || github.sha }}
      - name: Record exact-ref checkout identity
        env:
          VALIDATION_KIND: exact-ref
          REQUESTED_REF: ${{ inputs.validation_ref || github.sha }}
          CHECKOUT_REF: ${{ steps.checkout.outputs.ref }}
          CHECKOUT_SHA: ${{ steps.checkout.outputs.commit }}
        shell: bash
        run: bash --noprofile --norc -euo pipefail -c "$RECORD_CHECKOUT_IDENTITY"
      - name: Install Rust nightly-2026-03-03
        run: rustup toolchain install nightly-2026-03-03 --profile minimal
      - name: Fetch locked generated-project dependencies
        run: |
          cargo +nightly-2026-03-03 fetch --locked
          cargo +nightly-2026-03-03 fetch --locked --manifest-path tests/fixtures/native-build-owner-runner/Cargo.toml
      - name: Validate one-shot live generation and cleanup
        run: >-
          cargo +nightly-2026-03-03 test
          -p mech-build
          --features standard-hosts
          --test registry_generated_project
          -- --nocapture

  native-windows:
    if: ${{ contains(fromJSON(inputs.contract_families), 'all') || contains(fromJSON(inputs.contract_families), 'native') }}
    name: Native generated applications (Windows)
    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7.0.1
        id: checkout
        with:
          ref: ${{ inputs.validation_ref || github.sha }}
      - name: Record exact-ref checkout identity
        env:
          VALIDATION_KIND: exact-ref
          REQUESTED_REF: ${{ inputs.validation_ref || github.sha }}
          CHECKOUT_REF: ${{ steps.checkout.outputs.ref }}
          CHECKOUT_SHA: ${{ steps.checkout.outputs.commit }}
        shell: bash
        run: bash --noprofile --norc -euo pipefail -c "$RECORD_CHECKOUT_IDENTITY"
      - name: Install Rust nightly-2026-03-03
        run: rustup toolchain install nightly-2026-03-03 --profile minimal
      - name: Fetch locked generated-project dependencies
        shell: pwsh
        run: |
          cargo +nightly-2026-03-03 fetch --locked
          cargo +nightly-2026-03-03 fetch --locked --manifest-path tests/fixtures/native-build-owner-runner/Cargo.toml
      - name: Compile required Windows owner-helper consumers
        shell: pwsh
        run: |
          # Compile each required consumer with its execution feature selection.
          # isolated_process permits unused support APIs; the ordinary fixture
          # target must independently satisfy the warning policy.
          cargo +nightly-2026-03-03 test --locked --offline -p mech-build --test isolated_process --no-run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +nightly-2026-03-03 test --locked --offline -p mech-build --features full-hosts --test native_generated_end_to_end --no-run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate Windows owner-process containment
        shell: pwsh
        run: cargo +nightly-2026-03-03 test --locked -p mech-build --test isolated_process -- --nocapture
      - name: Build selected native fixture families
        shell: pwsh
        run: |
          cargo +nightly-2026-03-03 test -p mech-build --features standard-hosts --lib project::manifest::tests::windows_cargo_paths_require_the_same_volume -- --exact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cases = @("scalar", "fixed-matrix", "dynamic-matrix", "cli", "console", "time-once")
          foreach ($case in $cases) {
            $env:MECH_NATIVE_GENERATED_CASE = $case
            cargo +nightly-2026-03-03 test --locked --offline -p mech-build --features full-hosts --test native_generated_end_to_end -- --nocapture
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Remove-Item Env:MECH_NATIVE_GENERATED_CASE -ErrorAction SilentlyContinue
          cargo +nightly-2026-03-03 test -p mech-build --features standard-hosts --test registry_generated_project live_registry_project_runs_once_handles_ctrlc_and_cleans_up_after_failure -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  native-macos:
    if: ${{ contains(fromJSON(inputs.contract_families), 'all') || contains(fromJSON(inputs.contract_families), 'native') }}
    name: Native generated applications (macOS)
    runs-on: macos-latest
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7.0.1
        id: checkout
        with:
          ref: ${{ inputs.validation_ref || github.sha }}
      - name: Record exact-ref checkout identity
        env:
          VALIDATION_KIND: exact-ref
          REQUESTED_REF: ${{ inputs.validation_ref || github.sha }}
          CHECKOUT_REF: ${{ steps.checkout.outputs.ref }}
          CHECKOUT_SHA: ${{ steps.checkout.outputs.commit }}
        shell: bash
        run: bash --noprofile --norc -euo pipefail -c "$RECORD_CHECKOUT_IDENTITY"
      - name: Install Rust nightly-2026-03-03
        run: rustup toolchain install nightly-2026-03-03 --profile minimal
      - name: Fetch locked generated-project dependencies
        run: |
          cargo +nightly-2026-03-03 fetch --locked
          cargo +nightly-2026-03-03 fetch --locked --manifest-path tests/fixtures/native-build-owner-runner/Cargo.toml
      # Cold compiler-owner construction has a separate bounded budget; fixture
      # execution must consume those runners rather than starting hidden builds.
      - name: Prepare macOS native owner runners
        timeout-minutes: 75
        env:
          MECH_NATIVE_OWNER_BUILD_TIMEOUT_SECS: "1800"
        run: |
          python3 scripts/run-native-plan-stage.py --stage macos-owner-prepare --timeout-secs 4200 -- \
            cargo +nightly-2026-03-03 test --locked --offline -p mech-build --features full-hosts \
            --test native_generated_end_to_end -- --ignored --exact prepare_generated_owner_runners --test-threads=1 --nocapture
      - name: Build selected native fixture families
        timeout-minutes: 95
        env:
          MECH_NATIVE_OWNER_REQUIRE_PREBUILT: "1"
          MECH_NATIVE_GENERATED_CASE: scalar,fixed-matrix,dynamic-matrix,cli,console,time-once
        run: |
          python3 scripts/run-native-plan-stage.py --stage macos-generated --timeout-secs 5400 -- \
            cargo +nightly-2026-03-03 test --locked --offline -p mech-build --features full-hosts \
            --test native_generated_end_to_end -- --exact every_generated_application_fixture_builds_and_executes --test-threads=1 --nocapture

      - name: Retain macOS native application diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/native-plan-logs
            target/bytecode-v1-fixtures/owner-runner/logs
          if-no-files-found: error
          retention-days: 14

      - name: Check native cache and input ownership on macOS
        timeout-minutes: 20
        env:
          CARGO_INCREMENTAL: 0
          CARGO_PROFILE_TEST_DEBUG: "0"
          CARGO_BUILD_JOBS: "1"
        run: |
          cargo +nightly-2026-03-03 test --locked --offline -p mech-gpu \
            --no-default-features --features aot --lib batched::aot::tests -- --test-threads=1
          cargo +nightly-2026-03-03 test --locked --offline -p mech-gpu \
            --no-default-features --features aot --lib batched::jit::tests -- --test-threads=1

  wasm-bytecode-v1:
    if: ${{ contains(fromJSON(inputs.contract_families), 'all') || contains(fromJSON(inputs.contract_families), 'browser') }}
    name: WASM bytecode v1
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-03-03
    steps:
      - uses: actions/checkout@v7.0.1
        id: checkout
        with:
          ref: ${{ inputs.validation_ref || github.sha }}
      - name: Record exact-ref checkout identity
        env:
          VALIDATION_KIND: exact-ref
          REQUESTED_REF: ${{ inputs.validation_ref || github.sha }}
          CHECKOUT_REF: ${{ steps.checkout.outputs.ref }}
          CHECKOUT_SHA: ${{ steps.checkout.outputs.commit }}
        shell: bash
        run: bash --noprofile --norc -euo pipefail -c "$RECORD_CHECKOUT_IDENTITY"
      - name: Install Rust nightly-2026-03-03 and WASM target
        run: |
          rustup toolchain install nightly-2026-03-03 --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain nightly-2026-03-03
      - name: Install wasm-pack
        env:
          WASM_PACK_VERSION: v0.15.0
        run: |
          curl -fsSL \
            "https://github.com/wasm-bindgen/wasm-pack/releases/download/${WASM_PACK_VERSION}/wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            -o /tmp/wasm-pack.tar.gz
          tar -xzf /tmp/wasm-pack.tar.gz -C /tmp
          sudo install "/tmp/wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl/wasm-pack" /usr/local/bin/wasm-pack
      - name: Execute the official bytecode-v1 fixtures in Chrome
        run: |
          wasm-pack test \
            --headless \
            --chrome \
            --release \
            src/wasm \
            --test bytecode_v1 \
            --no-default-features \
            --features "browser_project,set_union,set_element_of" \
            -- \
            --nocapture

  package-validation:
    if: ${{ contains(fromJSON(inputs.contract_families), 'all') || contains(fromJSON(inputs.contract_families), 'distribution') }}
    name: Package validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        id: checkout
        with:
          ref: ${{ inputs.validation_ref || github.sha }}
      - name: Record exact-ref checkout identity
        env:
          VALIDATION_KIND: exact-ref
          REQUESTED_REF: ${{ inputs.validation_ref || github.sha }}
          CHECKOUT_REF: ${{ steps.checkout.outputs.ref }}
          CHECKOUT_SHA: ${{ steps.checkout.outputs.commit }}
        shell: bash
        run: bash --noprofile --norc -euo pipefail -c "$RECORD_CHECKOUT_IDENTITY"
      - name: Install Rust nightly-2026-03-03
        run: rustup toolchain install nightly-2026-03-03 --profile minimal
      - name: Validate Cargo package archive contents
        run: python3 scripts/check-package-archives.py
      - name: Upload package archive manifests
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: package-archive-manifests
          path: target/package-archive-manifests
          retention-days: 14

  cargo:
    name: Selected contract gate
    if: ${{ always() }}
    needs:
      - architecture-contracts
      - architecture-mutations
      - artifact-closure
      - bytecode-v1-determinism
      - bytecode-v1-format
      - bytecode-v1-values
      - canonical-applications
      - canonical-linked-applications
      - cargo-features
      - cargo-language
      - cargo-runtime
      - catalog-closure
      - distribution-contracts
      - dynamic-modules
      - engine-catalog
      - function-system-contracts
      - macos-runtime
      - managed-memory-fixed-profiles
      - managed-memory-miri
      - managed-memory-runtime
      - native-cli-collision
      - memory-planner-contract
      - native-engine
      - native-hosted
      - native-linkage
      - native-linkage-closures
      - native-linkage-owners
      - native-linkage-surfaces
      - native-live
      - native-macos
      - native-plan
      - native-windows
      - package-validation
      - project-browser
      - project-native
      - release-package-dry-run
      - run-only
      - wasm-bytecode-v1
      - wasm-source-profile
      - windows-cli
      - windows-cli-contracts
      - windows-runtime-paths
    runs-on: ubuntu-latest
    steps:
      - name: Require exactly the selected contract families
        env:
          CONTRACT_FAMILIES: ${{ inputs.contract_families }}
          CONTRACT_RESULTS: ${{ toJSON(needs) }}
          NATIVE_PLAN_IN_CALLER: ${{ inputs.native_plan_in_caller || false }}
        run: |
          python3 - <<'PY'
          import json, os
          groups = {
              'architecture': ['architecture-contracts', 'architecture-mutations'],
              'artifact': ['artifact-closure', 'bytecode-v1-format', 'bytecode-v1-values', 'bytecode-v1-determinism'],
              'language': ['cargo-language', 'canonical-applications', 'canonical-linked-applications'],
              'memory': ['memory-planner-contract', 'managed-memory-runtime', 'managed-memory-miri', 'native-cli-collision'],
              'numeric': ['function-system-contracts', 'engine-catalog', 'managed-memory-fixed-profiles', 'managed-memory-runtime', 'cargo-runtime', 'native-cli-collision'],
              'runtime': ['cargo-runtime', 'macos-runtime', 'windows-runtime-paths', 'windows-cli', 'dynamic-modules'],
              'cli': ['cargo-runtime', 'run-only', 'windows-cli-contracts', 'windows-cli'],
              'linkage': ['native-linkage-owners', 'native-linkage-surfaces', 'native-linkage', 'native-linkage-closures', 'catalog-closure'],
              'native': ['native-plan', 'native-engine', 'native-hosted', 'native-live', 'native-windows', 'native-macos', 'project-native', 'canonical-applications', 'canonical-linked-applications'],
              'browser': ['wasm-source-profile', 'wasm-bytecode-v1', 'project-browser'],
              'distribution': ['cargo-features', 'distribution-contracts', 'package-validation', 'release-package-dry-run'],
          }
          selected = json.loads(os.environ["CONTRACT_FAMILIES"])
          if not isinstance(selected, list) or not selected or any(
              family not in {*groups, "all"} for family in selected
          ):
              raise SystemExit("invalid contract family selection")
          expected = {
              job for family, jobs in groups.items()
              if "all" in selected or family in selected for job in jobs
          }
          if os.environ["NATIVE_PLAN_IN_CALLER"] == "true":
              expected.discard("native-plan")
          results = json.loads(os.environ["CONTRACT_RESULTS"])
          if set(results) != {job for jobs in groups.values() for job in jobs}:
              raise SystemExit("contract gate dependency mismatch")
          for job, result in results.items():
              required = "success" if job in expected else "skipped"
              if result["result"] != required:
                  raise SystemExit(f"{job}: expected {required}, got {result['result']}")
          PY

  cargo-language:
    if: ${{ contains(fromJSON(inputs.contract_families), 'all') || contains(fromJSON(inputs.contract_families), 'language') }}
    name: Cargo language tests
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: full
      CARGO_INCREMENTAL: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        id: checkout
        with:
          ref: ${{ inputs.validation_ref || github.sha }}
      - name: Record exact-ref checkout identity
        env:
          VALIDATION_KIND: exact-ref
          REQUESTED_REF: ${{ inputs.validation_ref || github.sha }}
          CHECKOUT_REF: ${{ steps.checkout.outputs.ref }}
          CHECKOUT_SHA: ${{ steps.checkout.outputs.commit }}
        shell: bash
        run: bash --noprofile --norc -euo pipefail -c "$RECORD_CHECKOUT_IDENTITY"
      - name: Disk report at start
        run: bash scripts/ci-disk-report.sh

      - name: Install Rust nightly-2026-03-03
        run: |
          rustup show
          rustup toolchain install nightly-2026-03-03 --profile minimal --component rustfmt
          rustup default nightly-2026-03-03

      - name: Install Node for browser-package source admission
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'

      - name: Verify static project bootstrap
        run: node --test scripts/tests/static-project.test.mjs

      - name: Check generated syntax inventories
        run: |
          python3 scripts/generate-canonical-rule-registry.py --check
          python3 scripts/generate-canonical-dependencies.py --check
          python3 scripts/generate-canonical-scc-report.py --check
          python3 scripts/generate-canonical-document-grammar.py --check

      - name: Fetch locked workspace dependencies for isolated profile checks
        run: cargo fetch --locked

      - name: Run syntax grammar suites
        # Keep every stress size, work bound and assertion; optimize the
        # parser's test build rather than reducing exhaustive coverage.
        env:
          CARGO_PROFILE_TEST_OPT_LEVEL: "1"
          CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: "true"
          CARGO_PROFILE_TEST_OVERFLOW_CHECKS: "true"
        run: |
          cargo +nightly-2026-03-03 test --locked -p mech-syntax --lib --tests --no-default-features --features full -- --test-threads=1
      - name: Run reduced syntax feature profiles
        env:
          CARGO_PROFILE_TEST_OPT_LEVEL: "1"
          CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: "true"
          CARGO_PROFILE_TEST_OVERFLOW_CHECKS: "true"
        run: |
          # Exhaustive streaming/growth runs once above. Reduced profiles prove
          # their feature boundary without repeating the same parser algorithm.
          for suite in canonical_document_root canonical_base_contracts
          do
            cargo +nightly-2026-03-03 test --locked -p mech-syntax --no-default-features --features base \
              --lib "document::parser::canonical::tests::$suite"
          done
          # Verify the explicit compiler/serde feature combination.
          cargo +nightly-2026-03-03 test --locked -p mech-syntax --no-default-features \
            --features "baselib pretty_print serde compiler program statements_default subscript_default" \
            --test canonical_rule_registry \
            --test canonical_recursive_core_inventory --test canonical_recursive_core_schema \
            --test canonical_grammar
          for suite in canonical_mechdown_closed_rules canonical_executable_conformance canonical_executable_recovery
          do
            cargo +nightly-2026-03-03 test --locked -p mech-syntax --no-default-features \
              --features "baselib pretty_print serde compiler program statements_default subscript_default" \
              --lib "document::parser::canonical::tests::$suite"
          done

      - name: Verify canonical document syntax with optional features disabled
        run: |
          cargo +nightly-2026-03-03 test --locked -p mech-syntax \
            --no-default-features --test canonical_document_feature_gates \
            --test document_streaming_boundaries
          cargo +nightly-2026-03-03 test --locked -p mech-syntax \
            --no-default-features --lib document::parser::canonical::tests::canonical_document_root

      - name: Verify canonical document execution and rendered outputs
        run: |
          cargo +nightly-2026-03-03 test --locked -p mech-runtime \
            --no-default-features --features full_source,resident-routing-source \
            --test canonical_declaration_handoff --test canonical_document_outputs \
            --test canonical_document_render --test canonical_source_index \
            --test source_document --test canonical_config_profile --test config_profile \
            --test source_acceptance
          cargo +nightly-2026-03-03 test --locked -p mech-engine \
            --no-default-features --features full_source,resident-artifact,r64,c64 \
            --lib resident::general::shape_fact_tests::

      - name: Verify canonical compiler execution contracts
        run: >-
          cargo +nightly-2026-03-03 test --locked -p mech-runtime
          --no-default-features --features full_compiler,watcher,compute
          --lib canonical_

      - name: Verify mixed-source compute admission contracts
        shell: bash
        run: |
          set -euo pipefail
          MIXED_TEST_LIST=$(cargo +nightly-2026-03-03 test --locked -p mech-runtime \
            --no-default-features --features full_compiler,watcher,compute \
            --lib mixed_ -- --list)
          printf '%s\n' "$MIXED_TEST_LIST"
          MIXED_TEST_COUNT=$(printf '%s\n' "$MIXED_TEST_LIST" | awk '/: test$/ { count += 1 } END { print count + 0 }')
          test "$MIXED_TEST_COUNT" -gt 0
          cargo +nightly-2026-03-03 test --locked -p mech-runtime \
            --no-default-features --features full_compiler,watcher,compute \
            --lib mixed_ -- --nocapture
          cargo +nightly-2026-03-03 test --locked -p mech-gpu \
            --features runtime-host --lib \
            alphabetic_section_ordinals_bind_the_configured_compute_host -- --nocapture

      - name: Verify canonical replacement corrections
        run: >-
          cargo +nightly-2026-03-03 test --locked -p mech-runtime
          --no-default-features --features full_compiler,full_source,resident-routing-source,compute
          --test canonical_call_visibility --test canonical_constant_binding

      - name: Verify canonical complete-document indexing work
        run: >-
          cargo +nightly-2026-03-03 test --locked -p mech-runtime
          --no-default-features --features full_source,resident-routing-source
          --lib resolver::index::canonical::tests

      - name: Verify retained source admission without Mika
        run: >-
          cargo +nightly-2026-03-03 test --locked -p mech-runtime
          --no-default-features --features source --test source_document
          --test canonical_config_profile --test config_profile

      - name: Check reduced core feature boundaries
        run: |
          cargo check --locked \
            --no-default-features \
            --features no_std
          cargo check -p mech-core \
            --no-default-features \
            --features no_std
          cargo check -p mech-core \
            --no-default-features \
            --features baselib
          cargo check -p mech-core \
            --no-default-features \
            --features "matrix,matrixd,f64"

      - name: Run root bytecode and library tests
        run: |
          cargo test --test bytecode
          # Generic root-library coverage runs once on Ubuntu. Platform jobs
          # below retain only behavior that is actually platform-sensitive.
          cargo test --lib
          cargo test -p mech-bytecode

      - name: Run complete core suite
        run: cargo test -p mech-core

      - name: Run compiler-enabled program library suite
        # Exhaustive native-link feature coverage is intentionally split across
        # the native-linkage-surface jobs instead of linked into one enormous
        # test harness on a memory-constrained hosted runner.
        run: |
          cargo check -p mech-engine \
            --no-default-features \
            --features compiler
          cargo test -p mech-engine \
            --lib \
            --tests \
            --features compiler_default

      - name: Qualify isolated canonical source producer profiles
        run: |
          cargo +nightly-2026-03-03 check --locked -p mech-engine --no-default-features --features source
          cargo +nightly-2026-03-03 test --locked -p mech-engine --no-default-features --features source --test canonical_source_profile --test canonical_source_review --test canonical_source_collections --test canonical_boolean_match
          cargo +nightly-2026-03-03 test --locked -p mech-engine --no-default-features --features full_source,resident-artifact --test canonical_document_state --test canonical_document_streaming --test canonical_source_semantics --test canonical_source_review --test canonical_source_structures --test canonical_source_collections --test canonical_boolean_match --test canonical_source_completion --test canonical_executable_semantics
          cargo +nightly-2026-03-03 test --locked -p mech-engine --no-default-features --features full_source,resident-artifact --lib source_semantics::frontend::
          cargo +nightly-2026-03-03 test --locked -p mech-engine --no-default-features --features full_source,resident-artifact --lib resident::numeric::tests::
      - name: Execute canonical resident string and input shape contracts
        run: >-
          cargo +nightly-2026-03-03 test --locked -p mech-engine
          --no-default-features --features full_compiler,resident-artifact
          --test canonical_string_selection --test string_set_comprehension
          --test value_input_shapes

      - name: Run retained non-UTF-8 source-root regression
        run: >-
          cargo test -p mech
          --lib
          --no-default-features
          --features distribution-standard
          cli::commands::run::tests::run_command_preserves_non_utf8_source_path
          -- --exact --nocapture

      - name: Run HTML shim formatter contracts
        run: |
          cargo test \
            --no-default-features \
            --features formatter \
            --test mech_format_shims \
            -- --nocapture

      - name: Check isolated engine feature boundaries
        run: |
          cargo check -p mech-engine \
            --no-default-features \
            --features "program compiler variables variable_define variable_assign f64 math_mul_assign"
          cargo test -p mech-engine \
            --test op_assign_feature_gates \
            --no-default-features \
            --features "program compiler variables variable_define variable_assign f64 math_mul_assign" \
            whole_mul_assignment_selects_mul_operation_only \
            -- --exact --nocapture
          cargo check -p mech-engine \
            --no-default-features \
            --features "program compiler variables variable_define variable_assign f64 math_div_assign"
          cargo test -p mech-engine \
            --test op_assign_feature_gates \
            --no-default-features \
            --features "program compiler variables variable_define variable_assign f64 math_div_assign" \
            whole_div_assignment_selects_div_operation_only \
            -- --exact --nocapture
          cargo check -p mech-engine \
            --no-default-features \
            --features "compiler functions formulas string_concat"

      - name: Disk report at end
        if: always()
        run: bash scripts/ci-disk-report.sh

  cargo-runtime:
