    if: ${{ contains(fromJSON(inputs.contract_families), 'all') || contains(fromJSON(inputs.contract_families), 'native') }}
    name: Native engine applications
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      MECH_NATIVE_OWNER_BUILD_TIMEOUT_SECS: "900"
      MECH_NATIVE_OWNER_RUN_TIMEOUT_SECS: "540"
      MECH_NATIVE_HOST_TARGET_TIMEOUT_SECS: "30"
    steps:
      - uses: actions/checkout@v7.0.1
