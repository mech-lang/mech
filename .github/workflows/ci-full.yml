name: Full CI

on:
  workflow_call:
    inputs:
      contract_families:
        description: JSON array of behavioral contract families; all for full qualification
        required: false
        type: string
        default: '["all"]'
      release_channel:
        description: Artifact channel used by the full-validation dry run
        required: false
        type: string
        default: stable
      release_date:
        description: UTC date for nightly artifact names
        required: false
        type: string
        default: ""
      validation_ref:
        description: Exact commit or ref to validate
        required: false
        type: string
        default: ""
      native_plan_in_caller:
        description: The calling workflow runs and requires the same revision native plan
        required: false
        type: boolean
        default: false
      rich_browser_smoke_in_caller:
        description: The calling workflow already ran the rich browser smoke test
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      contract_families:
        description: JSON array of behavioral contract families; all for full qualification
        required: false
        type: string
        default: '["all"]'
      release_channel:
        description: Artifact channel used by the full-validation dry run
        required: true
        type: choice
        default: stable
        options:
          - stable
          - nightly
      release_date:
        description: UTC date for nightly artifact names (YYYY-MM-DD)
        required: false
        type: string
      validation_ref:
        description: Exact commit or ref to validate
        required: false
        type: string
        default: ""
      rich_browser_smoke_in_caller:
        description: The calling workflow already ran the rich browser smoke test
        required: false
        type: boolean
        default: false

concurrency:
  group: ci-full-${{ github.run_id }}-${{ inputs.validation_ref || github.sha }}
  cancel-in-progress: false

# This verifier belongs to the workflow revision, not the repository revision
# selected below. Historical validation refs therefore remain auditable even
# when their checked-out tree predates the checkout-identity contract.
env:
  RECORD_CHECKOUT_IDENTITY: |
    case "$VALIDATION_KIND" in
      integration-merge|exact-ref) ;;
      *) echo "unsupported validation kind: $VALIDATION_KIND" >&2; exit 64 ;;
    esac
    test -n "$REQUESTED_REF"

    actual_sha=$(git rev-parse HEAD)
    test -n "$CHECKOUT_SHA"
    test "$actual_sha" = "$CHECKOUT_SHA"

    if [[ "$REQUESTED_REF" =~ ^[0-9a-fA-F]{40}$ || "$REQUESTED_REF" =~ ^[0-9a-fA-F]{64}$ ]]
    then
      requested_sha=$(printf '%s' "$REQUESTED_REF" | tr '[:upper:]' '[:lower:]')
      test "$actual_sha" = "$requested_sha"
    fi

    {
      echo "validation_kind=$VALIDATION_KIND"
      echo "requested_ref=$REQUESTED_REF"
      echo "checkout_ref=$CHECKOUT_REF"
      echo "checkout_sha=$CHECKOUT_SHA"
      echo "actual_sha=$actual_sha"
    } | tee -a "$GITHUB_STEP_SUMMARY"

jobs:
  artifact-closure:
    if: ${{ contains(fromJSON(inputs.contract_families), 'all') || contains(fromJSON(inputs.contract_families), 'artifact') }}
    name: Artifact closure (${{ matrix.representative }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        representative:
          - standard-native
          - nbody
          - particles
          - ekf
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_BUILD_JOBS: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - name: Checkout exact validation head
        id: checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.validation_ref || github.sha }}
      - name: Record exact-ref checkout identity
        env:
          VALIDATION_KIND: exact-ref
          REQUESTED_REF: ${{ inputs.validation_ref || github.sha }}
          CHECKOUT_REF: ${{ steps.checkout.outputs.ref }}
          CHECKOUT_SHA: ${{ steps.checkout.outputs.commit }}
        shell: bash
        run: bash --noprofile --norc -euo pipefail -c "$RECORD_CHECKOUT_IDENTITY"
      - name: Install Rust nightly-2026-03-03
        run: |
          rustup toolchain install nightly-2026-03-03 --profile minimal
          rustup default nightly-2026-03-03
      - name: Fetch locked artifact dependencies
        run: cargo fetch --locked
      - name: Build and inspect representative artifacts
        run: python3 scripts/check-artifact-completeness.py ${{ matrix.representative }}

  architecture-contracts:
    if: ${{ contains(fromJSON(inputs.contract_families), 'all') || contains(fromJSON(inputs.contract_families), 'architecture') }}
    name: Architecture contract qualification
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_BUILD_JOBS: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7.0.1
        id: checkout
        with:
          ref: ${{ inputs.validation_ref || github.sha }}
          fetch-depth: 0
      - name: Record exact-ref checkout identity
        env:
          VALIDATION_KIND: exact-ref
          REQUESTED_REF: ${{ inputs.validation_ref || github.sha }}
          CHECKOUT_REF: ${{ steps.checkout.outputs.ref }}
          CHECKOUT_SHA: ${{ steps.checkout.outputs.commit }}
        shell: bash
        run: bash --noprofile --norc -euo pipefail -c "$RECORD_CHECKOUT_IDENTITY"
      - name: Install architecture contract tools
        run: |
          rustup toolchain install nightly-2026-03-03 --profile minimal
          if ! command -v rg >/dev/null 2>&1
          then
            # Ignore unrelated preinstalled third-party repositories. A stale
            # Chrome index must not prevent architecture validation from running.
            sudo apt-get update \
              -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources \
              -o Dir::Etc::sourceparts=-
            sudo apt-get install --yes ripgrep
          fi
      - name: Fetch locked architecture dependencies
        run: cargo +nightly-2026-03-03 fetch --locked
      - name: Validate permanent architecture contracts
        run: |
          python3 scripts/check-value-system-contract.py
          python3 scripts/check-no-retired-value-system.py
          python3 scripts/check-program-artifact-contract.py
          python3 scripts/check-operation-contract.py
          python3 scripts/check-type-memory-boundary.py
          python3 scripts/check-type-system.py
          python3 scripts/check-semantic-type-authority.py
          python3 scripts/check-memory-planner.py
          python3 scripts/check-memory-runtime.py
          python3 scripts/check-compiler-planning-quarantine.py
      - name: Execute resident external publication contract
        run: >-
          cargo +nightly-2026-03-03 test --locked -p mech-runtime
          --no-default-features --features resident_external_test_support
          --test resident_external_contract
      - name: Execute the complete type and memory boundary
        run: >-
          cargo +nightly-2026-03-03 test --locked -p mech-core
          --all-features --test type_memory_contract --test storage_capability
          --test operation_memory_requirement --test type_memory_boundary
      - name: Execute the complete type system contract
        run: |
          cargo +nightly-2026-03-03 test --locked -p mech-core --all-features \
            --test type_system_builtin \
            --test type_system_solver \
            --test type_system_conversion \
            --test matrix_set_conversion \
            --test matrix_set_declared_conversion \
            --test conversion_staging_bounds \
            --test conversion_sort_work \
            --test type_system_catalog
          cargo +nightly-2026-03-03 test --locked -p mech-stdlib \
            --no-default-features --features full_compiler \
            --test type_system_source
          cargo +nightly-2026-03-03 test --locked -p mech-runtime \
            --no-default-features --features full_compiler,resident-routing-source \
            --lib runtime::program::tests::compiled_conversion_executes_after_bytecode_round_trip \
            -- --exact
      - name: Execute the complete semantic type authority contract
        run: |
          cargo +nightly-2026-03-03 test --locked -p mech-core --all-features \
            --test canonical_type_contract
          cargo +nightly-2026-03-03 test --locked -p mech-engine \
            --no-default-features --features full_compiler \
            --test canonical_type_contract
          cargo +nightly-2026-03-03 test --locked -p mech-stdlib \
            --no-default-features --features full_compiler \
            --test canonical_type_contract

  architecture-mutations:
    if: ${{ contains(fromJSON(inputs.contract_families), 'all') || contains(fromJSON(inputs.contract_families), 'architecture') }}
    name: Architecture mutation qualification (${{ matrix.shard }})
    runs-on: ubuntu-latest
    # Four outer shards each run two workers. A passing 453s shard plus
    # checkout/tool setup exceeded the old eight-minute job ceiling; leave
    # bounded setup/cleanup headroom without dropping tests or changing shards.
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7.0.1
        id: checkout
        with:
          ref: ${{ inputs.validation_ref || github.sha }}
          fetch-depth: 0
      - name: Record exact-ref checkout identity
        env:
          VALIDATION_KIND: exact-ref
          REQUESTED_REF: ${{ inputs.validation_ref || github.sha }}
          CHECKOUT_REF: ${{ steps.checkout.outputs.ref }}
          CHECKOUT_SHA: ${{ steps.checkout.outputs.commit }}
        shell: bash
        run: bash --noprofile --norc -euo pipefail -c "$RECORD_CHECKOUT_IDENTITY"
      - name: Install architecture mutation tools
        run: |
          if ! command -v rg >/dev/null 2>&1
          then
            sudo apt-get update \
              -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources \
              -o Dir::Etc::sourceparts=-
            sudo apt-get install --yes ripgrep
          fi
      - name: Install pinned CI YAML parser
        run: |
          python3 -m venv "$RUNNER_TEMP/ci-inventory-python"
          "$RUNNER_TEMP/ci-inventory-python/bin/python" -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r .github/ci/python-requirements.txt
          echo "$RUNNER_TEMP/ci-inventory-python/bin" >> "$GITHUB_PATH"
      - name: Execute one balanced architecture mutation shard
        run: |
          python3 -B scripts/run-python-unittest-shards.py \
            --jobs 2 \
            --shard-count 4 \
            --shard-index ${{ matrix.shard }} \
            tests/ci/test_ci_full_contract.py \
            tests/ci/test_ci_test_inventory.py \
            scripts/tests/test_check_obsolete_program_reachability.py \
            scripts/tests/test_check_native_host_catalog.py \
            scripts/tests/test_check_production_resident_routing.py \
            scripts/tests/test_check_no_retired_value_system.py \
            scripts/tests/test_rust_source.py \
            scripts/tests/test_check_type_memory_boundary.py \
            scripts/tests/test_check_type_system.py \
            scripts/tests/test_check_semantic_type_authority.py \
            scripts/tests/test_check_memory_planner.py \
            scripts/tests/test_check_memory_runtime.py \
            scripts/tests/test_run_python_unittest_shards.py \
            scripts/tests/test_check_program_artifact_contract.py \
            scripts/tests/test_check_operation_contract.py \
            scripts/tests/test_check_compiler_planning_quarantine.py

  memory-planner-contract:
    if: ${{ contains(fromJSON(inputs.contract_families), 'all') || contains(fromJSON(inputs.contract_families), 'memory') }}
    name: Memory planner contract
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7.0.1
        id: checkout
        with:
          ref: ${{ inputs.validation_ref || github.sha }}
          fetch-depth: 0
      - name: Record exact-ref checkout identity
        env:
          VALIDATION_KIND: exact-ref
          REQUESTED_REF: ${{ inputs.validation_ref || github.sha }}
          CHECKOUT_REF: ${{ steps.checkout.outputs.ref }}
          CHECKOUT_SHA: ${{ steps.checkout.outputs.commit }}
        shell: bash
        run: bash --noprofile --norc -euo pipefail -c "$RECORD_CHECKOUT_IDENTITY"
      - name: Install Rust nightly-2026-03-03
        run: rustup toolchain install nightly-2026-03-03 --profile minimal
      - name: Fetch locked memory-planner dependencies
        run: cargo +nightly-2026-03-03 fetch --locked
      - name: Execute the complete memory-planner conformance boundary
        run: |
          cargo +nightly-2026-03-03 test --locked -p mech-core \
            --all-features --test memory_plan
          cargo +nightly-2026-03-03 test --locked -p mech-engine \
            --no-default-features --features full_compiler \
            --test memory_plan
          cargo +nightly-2026-03-03 test --locked -p mech-stdlib \
            --no-default-features --features full_compiler \
            --test memory_contract
          cargo +nightly-2026-03-03 test --locked -p mech-compute
          cargo +nightly-2026-03-03 test --locked -p mech-gpu \
            --test memory_plan

  managed-memory-runtime:
    if: ${{ contains(fromJSON(inputs.contract_families), 'all') || contains(fromJSON(inputs.contract_families), 'memory') || contains(fromJSON(inputs.contract_families), 'numeric') }}
    name: Managed memory runtime
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_BUILD_JOBS: "1"
    steps:
      - uses: actions/checkout@v7.0.1
        id: checkout
        with:
          ref: ${{ inputs.validation_ref || github.sha }}
          fetch-depth: 0
      - name: Record exact-ref checkout identity
        env:
          VALIDATION_KIND: exact-ref
          REQUESTED_REF: ${{ inputs.validation_ref || github.sha }}
          CHECKOUT_REF: ${{ steps.checkout.outputs.ref }}
          CHECKOUT_SHA: ${{ steps.checkout.outputs.commit }}
        shell: bash
        run: bash --noprofile --norc -euo pipefail -c "$RECORD_CHECKOUT_IDENTITY"
      - name: Install Rust nightly-2026-03-03
        run: rustup toolchain install nightly-2026-03-03 --profile minimal
      - name: Install CI and bundled native arithmetic build tools
        run: |
          if ! command -v rg >/dev/null 2>&1 || ! command -v cc >/dev/null 2>&1 || ! command -v make >/dev/null 2>&1 || ! command -v m4 >/dev/null 2>&1
          then
            sudo apt-get update \
              -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources \
              -o Dir::Etc::sourceparts=-
            sudo apt-get install --yes ripgrep build-essential m4
          fi
      - name: Fetch locked managed-memory dependencies
        run: cargo +nightly-2026-03-03 fetch --locked
      - name: Execute the complete managed-memory conformance boundary
        run: |
          cargo +nightly-2026-03-03 test --locked -p mech-core \
            --all-features --test memory_runtime --test managed_input_descriptor \
            --test borrowed_string_footprint --test resident_lowering_attachment \
            --test canonical_schema_vectors --test semantic_serde_contract \
            --test snapshot_canonical_vectors --test snapshot_serde_contract \
            --test stdlib_macro_hygiene
          cargo +nightly-2026-03-03 test --locked -p mech-core \
            --no-default-features \
            --features functions,u8,u64,f64,string,matrixd,bool \
            --test memory_safety
      - name: Execute bounded shared snapshot ownership regression
        run: |
          OWNERSHIP_TESTS=$(cargo +nightly-2026-03-03 test --locked -p mech-core \
            --all-features --lib \
            snapshot::validation::tests::budget_registration_removal_and_same_owner_reuse_ignore_later_foreign_imports \
            -- --list --exact)
          test "$(printf '%s\n' "$OWNERSHIP_TESTS" | awk '/^snapshot::validation::tests::budget_registration_removal_and_same_owner_reuse_ignore_later_foreign_imports: test$/ { count += 1 } END { print count + 0 }')" -eq 1
          cargo +nightly-2026-03-03 test --locked -p mech-core --all-features --lib \
            snapshot::validation::tests::budget_registration_removal_and_same_owner_reuse_ignore_later_foreign_imports \
            -- --exact --test-threads=1
      - name: Execute the retained release-mode memory safety boundary
        run: |
          RUSTFLAGS="${RUSTFLAGS:-} -C debug-assertions=no" \
            cargo +nightly-2026-03-03 test --locked --release -p mech-core \
            --no-default-features \
            --features functions,u8,u64,f64,string,matrixd,bool \
            --test memory_safety
      - name: Execute maintained runtime and host memory boundaries
        run: |
          cargo +nightly-2026-03-03 test --locked -p mech-engine \
            --no-default-features --features full_compiler,resident-artifact \
            --test memory_runtime
          cargo +nightly-2026-03-03 test --locked -p mech-engine \
            --no-default-features --features full_compiler,resident-artifact \
            --lib resident::general::live::
          cargo +nightly-2026-03-03 test --locked -p mech-engine \
            --no-default-features --features full_compiler,resident-artifact \
            --lib resident::general::execution::tests::
          cargo +nightly-2026-03-03 test --locked -p mech-engine \
            --no-default-features --features full_compiler,resident-artifact \
            --lib resident::native_semantics::
          cargo +nightly-2026-03-03 test --locked -p mech-engine \
            --no-default-features --features full_compiler,resident-artifact \
            --lib memory_planner::resident::tests
          cargo +nightly-2026-03-03 test --locked -p mech-stdlib \
            --no-default-features --features standard_compiler \
            --test managed_functions
          cargo +nightly-2026-03-03 test --locked -p mech-stdlib \
            --no-default-features --features full_compiler \
            --test managed_functions
          cargo +nightly-2026-03-03 test --locked -p mech-compute \
            --test memory_runtime
          cargo +nightly-2026-03-03 test --locked -p mech-gpu \
            --test memory_runtime
          cargo +nightly-2026-03-03 test --locked -p mech-gpu \
            --features jit --test memory_runtime
          cargo +nightly-2026-03-03 check --locked -p mech-gpu --features native
      - name: Execute native compiler and batched array regressions
        timeout-minutes: 25
        run: |
          # native-build enables the general sequence and fused compiler paths.
          # GMP is built from the locked dependency; no system-gmp installation
          # or benchmark repository is needed for these local-fixture tests.
          cargo +nightly-2026-03-03 test --locked --offline -p mech-gpu \
            --no-default-features --features native-build \
            --test native_fused_regressions --test native_map_regressions \
            --test native_sequence_admission --test native_feature_admission \
            --test batched_array_cpu -- --test-threads=1
          cargo +nightly-2026-03-03 test --locked --offline -p mech-gpu \
            --no-default-features --features native-build --lib batched::aot::tests -- --test-threads=1
          cargo +nightly-2026-03-03 test --locked --offline -p mech-gpu \
            --no-default-features --features native-build --lib batched::jit::tests -- --test-threads=1
          cargo +nightly-2026-03-03 test --locked --offline -p mech-gpu \
            --no-default-features --features native-build --lib sequence::runtime::matrix_tests -- --test-threads=1
          cargo +nightly-2026-03-03 test --locked --offline -p mech-gpu \
            --no-default-features --features native-build --lib native_build::tests -- --test-threads=1
          cargo +nightly-2026-03-03 test --locked --offline -p mech-engine \
            --no-default-features --features full_compiler,resident-artifact,native-sequence \
            --lib native_sequence -- --test-threads=1
          cargo +nightly-2026-03-03 test --locked --offline -p mech-engine \
            --no-default-features --features full_compiler,resident-artifact,native-sequence \
            --test native_sequence_effects -- --test-threads=1
      - name: Execute retained engine EKF integration targets
        run: >-
          cargo +nightly-2026-03-03 test --locked --offline -p mech-engine
          --no-default-features --features full_compiler,resident-artifact,resident-ekf
          --test resident_ekf_artifact_closure --test resident_ekf_contract
          --test resident_ekf_program_activation --test resident_ekf_program_execution
          -- --test-threads=1
      - name: Execute canonical compute and native backend integration targets
        run: >-
          cargo +nightly-2026-03-03 test --locked --offline -p mech-gpu
          --no-default-features --features native,jit
          --test canonical_control --test canonical_publication --test canonical_shipped_ekf
          --test parallel_ekf --test particle_source -- --test-threads=1

  native-cli-collision:
    if: ${{ contains(fromJSON(inputs.contract_families), 'all') || contains(fromJSON(inputs.contract_families), 'memory') || contains(fromJSON(inputs.contract_families), 'numeric') }}
    name: Native CLI kept-project collision
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_BUILD_JOBS: "1"
    steps:
      - uses: actions/checkout@v7.0.1
        id: checkout
        with:
          ref: ${{ inputs.validation_ref || github.sha }}
          fetch-depth: 0
      - name: Record exact-ref checkout identity
        env:
          VALIDATION_KIND: exact-ref
          REQUESTED_REF: ${{ inputs.validation_ref || github.sha }}
          CHECKOUT_REF: ${{ steps.checkout.outputs.ref }}
          CHECKOUT_SHA: ${{ steps.checkout.outputs.commit }}
        shell: bash
        run: bash --noprofile --norc -euo pipefail -c "$RECORD_CHECKOUT_IDENTITY"
      - name: Install Rust nightly-2026-03-03
        run: rustup toolchain install nightly-2026-03-03 --profile minimal
      - name: Install CI and bundled native arithmetic build tools
        run: |
          if ! command -v rg >/dev/null 2>&1 || ! command -v cc >/dev/null 2>&1 || ! command -v make >/dev/null 2>&1 || ! command -v m4 >/dev/null 2>&1
          then
            sudo apt-get update \
              -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources \
              -o Dir::Etc::sourceparts=-
            sudo apt-get install --yes ripgrep build-essential m4
          fi
      - name: Fetch locked native CLI dependencies
        run: cargo +nightly-2026-03-03 fetch --locked
      - name: Check CLI kept-project collision before native build
        timeout-minutes: 25
        run: |
          cargo +nightly-2026-03-03 check --locked --offline -p mech \
            --features cranelift_build
          cargo +nightly-2026-03-03 test --locked --offline -p mech \
            --features cranelift_build --lib \
            cli::commands::build::tests::cranelift_kept_project_collision_precedes_emission_and_output_writes \
            -- --exact --test-threads=1

  canonical-applications:
    if: ${{ contains(fromJSON(inputs.contract_families), 'all') || contains(fromJSON(inputs.contract_families), 'native') || contains(fromJSON(inputs.contract_families), 'language') }}
    name: Canonical applications and native witnesses (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Cold builds of the independent feature profiles exhausted the shared
    # 90-minute job at the last CLI link. Keep EVERY command, but qualify the
    # independent source/native/CLI suites concurrently under the same gate.
    strategy:
      fail-fast: false
      matrix:
        suite: [source, native, cli]
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-03-03
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_BUILD_JOBS: "1"
    steps:
      - uses: actions/checkout@v7.0.1
        id: checkout
        with:
          ref: ${{ inputs.validation_ref || github.sha }}
          fetch-depth: 0
      - name: Record exact-ref checkout identity
        env:
          VALIDATION_KIND: exact-ref
          REQUESTED_REF: ${{ inputs.validation_ref || github.sha }}
          CHECKOUT_REF: ${{ steps.checkout.outputs.ref }}
          CHECKOUT_SHA: ${{ steps.checkout.outputs.commit }}
        shell: bash
        run: bash --noprofile --norc -euo pipefail -c "$RECORD_CHECKOUT_IDENTITY"
      - name: Install pinned compiler and native arithmetic tools
        run: |
          rustup toolchain install nightly-2026-03-03 --profile minimal
          sudo apt-get update -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=-
          sudo apt-get install --yes ripgrep build-essential m4
      - name: Fetch locked application dependencies
        run: cargo +nightly-2026-03-03 fetch --locked
      - name: Execute canonical resident applications and retained tail controls
        if: ${{ matrix.suite == 'source' }}
        run: |
          cargo +nightly-2026-03-03 test --locked --offline -p mech-stdlib \
            --no-default-features --features full_compiler \
            --test applications --test tail_control -- --test-threads=1
      - name: Execute canonical collection and text source contracts
        if: ${{ matrix.suite == 'source' }}
        run: >-
          cargo +nightly-2026-03-03 test --locked --offline -p mech-stdlib
          --no-default-features --features full_compiler
          --test comprehension_captures --test comprehension_work_source
          --test control_local_geometry --test control_matrix_captures
          --test control_result_shapes --test function_output_contexts
          --test knucleotide_record_source --test map_keys_comprehensions
          --test map_source --test match_result_schemas --test matrix_block_comprehensions
