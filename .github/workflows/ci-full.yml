  canonical-linked-applications:
    if: ${{ contains(fromJSON(inputs.contract_families), 'all') || contains(fromJSON(inputs.contract_families), 'native') || contains(fromJSON(inputs.contract_families), 'language') }}
    name: Linked application qualification
    runs-on: ubuntu-latest
    # Each qualification builds isolated generated applications. A cold Linux
    # run exhausted one hour during Match, before iteration, managed programs
    # and resident CLI qualification. Keep a finite allowance for the full job.
    timeout-minutes: 240
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-03-03
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_BUILD_JOBS: "1"
    steps:
      - uses: actions/checkout@v7.0.1
        id: checkout
        with:
          ref: ${{ inputs.validation_ref || github.sha }}
          fetch-depth: 0
      - name: Record exact-ref checkout identity
        env:
          VALIDATION_KIND: exact-ref
          REQUESTED_REF: ${{ inputs.validation_ref || github.sha }}
          CHECKOUT_REF: ${{ steps.checkout.outputs.ref }}
          CHECKOUT_SHA: ${{ steps.checkout.outputs.commit }}
        shell: bash
        run: bash --noprofile --norc -euo pipefail -c "$RECORD_CHECKOUT_IDENTITY"
      - name: Install pinned compiler and native arithmetic tools
        run: |
          rustup toolchain install nightly-2026-03-03 --profile minimal
          sudo apt-get update -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=-
          sudo apt-get install --yes ripgrep build-essential m4
      - name: Fetch locked application dependencies
        run: cargo +nightly-2026-03-03 fetch --locked
      - name: Execute activated native host I/O and application syntax
        run: >-
          cargo +nightly-2026-03-03 test --locked --offline -p mech-gpu
          --no-default-features --features native-build,native-io
          --test native_host_io --test repeated_application
          --test native_host_application --test native_source_admission
          --test control_fsm --test control_postfix_selection --test control_selection
          --test control_signed --test idiomatic_sources -- --test-threads=1
      - name: Qualify the same native host executable under both launch policies
        env:
          MECH_NATIVE_QUALIFICATION_DIRECTORY: ${{ runner.temp }}/native-host-evidence
        run: >-
          cargo +nightly-2026-03-03 test --locked --offline -p mech-gpu
          --no-default-features --features native-build,native-io
          --test native_host_application -- --ignored --exact
          one_linked_executable_runs_secure_and_trusted_without_rebuilding
          --test-threads=1
      - name: Verify linked native control selection is nonempty
        env:
          MECH_CONTROL_INLINE: "0"
          MECH_CONTROL_QUALIFICATION_DIRECTORY: ${{ runner.temp }}/native-control-evidence
        run: |
          set -euo pipefail
          CONTROL_QUALIFICATION_TESTS=$(cargo +nightly-2026-03-03 test --locked --offline -p mech-gpu \
            --no-default-features --features native-build,native-io \
            --test control_application -- --list --ignored --exact \
            one_linked_control_executable_preserves_signed_machine_outputs)
          test "$(printf '%s\n' "$CONTROL_QUALIFICATION_TESTS" | rg -c '^one_linked_control_executable_preserves_signed_machine_outputs: test$')" -eq 1
      - name: Qualify linked native control and signed outputs
        env:
          MECH_CONTROL_INLINE: "0"
          MECH_CONTROL_QUALIFICATION_DIRECTORY: ${{ runner.temp }}/native-control-evidence
        run: |
          cargo +nightly-2026-03-03 test --locked --offline -p mech-gpu \
            --no-default-features --features native-build,native-io \
            --test control_application -- --ignored --exact \
            one_linked_control_executable_preserves_signed_machine_outputs --test-threads=1
      - name: Verify linked native stdin selection is nonempty
        env:
          MECH_NATIVE_STDIN_QUALIFICATION_DIRECTORY: ${{ runner.temp }}/native-stdin-evidence
        run: |
          set -euo pipefail
          STDIN_QUALIFICATION_TESTS=$(cargo +nightly-2026-03-03 test --locked --offline -p mech-gpu \
            --no-default-features --features native-build,native-io \
            --test native_stdin_application -- --list --ignored --exact \
            one_linked_stdin_executable_preserves_unicode_snapshots_and_launch_policy)
          test "$(printf '%s\n' "$STDIN_QUALIFICATION_TESTS" | rg -c '^one_linked_stdin_executable_preserves_unicode_snapshots_and_launch_policy: test$')" -eq 1
      - name: Qualify linked native stdin bytes and launch policy
        env:
          MECH_NATIVE_STDIN_QUALIFICATION_DIRECTORY: ${{ runner.temp }}/native-stdin-evidence
        run: |
          cargo +nightly-2026-03-03 test --locked --offline -p mech-gpu \
            --no-default-features --features native-build,native-io \
            --test native_stdin_application -- --ignored --exact \
            one_linked_stdin_executable_preserves_unicode_snapshots_and_launch_policy --test-threads=1
      - name: Qualify linked canonical native applications
        env:
          MECH_CANONICAL_NATIVE_SOURCE_COMMIT: ${{ steps.checkout.outputs.commit }}
          MECH_CANONICAL_NATIVE_EVIDENCE_DIR: ${{ runner.temp }}/canonical-native-evidence
        run: >-
          cargo +nightly-2026-03-03 test --locked --offline -p mech-gpu
          --no-default-features --features canonical-native
          --test canonical_artifact_application -- --ignored --exact
          linked_canonical_artifact_scalar_applications_are_typed_bounded_and_atomic
          --test-threads=1
      - name: Verify linked canonical cast selection is nonempty
        run: |
          CAST_QUALIFICATION_TESTS=$(cargo +nightly-2026-03-03 test --locked --offline -p mech-gpu \
            --no-default-features --features canonical-native \
            --test canonical_artifact_application -- --list --ignored --exact \
            linked_canonical_artifact_cast_applications_preserve_checked_boundaries)
          test "$(printf '%s\n' "$CAST_QUALIFICATION_TESTS" | rg -c '^linked_canonical_artifact_cast_applications_preserve_checked_boundaries: test$')" -eq 1
      - name: Qualify linked canonical cast applications
        env:
          MECH_CANONICAL_NATIVE_SOURCE_COMMIT: ${{ steps.checkout.outputs.commit }}
          MECH_CANONICAL_NATIVE_EVIDENCE_DIR: ${{ runner.temp }}/canonical-cast-evidence
        run: >-
          cargo +nightly-2026-03-03 test --locked --offline -p mech-gpu
          --no-default-features --features canonical-native
          --test canonical_artifact_application -- --ignored --exact
          linked_canonical_artifact_cast_applications_preserve_checked_boundaries
          --test-threads=1
      - name: Verify linked canonical Match selection is nonempty
        run: |
          set -euo pipefail
          MATCH_QUALIFICATION_TESTS=$(cargo +nightly-2026-03-03 test --locked --offline -p mech-gpu \
            --no-default-features --features canonical-native \
            --test canonical_artifact_match_application -- --list --ignored --exact \
            linked_canonical_match_applications_are_lazy_bounded_and_atomic)
          test "$(printf '%s\n' "$MATCH_QUALIFICATION_TESTS" | rg -c '^linked_canonical_match_applications_are_lazy_bounded_and_atomic: test$')" -eq 1
      - name: Qualify linked canonical Match applications
        env:
          MECH_CANONICAL_MATCH_SOURCE_COMMIT: ${{ steps.checkout.outputs.commit }}
          MECH_CANONICAL_MATCH_EVIDENCE_DIR: ${{ runner.temp }}/canonical-match-evidence
        run: >-
          cargo +nightly-2026-03-03 test --locked --offline -p mech-gpu
          --no-default-features --features canonical-native
          --test canonical_artifact_match_application -- --ignored --exact
          linked_canonical_match_applications_are_lazy_bounded_and_atomic
          --test-threads=1
      - name: Verify linked canonical iteration selection is nonempty
        run: |
          set -euo pipefail
          ITERATION_QUALIFICATION_TESTS=$(cargo +nightly-2026-03-03 test --locked --offline -p mech-gpu \
            --no-default-features --features canonical-native \
            --test canonical_artifact_iteration -- --list --ignored --exact \
            linked_qualification::one_linked_iteration_executable_preserves_exact_typed_loops_and_denials)
          test "$(printf '%s\n' "$ITERATION_QUALIFICATION_TESTS" | rg -c '^linked_qualification::one_linked_iteration_executable_preserves_exact_typed_loops_and_denials: test$')" -eq 1
      - name: Qualify linked canonical iteration application
        env:
          MECH_CANONICAL_ITERATION_SOURCE_COMMIT: ${{ steps.checkout.outputs.commit }}
          MECH_CANONICAL_ITERATION_EVIDENCE_DIR: ${{ runner.temp }}/canonical-iteration-evidence
        run: >-
          cargo +nightly-2026-03-03 test --locked --offline -p mech-gpu
          --no-default-features --features canonical-native
          --test canonical_artifact_iteration -- --ignored --exact
          linked_qualification::one_linked_iteration_executable_preserves_exact_typed_loops_and_denials
          --test-threads=1
      - name: Verify linked canonical managed program selection is nonempty
        run: |
          set -euo pipefail
          PROGRAM_QUALIFICATION_TESTS=$(cargo +nightly-2026-03-03 test --locked --offline -p mech-gpu \
            --no-default-features --features canonical-native-program \
            --test canonical_artifact_program -- --list --ignored --exact \
            linked_qualification::linked_managed_programs_preserve_canonical_outputs_errors_and_denials)
          test "$(printf '%s\n' "$PROGRAM_QUALIFICATION_TESTS" | rg -c '^linked_qualification::linked_managed_programs_preserve_canonical_outputs_errors_and_denials: test$')" -eq 1
      - name: Qualify linked canonical managed programs
        env:
          MECH_CANONICAL_PROGRAM_SOURCE_COMMIT: ${{ steps.checkout.outputs.commit }}
          MECH_CANONICAL_PROGRAM_EVIDENCE_DIR: ${{ runner.temp }}/canonical-program-evidence
        run: >-
          cargo +nightly-2026-03-03 test --locked --offline -p mech-gpu
          --no-default-features --features canonical-native-program
          --test canonical_artifact_program -- --ignored --exact
          linked_qualification::linked_managed_programs_preserve_canonical_outputs_errors_and_denials
          --test-threads=1
      - name: Verify linked canonical resident CLI selection is nonempty
        env:
          MECH_CANONICAL_CLI_SOURCE_COMMIT: ${{ steps.checkout.outputs.commit }}
          MECH_CANONICAL_CLI_EVIDENCE_DIR: ${{ runner.temp }}/canonical-cli-evidence
        run: |
          set -euo pipefail
          CLI_QUALIFICATION_TESTS=$(cargo +nightly-2026-03-03 test --locked --offline -p mech-build \
            --no-default-features --features standard-hosts,process-supervision \
            --test canonical_cli_application -- --list --ignored --exact \
            linked_canonical_cli_arguments_and_stdin_finish_without_drivers)
          test "$(printf '%s\n' "$CLI_QUALIFICATION_TESTS" | rg -c '^linked_canonical_cli_arguments_and_stdin_finish_without_drivers: test$')" -eq 1
      - name: Qualify linked canonical resident CLI applications
