    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_BUILD_JOBS: "1"
    steps:
      - uses: actions/checkout@v7.0.1
        id: checkout
        with:
          ref: ${{ inputs.validation_ref || github.sha }}
      - name: Record exact-ref checkout identity
        env:
          VALIDATION_KIND: exact-ref
          REQUESTED_REF: ${{ inputs.validation_ref || github.sha }}
          CHECKOUT_REF: ${{ steps.checkout.outputs.ref }}
          CHECKOUT_SHA: ${{ steps.checkout.outputs.commit }}
        shell: bash
        run: bash --noprofile --norc -euo pipefail -c "$RECORD_CHECKOUT_IDENTITY"
      - name: Install Rust nightly-2026-03-03
        run: rustup toolchain install nightly-2026-03-03 --profile minimal
      - name: Fetch locked managed-memory dependencies
        run: cargo +nightly-2026-03-03 fetch --locked
      - name: Execute isolated fixed-shape catalog coverage
        run: |
          cargo +nightly-2026-03-03 test --locked -p mech-stdlib \
            --no-default-features --features "full_compiler,${{ matrix.feature }}" \
            --test managed_functions

  managed-memory-miri:
