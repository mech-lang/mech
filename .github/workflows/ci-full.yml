            --no-default-features --features standard_compiler \
            --test profile_contracts
      - name: Validate frozen full catalog profiles
        if: ${{ matrix.profile == 'full' }}
        run: |
          cargo +nightly-2026-03-03 test --locked -p mech-stdlib \
            --no-default-features --features full_runtime \
