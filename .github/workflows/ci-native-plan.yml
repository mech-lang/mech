name: Native plan

on:
  workflow_call:
    inputs:
      validation_ref:
        description: Exact commit or ref to validate
        required: true
        type: string

jobs:
  native-plan:
    name: Native plan
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.validation_ref }}
      - name: Install Rust nightly-2026-03-03
        run: rustup toolchain install nightly-2026-03-03 --profile minimal
      - name: Fetch locked generated-project dependencies
        run: |
          cargo +nightly-2026-03-03 fetch --locked
          cargo +nightly-2026-03-03 fetch --locked --manifest-path tests/fixtures/native-build-owner-runner/Cargo.toml
      - name: Verify registry projects and live shutdown first
        run: cargo +nightly-2026-03-03 test -p mech-build --all-features --test registry_generated_project
      - name: Generate every remaining native fixture project
        run: |
          cargo +nightly-2026-03-03 test -p mech-build --all-features --test native_host_pruning
          cargo +nightly-2026-03-03 test -p mech-build --all-features -- \
            --skip registry_project_is_exact_unpatched_and_buildable_with_a_test_only_patch \
            --skip live_registry_project_runs_once_handles_ctrlc_and_cleans_up_after_failure
          python3 scripts/check-native-host-catalog.py
          python3 scripts/check-generated-project-determinism.py
          python3 scripts/check-native-application-graphs.py
