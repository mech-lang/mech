name: R5 CI diagnostics
on:
  push:
    branches: [codex/r5-ci-diagnostics]
    paths: [.github/workflows/r5-ci-diagnostics.yml]
permissions:
  contents: read
jobs:
  nbody-allocation-diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TERM_COLOR: never
      RUSTUP_TOOLCHAIN: nightly-2026-03-03
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 251be1356f5049ce00ced8de519e4646d3159e24
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve exact parent and candidate source before instrumentation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -u - <<'PY'
          import base64, hashlib, json, pathlib, subprocess
          root = pathlib.Path('/tmp/r5-allocation-diagnosis')
          root.mkdir()
          subprocess.run(['git', 'archive', '--format=tar.gz', '--output=' + str(root/'parent-source.tar.gz'), 'HEAD'], check=True)
          raw = subprocess.check_output(['gh', 'api', 'repos/mech-lang/mech/git/blobs/5bb36788dc7edbc58d63c44ee24297924dbebf50'], timeout=60)
          patch = base64.b64decode(json.loads(raw)['content'])
          assert hashlib.sha256(patch).hexdigest() == 'c8680d73b7283b1006aa66aeb306c104901cc10242e792a114eb9a596f98d67d'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          subprocess.run(['git', 'add', '-u'], check=True)
          tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          assert tree == '43686788eaa0089b351106814fd17b2b57ba70d5'
          (root/'tree').write_text(tree + '\n')
          (root/'parent').write_text(subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True))
          (root/'candidate.patch').write_bytes(patch)
          subprocess.run(['git', 'archive', '--format=tar.gz', '--output=' + str(root/'candidate-source.tar.gz'), tree], check=True)
          PY
      - name: Export exact source for local reproduction
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r5-fixed-source-for-repair
          path: /tmp/r5-allocation-diagnosis
          retention-days: 3
      - name: Install pinned compiler
        run: rustup toolchain install nightly-2026-03-03 --profile minimal
      - name: Instrument only the diagnostic fixture allocator
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/fixtures/d2-contract-generator/src/main.rs')
          s = p.read_text()
          old = 'use std::sync::atomic::{AtomicUsize, Ordering};'
          assert s.count(old) == 1
          s = s.replace(old, 'use std::sync::atomic::{AtomicBool, AtomicUsize, Ordering};')
          old = 'static ALLOCATIONS: AtomicUsize = AtomicUsize::new(0);'
          assert s.count(old) == 1
          s = s.replace(old, old + '\nstatic TRACE_ENABLED: AtomicBool = AtomicBool::new(false);\nstatic TRACE_BUSY: AtomicBool = AtomicBool::new(false);\nstatic TRACE_COUNT: AtomicUsize = AtomicUsize::new(0);')
          old = '        ALLOCATIONS.fetch_add(1, Ordering::Relaxed);\n        unsafe { System.alloc(layout) }'
          assert s.count(old) == 1
          new = '''        ALLOCATIONS.fetch_add(1, Ordering::Relaxed);
                  let pointer = unsafe { System.alloc(layout) };
                  if TRACE_ENABLED.load(Ordering::Relaxed)
                      && !TRACE_BUSY.swap(true, Ordering::Relaxed)
                  {
                      let index = TRACE_COUNT.fetch_add(1, Ordering::Relaxed);
                      if index < 40 {
                          eprintln!("DIAGNOSTIC_ALLOC index={index} bytes={}\\n{}", layout.size(), std::backtrace::Backtrace::force_capture());
                      }
                      TRACE_BUSY.store(false, Ordering::Relaxed);
                  }
                  pointer'''
          s = s.replace(old, new)
          old = '    ALLOCATIONS.store(0, Ordering::SeqCst);'
          assert s.count(old) == 1
          s = s.replace(old, '    TRACE_ENABLED.store(true, Ordering::Relaxed);\n' + old)
          p.write_text(s)
          PY
          git diff -- tests/fixtures/d2-contract-generator/src/main.rs > /tmp/r5-allocation-diagnosis/instrumentation.patch
      - name: Capture allocation call sites without treating instrumentation as qualification
        run: |
          set -euo pipefail
          set +e
          /usr/bin/time -v -o /tmp/r5-allocation-diagnosis/time.txt python3 scripts/check-r1-artifact-closure.py nbody 2>&1 | tee /tmp/r5-allocation-diagnosis/allocations.log
          status=${PIPESTATUS[0]}
          set -e
          echo "$status" > /tmp/r5-allocation-diagnosis/instrumented-exit-status
          exit "$status"
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r5-nbody-allocation-stacks
          path: /tmp/r5-allocation-diagnosis
          retention-days: 3
