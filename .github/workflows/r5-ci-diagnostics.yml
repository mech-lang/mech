name: R5 CI diagnostics
on:
  push:
    branches: [codex/r5-ci-diagnostics]
    paths: [.github/workflows/r5-ci-diagnostics.yml]
permissions:
  contents: read
jobs:
  prepare:
    name: Materialize exact candidate without updating source refs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.candidate.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 251be1356f5049ce00ced8de519e4646d3159e24
          fetch-depth: 0
          persist-credentials: false
      - name: Verify patches, tree, and parent; create only immutable Git objects
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -u - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess
          root = pathlib.Path('/tmp/r5-selector-candidate')
          root.mkdir()
          parent = '251be1356f5049ce00ced8de519e4646d3159e24'
          expected_tree = 'b2041cb643dfe495389d3b23553f80c187933382'
          def api(path, data=None):
              args = ['gh', 'api', 'repos/mech-lang/mech/' + path]
              if data is not None:
                  args += ['--method', 'POST', '--input', '-']
              return json.loads(subprocess.check_output(args, input=None if data is None else json.dumps(data).encode(), timeout=120))
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == parent
          for name, blob, digest in [
              ('fixed-admission.patch', '5bb36788dc7edbc58d63c44ee24297924dbebf50', 'c8680d73b7283b1006aa66aeb306c104901cc10242e792a114eb9a596f98d67d'),
              ('fixed-selectors.patch', 'c96f5dd2c34e1bad2fadfada7efe63bfbc7f1965', '1c65c17fefcd5af70648b5b457df64e5a2dc43b31de8cfb53fd134ef784a980f'),
          ]:
              patch = base64.b64decode(api('git/blobs/' + blob)['content'])
              assert hashlib.sha256(patch).hexdigest() == digest
              subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
              subprocess.run(['git', 'apply', '-'], input=patch, check=True)
              (root/name).write_bytes(patch)
          subprocess.run(['git', 'add', '-u'], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          assert subprocess.check_output(['git', 'write-tree'], text=True).strip() == expected_tree
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only', 'HEAD'], text=True).splitlines()
          assert len(paths) == 8
          elements = []
          for path in paths:
              content = pathlib.Path(path).read_text()
              blob = api('git/blobs', {'content': content, 'encoding': 'utf-8'})['sha']
              assert blob == subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              elements.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': blob})
          base_tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          tree = api('git/trees', {'base_tree': base_tree, 'tree': elements})['sha']
          assert tree == expected_tree
          commit = api('git/commits', {
              'message': 'fix(r5): retain checked fixed-extent admission for Index and F64 selectors\n\nReuse immutable numeric turn-plan storage while admitting concrete kernel costs against the authoritative budget. Keep masks, payloads, changing extents, and implementation scratch on the live planner. Validate changing and invalid F64 indices before any write; retain the frozen zero-allocation n-body assertion.',
              'tree': tree,
              'parents': [parent],
          })['sha']
          receipt = {'parent': parent, 'tree': tree, 'commit': commit, 'paths': paths}
          (root/'receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('sha=' + commit + '\n')
          print(json.dumps(receipt, indent=2))
          PY
      - name: Preserve exact candidate receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r5-selector-candidate
          path: /tmp/r5-selector-candidate
          retention-days: 3

  complete-qualification:
    name: Complete unchanged full qualification
    needs: prepare
    uses: mech-lang/mech/.github/workflows/ci-full.yml@251be1356f5049ce00ced8de519e4646d3159e24
    with:
      validation_ref: ${{ needs.prepare.outputs.candidate }}
      release_channel: stable

  static-and-resident-engine:
    name: Exact static contracts and resident engine regressions
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TERM_COLOR: never
      RUSTUP_TOOLCHAIN: nightly-2026-03-03
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned compiler and original static tools
        run: |
          rustup toolchain install nightly-2026-03-03 --profile minimal --component rustfmt
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes ripgrep
          fi
          cargo +nightly-2026-03-03 fetch --locked
      - name: Run exact static-contract commands and all resident engine regressions
        run: |
          set -euo pipefail
          mkdir -p /tmp/r5-selector-regressions
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/ci.yml').read_text()
          body = text.split('      - name: Check formatting and cheap global contracts\n        run: |\n', 1)[1].split('\n  standard-linux:', 1)[0]
          lines = body.rstrip().splitlines()
          assert all(not line.strip() or line.startswith('          ') for line in lines)
          Path('/tmp/r5-selector-regressions/static.sh').write_text('set -euo pipefail\n' + '\n'.join(line[10:] for line in lines) + '\n')
          PY
          bash -n /tmp/r5-selector-regressions/static.sh
          bash /tmp/r5-selector-regressions/static.sh 2>&1 | tee /tmp/r5-selector-regressions/static.log
          cargo +nightly-2026-03-03 test --locked -p mech-engine --no-default-features --features full_compiler,resident-artifact --lib --test r5_memory_plan 2>&1 | tee /tmp/r5-selector-regressions/engine.log
          python3 -B -m unittest scripts/tests/test_check_r5_memory_planner.py scripts/tests/test_native_linkage_profiles.py 2>&1 | tee /tmp/r5-selector-regressions/checker-tests.log
          test "$(git rev-parse HEAD^{tree})" = b2041cb643dfe495389d3b23553f80c187933382
          git diff --exit-code
      - name: Preserve static and engine evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r5-selector-static-and-engine
          path: /tmp/r5-selector-regressions
          retention-days: 3
