name: R5 CI diagnostics
on:
  push:
    branches: [codex/r5-ci-diagnostics]
    paths: [.github/workflows/r5-ci-diagnostics.yml]
permissions:
  contents: read
jobs:
  architecture-complete-history:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TERM_COLOR: never
      RUSTUP_TOOLCHAIN: nightly-2026-03-03
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 251be1356f5049ce00ced8de519e4646d3159e24
          fetch-depth: 0
          persist-credentials: false
      - name: Apply the unchanged candidate and copy the authoritative architecture commands
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -u - <<'PY'
          import base64, hashlib, json, pathlib, subprocess
          root = pathlib.Path('/tmp/r5-architecture-exact')
          root.mkdir()
          raw = subprocess.check_output(['gh', 'api', 'repos/mech-lang/mech/git/blobs/5bb36788dc7edbc58d63c44ee24297924dbebf50'], timeout=60)
          patch = base64.b64decode(json.loads(raw)['content'])
          assert hashlib.sha256(patch).hexdigest() == 'c8680d73b7283b1006aa66aeb306c104901cc10242e792a114eb9a596f98d67d'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          subprocess.run(['git', 'add', '-u'], check=True)
          tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          assert tree == '43686788eaa0089b351106814fd17b2b57ba70d5'
          (root/'tree').write_text(tree + '\n')
          (root/'candidate.patch').write_bytes(patch)
          text = pathlib.Path('.github/workflows/ci-full.yml').read_text()
          job = text.split('\n  architecture-contracts:\n', 1)[1].split('\n  r5-memory-planner:\n', 1)[0]
          names = ['Validate permanent architecture contracts', 'Execute the complete R2 conformance boundary', 'Execute the complete R3 conformance boundary', 'Execute the complete R4 conformance boundary']
          commands = []
          selected = []
          for step in job.split('\n      - name: ')[1:]:
              name = step.splitlines()[0]
              if name not in names:
                  continue
              kind, body = step.split('\n        run: ', 1)[1].split('\n', 1)
              lines = body.rstrip('\n').splitlines()
              assert kind in ('|', '>-')
              assert all(not line.strip() or line.startswith('          ') for line in lines)
              lines = [line[10:] for line in lines]
              commands.append((' '.join(lines) if kind == '>-' else '\n'.join(lines)) + '\n')
              selected.append(name)
          assert selected == names
          (root/'commands.sh').write_text('set -euo pipefail\n' + '\n'.join(commands))
          print('Exact tree:', tree)
          print('Authoritative steps:', selected)
          PY
          bash -n /tmp/r5-architecture-exact/commands.sh
      - name: Install pinned compiler and original architecture tools
        run: |
          rustup toolchain install nightly-2026-03-03 --profile minimal
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes ripgrep
          fi
          cargo +nightly-2026-03-03 fetch --locked
      - name: Run the complete unchanged architecture qualification
        run: |
          set -euo pipefail
          set +e
          /usr/bin/time -v -o /tmp/r5-architecture-exact/time.txt bash /tmp/r5-architecture-exact/commands.sh 2>&1 | tee /tmp/r5-architecture-exact/command.log
          status=${PIPESTATUS[0]}
          set -e
          echo "$status" > /tmp/r5-architecture-exact/exit-status
          git diff HEAD --check
          test "$(git write-tree)" = 43686788eaa0089b351106814fd17b2b57ba70d5
          git diff --exit-code
          exit "$status"
      - name: Preserve exact architecture qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r5-fixed-architecture-complete-history
          path: /tmp/r5-architecture-exact
          retention-days: 3
