name: R5 CI diagnostics
on:
  push:
    branches: [codex/r5-ci-diagnostics]
    paths: [.github/workflows/r5-ci-diagnostics.yml]
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: "1"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: never
  RUSTUP_TOOLCHAIN: nightly-2026-03-03
jobs:
  cache-exclusions:
    name: Diagnose remaining activation cache exclusions
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 962c217b10fb5e5a002bda16334dbd1f0d15da16
          persist-credentials: false
      - name: Install pinned compiler
        run: rustup toolchain install nightly-2026-03-03 --profile minimal
      - name: Instrument activation only without altering eligibility or execution
        run: |
          mkdir -p /tmp/r5-cache-exclusions
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/engine/src/resident/general/execution.rs')
          s = p.read_text()
          old = '            if super::live::has_invariant_memory_facts(call) {'
          assert s.count(old) == 1
          diagnostic = '''            eprintln!("CACHE_DIAGNOSTIC node={} eligible={} operation={} scratch={:?} deferred={:?} regions={:?}", artifact_node.get(), super::live::has_invariant_memory_facts(call), call.bound_call.operation_descriptor().canonical_name, call.implementation_memory, call.deferred_witnesses, call.output_regions);
                      for (direction, ports) in [("in", call.inputs.as_ref()), ("out", call.outputs.as_ref())] {
                          for (ordinal, port) in ports.iter().enumerate() {
                              eprintln!("CACHE_PORT node={} direction={direction} ordinal={ordinal} storage={:?} payload={:?}", artifact_node.get(), port.value.storage, port.value.payload);
                          }
                      }
          '''
          p.write_text(s.replace(old, diagnostic + old))
          PY
          git diff > /tmp/r5-cache-exclusions/instrumentation.patch
      - name: Reproduce frozen allocation failure with activation evidence
        run: |
          set -euo pipefail
          python3 scripts/check-r1-artifact-closure.py nbody 2>&1 | tee /tmp/r5-cache-exclusions/command.log
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r5-cache-exclusions
          path: /tmp/r5-cache-exclusions
          retention-days: 3

  resolved-specialization:
    name: Qualify complete frozen specialization cases with resolved contracts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 962c217b10fb5e5a002bda16334dbd1f0d15da16
          fetch-depth: 0
          persist-credentials: false
      - name: Apply only the fixture's production contract-resolution path
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, pathlib, subprocess
          root = pathlib.Path('/tmp/r5-resolved-specialization')
          root.mkdir()
          raw = subprocess.check_output(['gh', 'api', 'repos/mech-lang/mech/git/blobs/d3132bc3ecffddbbe8a27939ed3a1879eb0a8616'])
          patch = base64.b64decode(json.loads(raw)['content'])
          assert hashlib.sha256(patch).hexdigest() == '6363de47212892be66b26e9e06043e57c203c1406f683686452281aff7ede828'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          (root/'candidate.patch').write_bytes(patch)
          subprocess.run(['git', 'add', '-u'], check=True)
          (root/'tree').write_text(subprocess.check_output(['git', 'write-tree'], text=True))
          (root/'parent').write_text(subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True))
          PY
      - name: Install pinned compiler and static tools
        run: |
          rustup toolchain install nightly-2026-03-03 --profile minimal --component rustfmt
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes ripgrep
          fi
      - name: Run unchanged full-feature frozen test and the complete source qualification
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --locked --manifest-path src/stdlib/Cargo.toml --no-default-features --features full_compiler,matrix2,vector2 --test specialization_contract 2>&1 | tee /tmp/r5-resolved-specialization/specialization.log
          python3 scripts/check-function-contracts.py source 2>&1 | tee /tmp/r5-resolved-specialization/source.log
      - name: Preserve qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r5-resolved-specialization
          path: /tmp/r5-resolved-specialization
          retention-days: 3
