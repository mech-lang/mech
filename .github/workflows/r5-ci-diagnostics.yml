name: R5 CI diagnostics
on:
  push:
    branches: [codex/r5-ci-diagnostics]
    paths: [.github/workflows/r5-ci-diagnostics.yml]
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: "1"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: never
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 09ea5f648fe83dbf8f0fab5ed6499dec31052a69
          persist-credentials: false
      - name: Prepare the frozen v2 candidate without moving refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -u - <<'PY'
          import base64, gzip, hashlib, json, pathlib, subprocess
          root = pathlib.Path('/tmp/r5-v2')
          root.mkdir(exist_ok=True)
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert head == '09ea5f648fe83dbf8f0fab5ed6499dec31052a69'
          def api(path, payload=None):
              command = ['gh', 'api', 'repos/mech-lang/mech/' + path]
              if payload is not None:
                  command += ['--method', 'POST', '--input', '-']
              result = subprocess.run(command, input=json.dumps(payload) if payload is not None else None, text=True, capture_output=True, timeout=60)
              if result.returncode:
                  raise RuntimeError(result.stderr)
              return json.loads(result.stdout)
          patches = [
              (['01cdbe9c2a5d314412128595849e187f5a09dede', '55ba48ce8679bfb01aa9faebb5b097b4ca9a9059'], '349ce09d5acb4e58bbcfcb603f8abab7e6bea6a15a05d395161657b4f0ca1d24'),
              (['aa9d59b6a98955a8f71a02dd5f19768810887dcd'], '362163324935107668a361420f9e65f20ceffcbc526af956cdd1448d371f65e9'),
          ]
          for blobs, digest in patches:
              patch = gzip.decompress(b''.join(base64.b64decode(api('git/blobs/' + sha)['content']) for sha in blobs))
              assert hashlib.sha256(patch).hexdigest() == digest
              subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
              subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          subprocess.run(['git', 'add', '--all'], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          patch = subprocess.check_output(['git', 'diff', '--cached', '--binary'])
          (root/'candidate.patch').write_bytes(patch)
          tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          elements = []
          for name in paths:
              sha = api('git/blobs', {'content': pathlib.Path(name).read_text(), 'encoding': 'utf-8'})['sha']
              elements.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': sha})
          receipt = {'parent': head, 'tree': tree, 'patch_sha256': hashlib.sha256(patch).hexdigest(), 'tree_elements': elements, 'branch_refs_changed': False}
          (root/'receipt.json').write_text(json.dumps(receipt, indent=2))
          print(json.dumps(receipt, indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r5-v2-candidate
          path: /tmp/r5-v2
          retention-days: 2
  qualify:
    name: V2 complete qualification (${{ matrix.case }})
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: nbody
            command: cargo fetch --locked && python3 scripts/check-r1-artifact-closure.py nbody
          - case: engine
            command: cargo test --locked -p mech-engine --no-default-features --features full_compiler,resident-artifact --lib --test r5_memory_plan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 09ea5f648fe83dbf8f0fab5ed6499dec31052a69
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r5-v2-candidate
          path: /tmp/r5-v2
      - name: Verify and apply the exact candidate
        run: |
          python3 -u - <<'PY'
          import hashlib, json, pathlib, subprocess
          root = pathlib.Path('/tmp/r5-v2')
          receipt = json.loads((root/'receipt.json').read_text())
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == receipt['parent']
          patch = (root/'candidate.patch').read_bytes()
          assert hashlib.sha256(patch).hexdigest() == receipt['patch_sha256']
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          assert subprocess.check_output(['git', 'write-tree'], text=True).strip() == receipt['tree']
          print('Qualified tree:', receipt['tree'])
          PY
      - name: Install the pinned compiler
        run: |
          rustup toolchain install nightly-2026-03-03 --profile minimal
          rustup default nightly-2026-03-03
      - name: Execute complete qualification
        env:
          COMMAND: ${{ matrix.command }}
        run: |
          set -euo pipefail
          set +e
          /usr/bin/time -v -o /tmp/r5-v2/time.txt bash -euo pipefail -c "$COMMAND" 2>&1 | tee /tmp/r5-v2/command.log
          status=${PIPESTATUS[0]}
          set -e
          cat /tmp/r5-v2/time.txt
          echo "$status" > /tmp/r5-v2/exit-status
          git diff --exit-code
          exit "$status"
      - name: Preserve complete qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r5-v2-${{ matrix.case }}
          path: /tmp/r5-v2
          retention-days: 2
