name: R5 CI diagnostics
on:
  push:
    branches: [codex/r5-ci-diagnostics]
    paths: [.github/workflows/r5-ci-diagnostics.yml]
permissions:
  contents: read
jobs:
  resource-reproduction:
    name: Resource reproduction (${{ matrix.case }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: math-owner
            command: python3 scripts/check-native-linkage-coverage.py owners mech-math
          - case: nbody
            command: python3 scripts/check-r1-artifact-closure.py nbody
          - case: rational-surface
            command: python3 scripts/check-native-linkage-coverage.py surface extended-math-shard-rational
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e1bdb6363188751565a5c1b4de984e3e49d1a04b
      - name: Install the pinned compiler
        run: |
          rustup toolchain install nightly-2026-03-03 --profile minimal
          rustup default nightly-2026-03-03
      - name: Run the unchanged failing profile and measure resources
        env:
          COMMAND: ${{ matrix.command }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/r5-resources
          git rev-parse HEAD | tee /tmp/r5-resources/HEAD
          rustc -Vv | tee /tmp/r5-resources/compiler.txt
          (
            while true; do
              date -u +%FT%TZ
              free -m
              ps -eo pid,ppid,rss,pcpu,comm --sort=-rss | head -12 || true
              sleep 15
            done
          ) > /tmp/r5-resources/memory.log &
          monitor=$!
          trap 'kill "$monitor" 2>/dev/null || true; wait "$monitor" 2>/dev/null || true' EXIT
          set +e
          /usr/bin/time -v -o /tmp/r5-resources/time.txt bash -c "$COMMAND" 2>&1 | tee /tmp/r5-resources/command.log
          status=${PIPESTATUS[0]}
          set -e
          cat /tmp/r5-resources/time.txt
          printf '%s\n' "$status" > /tmp/r5-resources/exit-status
          df -h > /tmp/r5-resources/disk.txt
          exit "$status"
      - name: Preserve resource evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r5-resource-${{ matrix.case }}
          path: /tmp/r5-resources
          retention-days: 1
