name: R5 CI diagnostics
on:
  push:
    branches: [codex/r5-ci-diagnostics]
    paths: [.github/workflows/r5-ci-diagnostics.yml]
permissions:
  contents: read
  actions: write
jobs:
  qualify-exact-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the unchanged Full CI workflow on the isolated candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -u - <<'PY'
          import json, subprocess
          repo = 'mech-lang/mech'
          head = '251be1356f5049ce00ced8de519e4646d3159e24'
          branch = 'codex/r5-validation-251be13'
          def api(path, payload=None):
              command = ['gh', 'api', f'repos/{repo}/{path}']
              if payload is not None:
                  command += ['--method', 'POST', '--input', '-']
              result = subprocess.run(command, input=json.dumps(payload) if payload is not None else None, text=True, capture_output=True, timeout=60)
              if result.returncode:
                  raise RuntimeError(result.stderr)
              return json.loads(result.stdout) if result.stdout.strip() else None
          assert api('git/ref/heads/' + branch)['object']['sha'] == head
          workflow = api('actions/workflows/ci-full.yml')
          assert workflow['path'] == '.github/workflows/ci-full.yml'
          runs = api(f'actions/runs?head_sha={head}&event=workflow_dispatch&per_page=100')['workflow_runs']
          existing = [r for r in runs if r['workflow_id'] == workflow['id']]
          if existing:
              print('Exact candidate full validation already exists:', [(r['id'], r['status'], r['conclusion']) for r in existing])
          else:
              api(f"actions/workflows/{workflow['id']}/dispatches", {'ref': branch, 'inputs': {'validation_ref': head, 'release_channel': 'stable'}})
              print('Dispatched Full CI on exact candidate', head, 'without changing R5.')
          PY
