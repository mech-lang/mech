name: R5 CI diagnostics
on:
  push:
    branches: [codex/r5-ci-diagnostics]
    paths: [.github/workflows/r5-ci-diagnostics.yml]
permissions:
  contents: read
jobs:
  source-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 09ea5f648fe83dbf8f0fab5ed6499dec31052a69
          persist-credentials: false
      - name: Install required qualification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          rustup toolchain install nightly-2026-03-03 --profile minimal
      - name: Run the complete source compatibility slice
        run: |
          set -euo pipefail
          mkdir -p /tmp/r5-source
          git rev-parse HEAD | tee /tmp/r5-source/HEAD
          set +e
          /usr/bin/time -v -o /tmp/r5-source/time.txt bash scripts/check-function-system-contracts.sh source 2>&1 | tee /tmp/r5-source/command.log
          status=${PIPESTATUS[0]}
          set -e
          cat /tmp/r5-source/time.txt
          echo "$status" > /tmp/r5-source/exit-status
          exit "$status"
      - name: Preserve qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r5-repaired-source-contracts
          path: /tmp/r5-source
          retention-days: 1
