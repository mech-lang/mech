name: R5 CI diagnostics
on:
  push:
    branches: [codex/r5-ci-diagnostics]
    paths: [.github/workflows/r5-ci-diagnostics.yml]
permissions:
  contents: read
jobs:
  bounded-math-check:
    name: Bounded math check (${{ matrix.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: r4
            ref: ee578153e6731d6fe549238155244873dc745892
          - version: r5
            ref: e1bdb6363188751565a5c1b4de984e3e49d1a04b
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.ref }}
      - name: Install the pinned compiler
        run: rustup toolchain install nightly-2026-03-03 --profile minimal
      - name: Measure compilation while protecting the runner
        run: |
          python3 -u - <<'PY'
          import json, os, pathlib, signal, subprocess, threading, time
          root = pathlib.Path('/tmp/r5-bounded')
          root.mkdir(exist_ok=True)
          command = ['cargo', '+nightly-2026-03-03', 'check', '--manifest-path', 'machines/math/Cargo.toml', '--no-default-features', '--features', 'full_runtime native-link']
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          print('HEAD', head, flush=True)
          subprocess.run(['free', '-m'], check=True)
          (root/'HEAD').write_text(head + '\n')
          child = subprocess.Popen(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, start_new_session=True)
          def output():
              with (root/'compile.log').open('w') as log:
                  for line in child.stdout:
                      log.write(line)
                      log.flush()
                      print(line, end='', flush=True)
          thread = threading.Thread(target=output, daemon=True)
          thread.start()
          started = time.monotonic()
          peak = 0
          guard = None
          rows = []
          with (root/'memory.jsonl').open('w') as log:
              while child.poll() is None:
                  mem = {line.split(':')[0]: int(line.split()[1]) for line in pathlib.Path('/proc/meminfo').read_text().splitlines()}
                  processes = []
                  for path in pathlib.Path('/proc').glob('[0-9]*/stat'):
                      try:
                          text = path.read_text()
                          fields = text[text.rfind(')') + 2:].split()
                          if int(fields[2]) == child.pid:
                              rss = int(fields[21]) * os.sysconf('SC_PAGE_SIZE') // 1024
                              processes.append({'pid': int(path.parent.name), 'name': text[text.find('(') + 1:text.rfind(')')], 'rss_kib': rss})
                      except (OSError, ValueError, IndexError):
                          continue
                  rss = sum(p['rss_kib'] for p in processes)
                  peak = max(peak, rss)
                  row = {'elapsed_s': round(time.monotonic() - started, 1), 'rss_kib': rss, 'available_kib': mem['MemAvailable'], 'total_kib': mem['MemTotal'], 'processes': processes}
                  rows.append(row)
                  log.write(json.dumps(row) + '\n')
                  log.flush()
                  print('RESOURCE', json.dumps(row), flush=True)
                  if rss > 8 * 1024 * 1024 or mem['MemAvailable'] < 2 * 1024 * 1024:
                      guard = 'resource guard: compiler process group exceeded 8 GiB or host available memory fell below 2 GiB'
                  elif row['elapsed_s'] > 11 * 60:
                      guard = 'diagnostic command exceeded 11 minutes'
                  if guard:
                      print('GUARD', guard, flush=True)
                      os.killpg(child.pid, signal.SIGTERM)
                      try:
                          child.wait(timeout=10)
                      except subprocess.TimeoutExpired:
                          os.killpg(child.pid, signal.SIGKILL)
                      break
                  time.sleep(2)
          status = child.wait()
          thread.join(timeout=10)
          report = {'head': head, 'command': command, 'returncode': status, 'guard': guard, 'peak_process_group_rss_kib': peak, 'elapsed_s': round(time.monotonic() - started, 1)}
          (root/'result.json').write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2), flush=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'w') as summary:
              summary.write('```json\n' + json.dumps(report, indent=2) + '\n```\n')
          raise SystemExit(1 if guard or status else 0)
          PY
      - name: Preserve bounded compiler evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r5-bounded-math-${{ matrix.version }}
          path: /tmp/r5-bounded
          retention-days: 1
