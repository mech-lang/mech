name: R5 CI diagnostics
on:
  push:
    branches: [codex/r5-ci-diagnostics]
    paths: [.github/workflows/r5-ci-diagnostics.yml]
permissions:
  contents: read
jobs:
  nbody-shape-order:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 09ea5f648fe83dbf8f0fab5ed6499dec31052a69
          persist-credentials: false
      - name: Apply and preserve the exact shape-order repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -u - <<'PY'
          import base64, hashlib, json, pathlib, subprocess
          root = pathlib.Path('/tmp/r5-shape-order')
          root.mkdir(exist_ok=True)
          raw = subprocess.check_output(['gh', 'api', 'repos/mech-lang/mech/git/blobs/3723bac2364351bdb7ca69b5b524bf00a6b835ba'])
          patch = base64.b64decode(json.loads(raw)['content'])
          assert hashlib.sha256(patch).hexdigest() == '5e6f7e09e15cafe80be3288b6cbb467844e79c8f029e27e646e055cc8e93e981'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          subprocess.run(['git', 'diff', '--check'], check=True)
          path = pathlib.Path('src/engine/src/resident/general/mod.rs')
          assert hashlib.sha256(path.read_bytes()).hexdigest() == '0e67abd48bc0266d925210845a919bb7edf5f63a7922d0cb7e880b1068eaae0f'
          result = subprocess.run(['gh', 'api', 'repos/mech-lang/mech/git/blobs', '--method', 'POST', '--input', '-'], input=json.dumps({'content': path.read_text(), 'encoding': 'utf-8'}), text=True, capture_output=True)
          if result.returncode:
              print(result.stderr, flush=True)
              raise SystemExit(result.returncode)
          receipt = {'parent': '09ea5f648fe83dbf8f0fab5ed6499dec31052a69', 'tree_elements': [{'path': str(path), 'mode': '100644', 'type': 'blob', 'sha': json.loads(result.stdout)['sha']}]}
          (root/'receipt.json').write_text(json.dumps(receipt, indent=2))
          (root/'candidate.patch').write_bytes(patch)
          print(json.dumps(receipt, indent=2))
          PY
      - name: Install pinned compiler
        run: rustup toolchain install nightly-2026-03-03 --profile minimal
      - name: Execute every D2 assertion without changing the fixture or oracle
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee /tmp/r5-shape-order/HEAD
          set +e
          /usr/bin/time -v -o /tmp/r5-shape-order/time.txt python3 scripts/check-r1-artifact-closure.py nbody 2>&1 | tee /tmp/r5-shape-order/command.log
          status=${PIPESTATUS[0]}
          set -e
          cat /tmp/r5-shape-order/time.txt
          echo "$status" > /tmp/r5-shape-order/exit-status
          exit "$status"
      - name: Preserve shape-order qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r5-shape-order
          path: /tmp/r5-shape-order
          retention-days: 1
