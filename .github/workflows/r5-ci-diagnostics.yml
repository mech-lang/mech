name: R5 CI diagnostics
on:
  push:
    branches: [codex/r5-ci-diagnostics]
    paths: [.github/workflows/r5-ci-diagnostics.yml]
permissions:
  contents: read
  actions: read
jobs:
  collect-exact-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 251be1356f5049ce00ced8de519e4646d3159e24
          persist-credentials: false
      - name: Preserve candidate source and current failed job logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -u - <<'PY'
          import json, pathlib, subprocess
          root = pathlib.Path('/tmp/r5-exact-evidence')
          root.mkdir()
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert head == '251be1356f5049ce00ced8de519e4646d3159e24'
          (root/'HEAD').write_text(head + '\n')
          subprocess.run(['git', 'archive', '--format=tar.gz', '-o', str(root/'source.tar.gz'), 'HEAD'], check=True)
          def api(path):
              return subprocess.check_output(['gh', 'api', 'repos/mech-lang/mech/' + path], timeout=60)
          summary = []
          for run_id in (33992916915, 33997644355):
              directory = root/str(run_id)
              directory.mkdir()
              jobs = []
              page = 1
              while True:
                  result = json.loads(api(f'actions/runs/{run_id}/jobs?filter=latest&per_page=100&page={page}'))
                  jobs.extend(result['jobs'])
                  if len(jobs) >= result['total_count'] or not result['jobs']:
                      break
                  page += 1
              (directory/'jobs.json').write_text(json.dumps(jobs, indent=2))
              run = json.loads(api(f'actions/runs/{run_id}'))
              (directory/'run.json').write_text(json.dumps(run, indent=2))
              summary.append(f"RUN {run_id} {run['head_sha']} {run['status']} {run['conclusion']}")
              for job in jobs:
                  if job['conclusion'] not in ('success', 'skipped'):
                      summary.append(f"{job['id']} {job['name']}: {job['status']} {job['conclusion']}")
                  if job['conclusion'] == 'failure':
                      log = api(f"actions/jobs/{job['id']}/logs")
                      (directory/f"{job['id']}.log").write_bytes(log)
                      lines = log.decode('utf-8-sig', errors='replace').splitlines()
                      errors = [line for line in lines if any(word in line.lower() for word in ('panicked', 'error:', 'failed:', 'unresolvedshape', 'shutdown signal', 'assertion', 'mismatch'))]
                      summary.extend(errors[-12:])
          (root/'summary.txt').write_text('\n'.join(summary) + '\n')
          print('\n'.join(summary), flush=True)
          PY
      - name: Preserve exact validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r5-exact-candidate-evidence
          path: /tmp/r5-exact-evidence
          retention-days: 3
