name: Syntax fuzzing

on:
  workflow_dispatch:

  pull_request:
    branches:
      - feature/syntax
    paths:
      - "src/syntax/**"
      - "fuzz/**"
      - "docs/design/grammar-audit/**"
      - ".github/workflows/syntax-fuzz.yml"

  push:
    branches:
      - feature/syntax
    paths:
      - "src/syntax/**"
      - "fuzz/**"
      - "docs/design/grammar-audit/**"
      - ".github/workflows/syntax-fuzz.yml"

  schedule:
    - cron: "17 5 * * 1"

concurrency:
  group: syntax-fuzz-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - parse_document
          - incremental_equivalence
          - recovery_progress
          - edit_piece_table
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust nightly
        run: |
          rustup toolchain install nightly-2026-03-03 --profile minimal
          rustup default nightly-2026-03-03

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Refresh real target corpora
        run: bash fuzz/scripts/refresh-corpus.sh

      - name: Run bounded target
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET: ${{ matrix.target }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            runs=5000
            seconds=180
          else
            runs=25000
            seconds=900
          fi
          cargo fuzz run "$TARGET" -- -runs="$runs" -max_total_time="$seconds"

      - name: Upload crashes and timeouts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: syntax-fuzz-${{ matrix.target }}
          path: |
            fuzz/artifacts/${{ matrix.target }}
            fuzz/corpus/${{ matrix.target }}
