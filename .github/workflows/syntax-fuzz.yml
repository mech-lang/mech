name: Manual syntax parser-input validation

on:
  workflow_dispatch:

jobs:
  parser-input:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - parse_document
          - incremental_equivalence
          - recovery_progress
          - edit_piece_table
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust nightly
        run: |
          rustup toolchain install nightly-2026-03-03 --profile minimal
          rustup default nightly-2026-03-03

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Refresh real target corpora
        run: bash fuzz/scripts/refresh-corpus.sh

      - name: Run bounded target
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo fuzz run "$TARGET" -- -runs=25000 -max_total_time=900

      - name: Upload crashes and timeouts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: syntax-fuzz-${{ matrix.target }}
          path: |
            fuzz/artifacts/${{ matrix.target }}
            fuzz/corpus/${{ matrix.target }}
