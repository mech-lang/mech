name: R10 stack workbench

on:
  push:
    branches: [codex/r10-stack-workbench-20260918]

permissions:
  contents: read

jobs:
  tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Prepare pinned compiler and locked dependency cache
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install nightly-2026-03-03 --profile minimal --component rustfmt
          cargo +nightly-2026-03-03 fetch --locked
          mkdir -p workbench-export/toolchain workbench-export/cargo
          cp -a "$HOME/.rustup/toolchains/nightly-2026-03-03-x86_64-unknown-linux-gnu/." workbench-export/toolchain/
          cp -a "$HOME/.cargo/registry" workbench-export/cargo/
          if test -d "$HOME/.cargo/git"; then cp -a "$HOME/.cargo/git" workbench-export/cargo/; fi
          tar --zstd -cf r10-offline-tools.tar.zst -C workbench-export toolchain cargo
      - uses: actions/upload-artifact@v4
        with:
          name: r10-offline-tools
          path: r10-offline-tools.tar.zst
          retention-days: 1
          compression-level: 0
