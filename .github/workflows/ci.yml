name: CI

on:
  pull_request:

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  impact:
    name: Impact
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      owner_shards: ${{ steps.classify.outputs.owner_shards }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      static_contracts_required: ${{ steps.classify.outputs.static_contracts_required }}
      standard_canaries_required: ${{ steps.classify.outputs.standard_canaries_required }}
      windows_canary_required: ${{ steps.classify.outputs.windows_canary_required }}
      browser_canary_required: ${{ steps.classify.outputs.browser_canary_required }}
      cross_cutting_standard_suite_required: ${{ steps.classify.outputs.cross_cutting_standard_suite_required }}
      full_validation_required: ${{ steps.classify.outputs.full_validation_required }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Select the smallest safe validation set
        id: classify
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels) }}
        run: >-
          python3 scripts/ci-impact.py
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
          --labels "$PR_LABELS"

  static-contracts:
    name: Static contracts
    needs: impact
    if: needs.impact.outputs.static_contracts_required == 'true'
    runs-on: ubuntu-latest
    # Temporary headroom while the resident-architecture projection suite is stabilized.
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Static architecture contracts validate the exact PR head.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Install formatting and contract tools
        run: |
          rustup toolchain install nightly-2026-03-03 --profile minimal --component rustfmt
          if ! command -v rg >/dev/null 2>&1
          then
            sudo apt-get update
            sudo apt-get install --yes ripgrep
          fi
      - name: Check formatting and cheap global contracts
        run: |
          cargo +nightly-2026-03-03 fmt --all -- --check
          python3 -B -m unittest \
            tests.ci.test_ci_impact \
            tests.ci.test_ci_full_contract
          python3 scripts/check-production-resident-routing.py
          python3 scripts/check-compiler-planning-quarantine.py
          scripts/check-unsafe-boundaries.sh
          python3 scripts/check-runtime-factory-safety.py
          python3 scripts/check-value-execution-boundary.py
          python3 -B -m unittest \
            scripts/tests/test_check_obsolete_program_reachability.py \
            scripts/tests/test_check_compiler_planning_quarantine.py \
            scripts/tests/test_check_value_execution_boundary.py
          python3 scripts/check-bytecode-v1-format.py
          cargo +nightly-2026-03-03 fetch --locked
          python3 -B scripts/check-distribution-contracts.py --profile standard
          python3 -B scripts/check-distribution-packaging.py
          python3 scripts/check-native-host-catalog.py
          bash scripts/check-static-distribution-profiles.sh static

  standard-linux:
    name: Standard Linux
    needs: impact
    if: needs.impact.outputs.standard_canaries_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Rust nightly-2026-03-03
        run: rustup toolchain install nightly-2026-03-03 --profile minimal
      - name: Build and exercise the lean standard distribution
        run: |
          cargo +nightly-2026-03-03 fetch --locked
          cargo +nightly-2026-03-03 build --locked --bin mech
          target/debug/mech --version | grep '(standard)'
          target/debug/mech run tests/fixtures/standard-resident-scalar.mec
      - name: Exercise source to bytecode to generated native executable
        run: >-
          cargo +nightly-2026-03-03 test
          --locked
          -p mech
          --test mech_build
          distribution_source_bytecode_native_canary
          --
          --exact
          --nocapture
      - name: Exercise resident timer observation and console effect delivery
        run: |
          target/debug/mech run tests/fixtures/standard-live-timer \
            --max-live-turns 2 \
            --runtime-info \
            > /tmp/mech-standard-live-timer.out 2>&1
          grep -E '^[0-9]+$' /tmp/mech-standard-live-timer.out > /tmp/mech-standard-live-values.out
          test "$(wc -l < /tmp/mech-standard-live-values.out)" -ge 2
          test "$(sort -u /tmp/mech-standard-live-values.out | wc -l)" -ge 2
          grep -F '"route":"resident-external"' /tmp/mech-standard-live-timer.out
          grep -F '"resident_accepted_turns":2' /tmp/mech-standard-live-timer.out
          grep -F '"resident_rejected_turns":0' /tmp/mech-standard-live-timer.out

  changed-owner-tests:
    name: Owner ${{ matrix.id }} (${{ matrix.owners }})
    needs: impact
    if: needs.impact.outputs.owner_shards != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.impact.outputs.owner_shards) }}
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Rust nightly-2026-03-03
        run: rustup toolchain install nightly-2026-03-03 --profile minimal
      - name: Fetch the locked dependency graph
        run: cargo +nightly-2026-03-03 fetch --locked
      - name: Run only the selected owners
        run: python3 -B scripts/run-owner-tests.py --owners "${{ matrix.owners }}"

  standard-windows:
    name: Standard Windows
    needs: impact
    if: needs.impact.outputs.windows_canary_required == 'true'
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Rust nightly-2026-03-03
        run: rustup toolchain install nightly-2026-03-03 --profile minimal
      - name: Build the standard Windows command and exercise a source path
        shell: pwsh
        run: |
          cargo +nightly-2026-03-03 build --locked --bin mech
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          target/debug/mech.exe --version | Select-String -SimpleMatch '(standard)'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          target/debug/mech.exe run tests/fixtures/standard-resident-scalar.mec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  browser-canary:
    name: Browser canary
    needs: impact
    if: needs.impact.outputs.browser_canary_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Rust, WASM, and wasm-pack
        env:
          WASM_PACK_VERSION: v0.15.0
        run: |
          rustup toolchain install nightly-2026-03-03 --profile minimal
          rustup default nightly-2026-03-03
          rustup target add wasm32-unknown-unknown
          curl -fsSL \
            "https://github.com/wasm-bindgen/wasm-pack/releases/download/$WASM_PACK_VERSION/wasm-pack-$WASM_PACK_VERSION-x86_64-unknown-linux-musl.tar.gz" \
            -o /tmp/wasm-pack.tar.gz
          tar -xzf /tmp/wasm-pack.tar.gz -C /tmp
          sudo install "/tmp/wasm-pack-$WASM_PACK_VERSION-x86_64-unknown-linux-musl/wasm-pack" /usr/local/bin/wasm-pack
      - name: Build standard WASM and the standard server
        run: |
          bash scripts/build-mech-browser.sh
          grep -q '^export class WasmDocument' src/wasm/pkg/mech_wasm.js
          ! grep -q '^[[:space:]]*evaluate(source)' src/wasm/pkg/mech_wasm.js
          cargo build --locked --bin mech
      - name: Verify N-body physics against independent references
        run: |
          python3 scripts/check-nbody-physics-reference.py
          cargo test --locked -p mech-runtime \
            --features full_compiler,resident-routing-source \
            public_nbody_viewer_integrates_mutual_gravity_residently \
            --lib
      - name: Verify resident rendering without browser errors
        run: MECH_BIN=target/debug/mech bash scripts/smoke-served-resident-nbody-browser.sh
      - name: Remove generated browser package
        if: always()
        run: rm -rf src/wasm/pkg

  full-validation:
    name: Requested full validation
    needs:
      - impact
      - static-contracts
      - standard-linux
      - changed-owner-tests
      - standard-windows
      - browser-canary
    if: >-
      ${{
        always() &&
        needs.impact.outputs.full_validation_required == 'true' &&
        (needs.static-contracts.result == 'success' ||
          (needs.impact.outputs.docs_only == 'true' && needs.static-contracts.result == 'skipped')) &&
        (needs.standard-linux.result == 'success' ||
          (needs.impact.outputs.docs_only == 'true' && needs.standard-linux.result == 'skipped')) &&
        (needs.standard-windows.result == 'success' ||
          (needs.impact.outputs.docs_only == 'true' && needs.standard-windows.result == 'skipped')) &&
        (needs.changed-owner-tests.result == 'success' || needs.changed-owner-tests.result == 'skipped') &&
        (needs.browser-canary.result == 'success' || needs.browser-canary.result == 'skipped')
      }}
    uses: ./.github/workflows/ci-full.yml
    with:
      release_channel: stable
      validation_ref: ${{ github.event.pull_request.head.sha }}

  pr-gate:
    name: PR gate
    if: always()
    needs:
      - impact
      - static-contracts
      - standard-linux
      - changed-owner-tests
      - standard-windows
      - browser-canary
      - full-validation
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Require exactly the selected validation set
        env:
          DOCS_ONLY: ${{ needs.impact.outputs.docs_only }}
          FULL_REQUIRED: ${{ needs.impact.outputs.full_validation_required }}
          IMPACT_RESULT: ${{ needs.impact.result }}
          STATIC_RESULT: ${{ needs.static-contracts.result }}
          LINUX_RESULT: ${{ needs.standard-linux.result }}
          OWNER_RESULT: ${{ needs.changed-owner-tests.result }}
          WINDOWS_RESULT: ${{ needs.standard-windows.result }}
          BROWSER_RESULT: ${{ needs.browser-canary.result }}
          FULL_RESULT: ${{ needs.full-validation.result }}
        run: |
          test "$IMPACT_RESULT" = success
          if test "$DOCS_ONLY" = true
          then
            test "$STATIC_RESULT" = skipped
            test "$LINUX_RESULT" = skipped
            test "$OWNER_RESULT" = skipped
            test "$WINDOWS_RESULT" = skipped
            test "$BROWSER_RESULT" = skipped
          else
            test "$STATIC_RESULT" = success
            test "$LINUX_RESULT" = success
            test "$WINDOWS_RESULT" = success
            test "$OWNER_RESULT" = success -o "$OWNER_RESULT" = skipped
            test "$BROWSER_RESULT" = success -o "$BROWSER_RESULT" = skipped
          fi
          if test "$FULL_REQUIRED" = true
          then
            test "$FULL_RESULT" = success
          else
            test "$FULL_RESULT" = skipped
          fi
