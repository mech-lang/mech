name: CI

on:
  pull_request:

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# This verifier belongs to the workflow revision, not the repository revision
# selected below. Historical validation refs therefore remain auditable even
# when their checked-out tree predates the checkout-identity contract.
env:
  RECORD_CHECKOUT_IDENTITY: |
    case "$VALIDATION_KIND" in
      integration-merge|exact-head|exact-ref) ;;
      *) echo "unsupported validation kind: $VALIDATION_KIND" >&2; exit 64 ;;
    esac
    test -n "$REQUESTED_REF"

    actual_sha=$(git rev-parse HEAD)
    test -n "$CHECKOUT_SHA"
    test "$actual_sha" = "$CHECKOUT_SHA"

    if [[ "$REQUESTED_REF" =~ ^[0-9a-fA-F]{40}$ || "$REQUESTED_REF" =~ ^[0-9a-fA-F]{64}$ ]]
    then
      requested_sha=$(printf '%s' "$REQUESTED_REF" | tr '[:upper:]' '[:lower:]')
      test "$actual_sha" = "$requested_sha"
    fi

    {
      echo "validation_kind=$VALIDATION_KIND"
      echo "requested_ref=$REQUESTED_REF"
      echo "checkout_ref=$CHECKOUT_REF"
      echo "checkout_sha=$CHECKOUT_SHA"
      echo "actual_sha=$actual_sha"
    } | tee -a "$GITHUB_STEP_SUMMARY"

jobs:
  impact:
    name: Impact
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      owner_shards: ${{ steps.classify.outputs.owner_shards }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      review_only: ${{ steps.classify.outputs.review_only }}
      landing_candidate: ${{ steps.classify.outputs.landing_candidate }}
      static_contracts_required: ${{ steps.classify.outputs.static_contracts_required }}
      standard_canaries_required: ${{ steps.classify.outputs.standard_canaries_required }}
      windows_canary_required: ${{ steps.classify.outputs.windows_canary_required }}
      browser_canary_required: ${{ steps.classify.outputs.browser_canary_required }}
      cross_cutting_standard_suite_required: ${{ steps.classify.outputs.cross_cutting_standard_suite_required }}
      full_validation_required: ${{ steps.classify.outputs.full_validation_required }}
    steps:
      - uses: actions/checkout@v7.0.1
        id: checkout
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Record integration checkout identity
        env:
          VALIDATION_KIND: integration-merge
          REQUESTED_REF: ${{ github.sha }}
          CHECKOUT_REF: ${{ steps.checkout.outputs.ref }}
          CHECKOUT_SHA: ${{ steps.checkout.outputs.commit }}
        shell: bash
        run: bash --noprofile --norc -euo pipefail -c "$RECORD_CHECKOUT_IDENTITY"
      - name: Select the smallest safe validation set
        id: classify
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels) }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: >-
          python3 scripts/ci-impact.py
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
          --labels "$PR_LABELS"

  early-native-plan:
    name: Early native plan
    needs: impact
    if: needs.impact.outputs.full_validation_required == 'true'
    uses: ./.github/workflows/ci-native-plan.yml
    with:
      validation_ref: ${{ github.event.pull_request.head.sha }}

  static-architecture:
    name: Static architecture contracts
    needs: impact
    if: needs.impact.outputs.static_contracts_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7.0.1
        id: checkout
        with:
          # Static architecture contracts validate the exact PR head.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Record exact-head checkout identity
        env:
          VALIDATION_KIND: exact-head
          REQUESTED_REF: ${{ github.event.pull_request.head.sha }}
          CHECKOUT_REF: ${{ steps.checkout.outputs.ref }}
          CHECKOUT_SHA: ${{ steps.checkout.outputs.commit }}
        shell: bash
        run: bash --noprofile --norc -euo pipefail -c "$RECORD_CHECKOUT_IDENTITY"
      - name: Install formatting and contract tools
        run: |
          rustup toolchain install nightly-2026-03-03 --profile minimal --component rustfmt
          if ! command -v rg >/dev/null 2>&1
          then
            # Only Ubuntu provides ripgrep. Do not let an unrelated preinstalled
            # third-party repository make the architecture gate unavailable.
            sudo apt-get update \
              -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources \
              -o Dir::Etc::sourceparts=-
            sudo apt-get install --yes ripgrep
          fi
      - name: Check formatting and global contracts
        run: |
          python3 scripts/check-canonical-evidence-imports.py
          cargo +nightly-2026-03-03 fmt --all -- --check
          python3 -B -m unittest \
            tests.ci.test_ci_impact \
            tests.ci.test_ci_full_contract \
            tests.browser.harness.test_completion_server
          python3 scripts/check-production-resident-routing.py
          python3 scripts/check-warning-policy.py
          python3 scripts/check-interactive-architecture.py
          python3 scripts/check-compiler-planning-quarantine.py
          scripts/check-unsafe-boundaries.sh
          python3 scripts/check-runtime-factory-safety.py
          python3 scripts/check-value-execution-boundary.py
          python3 scripts/check-value-system-contract.py
          python3 scripts/check-no-retired-value-system.py
          python3 scripts/check-r1-compatibility-closure.py
          python3 scripts/check-r2-type-memory-boundary.py
          python3 scripts/check-r3-type-system.py
          python3 scripts/check-r4-type-cutover.py
          python3 scripts/check-r5-memory-planner.py
          python3 scripts/check-r6-memory-runtime.py
          python3 scripts/check-bytecode-v1-format.py

  static-mutations:
    name: Static mutation contracts (${{ matrix.shard }})
    needs: impact
    if: needs.impact.outputs.static_contracts_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7.0.1
        id: checkout
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Record exact-head checkout identity
        env:
          VALIDATION_KIND: exact-head
          REQUESTED_REF: ${{ github.event.pull_request.head.sha }}
          CHECKOUT_REF: ${{ steps.checkout.outputs.ref }}
          CHECKOUT_SHA: ${{ steps.checkout.outputs.commit }}
        shell: bash
        run: bash --noprofile --norc -euo pipefail -c "$RECORD_CHECKOUT_IDENTITY"
      - name: Install mutation contract tools
        run: |
          if ! command -v rg >/dev/null 2>&1
          then
            sudo apt-get update \
              -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources \
              -o Dir::Etc::sourceparts=-
            sudo apt-get install --yes ripgrep
          fi
      - name: Execute one balanced mutation shard
        run: |
          python3 -B scripts/run-python-unittest-shards.py \
            --jobs 2 \
            --shard-count 4 \
            --shard-index ${{ matrix.shard }} \
            scripts/tests/test_check_obsolete_program_reachability.py \
            scripts/tests/test_check_compiler_planning_quarantine.py \
            scripts/tests/test_check_no_retired_value_system.py \
            scripts/tests/test_check_r1_compatibility_closure.py \
            scripts/tests/test_check_r2_type_memory_boundary.py \
            scripts/tests/test_check_r3_type_system.py \
            scripts/tests/test_check_r4_type_cutover.py \
            scripts/tests/test_check_r5_memory_planner.py \
            scripts/tests/test_check_r6_memory_runtime.py \
            scripts/tests/test_run_python_unittest_shards.py \
            scripts/tests/test_check_value_execution_boundary.py \
            scripts/tests/test_warning_policy.py

  static-distribution:
    name: Static distribution contracts
    needs: impact
    if: needs.impact.outputs.static_contracts_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7.0.1
        id: checkout
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Record exact-head checkout identity
        env:
          VALIDATION_KIND: exact-head
          REQUESTED_REF: ${{ github.event.pull_request.head.sha }}
          CHECKOUT_REF: ${{ steps.checkout.outputs.ref }}
          CHECKOUT_SHA: ${{ steps.checkout.outputs.commit }}
        shell: bash
        run: bash --noprofile --norc -euo pipefail -c "$RECORD_CHECKOUT_IDENTITY"
      - name: Install distribution contract tools
        run: |
          rustup toolchain install nightly-2026-03-03 --profile minimal
          if ! command -v rg >/dev/null 2>&1
          then
            sudo apt-get update \
              -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources \
              -o Dir::Etc::sourceparts=-
            sudo apt-get install --yes ripgrep
          fi
      - name: Check static distribution contracts
        run: |
          cargo +nightly-2026-03-03 fetch --locked
          python3 -B scripts/check-distribution-contracts.py --profile standard
          python3 -B scripts/check-distribution-packaging.py
          python3 scripts/check-native-host-catalog.py
          bash scripts/check-static-distribution-profiles.sh static

  static-contracts:
    name: Static contracts
    needs:
      - impact
      - static-architecture
      - static-mutations
      - static-distribution
    if: always() && needs.impact.outputs.static_contracts_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every static contract family
        env:
          ARCHITECTURE_RESULT: ${{ needs.static-architecture.result }}
          MUTATIONS_RESULT: ${{ needs.static-mutations.result }}
          DISTRIBUTION_RESULT: ${{ needs.static-distribution.result }}
        run: |
          test "$ARCHITECTURE_RESULT" = success
          test "$MUTATIONS_RESULT" = success
          test "$DISTRIBUTION_RESULT" = success

  standard-linux:
    name: Standard Linux
    needs: impact
    if: needs.impact.outputs.standard_canaries_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7.0.1
        id: checkout
        with:
          ref: ${{ github.sha }}
      - name: Record integration checkout identity
        env:
          VALIDATION_KIND: integration-merge
          REQUESTED_REF: ${{ github.sha }}
          CHECKOUT_REF: ${{ steps.checkout.outputs.ref }}
          CHECKOUT_SHA: ${{ steps.checkout.outputs.commit }}
        shell: bash
        run: bash --noprofile --norc -euo pipefail -c "$RECORD_CHECKOUT_IDENTITY"
      - name: Install Rust nightly-2026-03-03
        run: rustup toolchain install nightly-2026-03-03 --profile minimal
      - name: Fetch the accumulated C source fixture dependencies
        if: needs.impact.outputs.landing_candidate == 'true'
        run: cargo +nightly-2026-03-03 fetch --locked --manifest-path tests/fixtures/full-source-runtime/Cargo.toml
      - name: Build and exercise the lean standard distribution
        run: |
          cargo +nightly-2026-03-03 fetch --locked
          cargo +nightly-2026-03-03 build --locked --bin mech
          target/debug/mech --version | grep '(standard)'
          target/debug/mech run tests/fixtures/standard-resident-scalar.mec
      - name: Exercise source to bytecode to generated native executable
        run: >-
          cargo +nightly-2026-03-03 test
          --locked
          -p mech
          --test mech_build
          distribution_source_bytecode_native_canary
          --
          --exact
          --nocapture
      - name: Exercise resident timer observation and console effect delivery
        run: |
          target/debug/mech run tests/fixtures/standard-live-timer \
            --max-live-turns 2 \
            --runtime-info \
            > /tmp/mech-standard-live-timer.out 2>&1
          grep -E '^[0-9]+$' /tmp/mech-standard-live-timer.out > /tmp/mech-standard-live-values.out
          test "$(wc -l < /tmp/mech-standard-live-values.out)" -ge 2
          test "$(sort -u /tmp/mech-standard-live-values.out | wc -l)" -ge 2
          grep -F '"route":"resident-external"' /tmp/mech-standard-live-timer.out
          grep -F '"resident_accepted_turns":2' /tmp/mech-standard-live-timer.out
          grep -F '"resident_rejected_turns":0' /tmp/mech-standard-live-timer.out

      - name: Probe accumulated C with the parser physically deleted
        if: ${{ !cancelled() && needs.impact.outputs.landing_candidate == 'true' }}
        run: |
          test ! -e src/syntax/src/parser.rs
          test ! -e src/syntax/src/document/lower/legacy
          cargo +nightly-2026-03-03 run --locked --offline --manifest-path tests/fixtures/full-source-runtime/Cargo.toml

  changed-owner-tests:
    name: Owner ${{ matrix.id }} (${{ matrix.owners }})
    needs: impact
    if: needs.impact.outputs.owner_shards != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.impact.outputs.owner_shards) }}
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7.0.1
        id: checkout
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Record integration checkout identity
        env:
          VALIDATION_KIND: integration-merge
          REQUESTED_REF: ${{ github.sha }}
          CHECKOUT_REF: ${{ steps.checkout.outputs.ref }}
          CHECKOUT_SHA: ${{ steps.checkout.outputs.commit }}
        shell: bash
        run: bash --noprofile --norc -euo pipefail -c "$RECORD_CHECKOUT_IDENTITY"
      - name: Install Rust nightly-2026-03-03
        run: rustup toolchain install nightly-2026-03-03 --profile minimal
      - name: Fetch the locked dependency graph
        run: cargo +nightly-2026-03-03 fetch --locked
      - name: Run only the selected owners
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: python3 -B scripts/run-owner-tests.py --owners "${{ matrix.owners }}"

  standard-windows:
    name: Standard Windows
    needs: impact
    if: needs.impact.outputs.windows_canary_required == 'true'
    runs-on: windows-latest
    # A cold optimized WASM + native product build already took 44m13s.
    # Leave cold-build headroom; unchanged Rust compilations are reused below.
    timeout-minutes: 75
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: mech-standard-windows-v1
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
    steps:
      - uses: actions/checkout@v7.0.1
        id: checkout
        with:
          ref: ${{ github.sha }}
      - name: Record integration checkout identity
        env:
          VALIDATION_KIND: integration-merge
          REQUESTED_REF: ${{ github.sha }}
          CHECKOUT_REF: ${{ steps.checkout.outputs.ref }}
          CHECKOUT_SHA: ${{ steps.checkout.outputs.commit }}
        shell: bash
        run: bash --noprofile --norc -euo pipefail -c "$RECORD_CHECKOUT_IDENTITY"
      - name: Install Rust nightly-2026-03-03
        run: |
          rustup toolchain install nightly-2026-03-03 --profile minimal
          rustup default nightly-2026-03-03
          rustup target add wasm32-unknown-unknown
      - name: Install compiler cache
        uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - name: Restore Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: standard-windows-product-v1
          cache-on-failure: "true"
          cache-workspace-crates: "false"
        # Dependency artifacts avoid repeated downloads/builds. sccache also
        # reuses unchanged workspace compilations by their compiler inputs,
        # even when a fresh checkout gives the source files new timestamps.
        # The product build below always regenerates and embeds this head's WASM.
      - name: Install wasm-pack v0.15.0
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "wasm-pack.tar.gz"
          $install = Join-Path $env:RUNNER_TEMP "wasm-pack"
          Invoke-WebRequest `
            -Uri "https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-pc-windows-msvc.tar.gz" `
            -OutFile $archive
          New-Item -ItemType Directory -Force $install | Out-Null
          tar.exe -xzf $archive -C $install --strip-components=1
          Add-Content $env:GITHUB_PATH $install
      - name: Build the complete Windows product and exercise a source path
        shell: pwsh
        run: |
          ./scripts/build-mech.ps1
          target/release/mech.exe --version | Select-String -SimpleMatch '(standard)'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          target/release/mech.exe run tests/fixtures/standard-resident-scalar.mec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  browser-standard-canary:
    name: Browser standard canary
    needs: impact
    if: needs.impact.outputs.browser_canary_required == 'true'
    runs-on: ubuntu-latest
    # The last green cold run took 28m02s before R22's lifecycle checks.
    # Cache compilation separately and leave room for all browser suites.
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: mech-browser-standard-v1
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
    steps:
      - uses: actions/checkout@v7.0.1
        id: checkout
        with:
          ref: ${{ github.sha }}
      - name: Record integration checkout identity
        env:
          VALIDATION_KIND: integration-merge
          REQUESTED_REF: ${{ github.sha }}
          CHECKOUT_REF: ${{ steps.checkout.outputs.ref }}
          CHECKOUT_SHA: ${{ steps.checkout.outputs.commit }}
        shell: bash
        run: bash --noprofile --norc -euo pipefail -c "$RECORD_CHECKOUT_IDENTITY"
      - name: Install Rust, WASM, and wasm-pack
        env:
          WASM_PACK_VERSION: v0.15.0
        run: |
          rustup toolchain install nightly-2026-03-03 --profile minimal
          rustup default nightly-2026-03-03
          rustup target add wasm32-unknown-unknown
          curl -fsSL \
            "https://github.com/wasm-bindgen/wasm-pack/releases/download/$WASM_PACK_VERSION/wasm-pack-$WASM_PACK_VERSION-x86_64-unknown-linux-musl.tar.gz" \
            -o /tmp/wasm-pack.tar.gz
          tar -xzf /tmp/wasm-pack.tar.gz -C /tmp
          sudo install "/tmp/wasm-pack-$WASM_PACK_VERSION-x86_64-unknown-linux-musl/wasm-pack" /usr/local/bin/wasm-pack
      - name: Install compiler cache
        uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - name: Restore Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: browser-standard-product-v1
          cache-on-failure: "true"
          cache-workspace-crates: "false"
        # Reuse compiler inputs, not a previously embedded server or WASM package.
        # The build and every browser assertion still run on the current checkout.
      - name: Build standard WASM and the standard server
        run: |
          python3 scripts/build-wasm.py --profile browser
          grep -q '^export class WasmDocument' src/wasm/pkg/mech_wasm.js
          ! grep -q '^[[:space:]]*evaluate(source)' src/wasm/pkg/mech_wasm.js
          cargo build --locked --bin mech
      - name: Verify resident rendering without browser errors
        run: MECH_BIN=target/debug/mech bash scripts/smoke-served-resident-nbody-browser.sh
      - name: Smoke test rich served documents before full validation
        run: MECH_BIN=target/debug/mech bash scripts/smoke-served-rich-document-browser.sh

      - name: Check browser document lifecycle sequences
        run: python3 -B scripts/smoke-browser-document-lifecycle.py --mech-bin target/debug/mech

      - name: Upload standard browser failure diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-standard-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/served-rich-document.*/progress.log
            target/served-rich-document.*/**/server.log
            target/served-rich-document.*/**/format.log
            target/served-rich-document.*/**/chrome.dom
            target/served-rich-document.*/**/chrome.stderr
            target/served-rich-document.*/**/chrome.png
            target/browser-document-lifecycle/*.log
            target/browser-document-lifecycle/*.json
            target/browser-document-lifecycle/*.html
          if-no-files-found: warn
          retention-days: 7

      - name: Remove generated browser package
        if: always()
        run: rm -rf src/wasm/pkg

  browser-nbody-reference:
    name: Browser N-body reference
    needs: impact
    if: needs.impact.outputs.browser_canary_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7.0.1
        id: checkout
        with:
          ref: ${{ github.sha }}
      - name: Record integration checkout identity
        env:
          VALIDATION_KIND: integration-merge
          REQUESTED_REF: ${{ github.sha }}
          CHECKOUT_REF: ${{ steps.checkout.outputs.ref }}
          CHECKOUT_SHA: ${{ steps.checkout.outputs.commit }}
        shell: bash
        run: bash --noprofile --norc -euo pipefail -c "$RECORD_CHECKOUT_IDENTITY"
      - name: Install Rust nightly-2026-03-03
        run: rustup toolchain install nightly-2026-03-03 --profile minimal
      - name: Verify N-body physics against independent references
        run: |
          python3 scripts/check-nbody-physics-reference.py
          cargo +nightly-2026-03-03 test --locked -p mech-runtime \
            --features full_compiler,resident-routing-source \
            public_nbody_viewer_integrates_mutual_gravity_residently \
            --lib

  browser-compute-build:
    name: Browser compute build
    needs: impact
    if: needs.impact.outputs.browser_canary_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7.0.1
        id: checkout
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Record exact-head checkout identity
        env:
          VALIDATION_KIND: exact-head
          REQUESTED_REF: ${{ github.event.pull_request.head.sha }}
          CHECKOUT_REF: ${{ steps.checkout.outputs.ref }}
          CHECKOUT_SHA: ${{ steps.checkout.outputs.commit }}
        shell: bash
        run: bash --noprofile --norc -euo pipefail -c "$RECORD_CHECKOUT_IDENTITY"
      - name: Install Rust, WASM, and wasm-pack
        env:
          WASM_PACK_VERSION: v0.15.0
        run: |
          rustup toolchain install nightly-2026-03-03 --profile minimal
          rustup default nightly-2026-03-03
          rustup target add wasm32-unknown-unknown
          curl -fsSL \
            "https://github.com/wasm-bindgen/wasm-pack/releases/download/$WASM_PACK_VERSION/wasm-pack-$WASM_PACK_VERSION-x86_64-unknown-linux-musl.tar.gz" \
            -o /tmp/wasm-pack.tar.gz
          tar -xzf /tmp/wasm-pack.tar.gz -C /tmp
          sudo install "/tmp/wasm-pack-$WASM_PACK_VERSION-x86_64-unknown-linux-musl/wasm-pack" /usr/local/bin/wasm-pack
      - name: Install Node for browser-package source admission
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - name: Build mixed compute WASM and refresh the server
        run: |
          node --test scripts/tests/static-project.test.mjs
          node scripts/test-browser-compute-lifecycle.mjs
          python3 scripts/build-wasm.py --profile browser-compute-canary
          grep -q '^export class WasmDocument' src/wasm/pkg/mech_wasm.js
          grep -q '^export class WasmMixedComputeProject' src/wasm/pkg/mech_wasm.js
          python3 scripts/smoke-canonical-compute-browser.py --software-adapter
          cargo build --locked --bin mech --features compute_backends_native
          tar -czf /tmp/browser-compute-canary.tar.gz target/debug/mech src/wasm/pkg
      - name: Upload the shared compute browser build
        uses: actions/upload-artifact@v4
        with:
          name: browser-compute-canary-build
          path: /tmp/browser-compute-canary.tar.gz
          if-no-files-found: error
          retention-days: 1

  browser-compute-smoke:
    name: Browser compute smoke
    needs:
      - impact
      - browser-compute-build
    if: needs.impact.outputs.browser_canary_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        id: checkout
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Record exact-head checkout identity
        env:
          VALIDATION_KIND: exact-head
          REQUESTED_REF: ${{ github.event.pull_request.head.sha }}
          CHECKOUT_REF: ${{ steps.checkout.outputs.ref }}
          CHECKOUT_SHA: ${{ steps.checkout.outputs.commit }}
        shell: bash
        run: bash --noprofile --norc -euo pipefail -c "$RECORD_CHECKOUT_IDENTITY"
      - name: Download the shared compute browser build
        uses: actions/download-artifact@v4
        with:
          name: browser-compute-canary-build
          path: /tmp/browser-compute-canary
      - name: Restore the shared compute browser build
        run: tar -xzf /tmp/browser-compute-canary/browser-compute-canary.tar.gz
      - name: Install Node for static compute package admission
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - name: Verify emitted static CPU and WebGPU bundles under a non-root prefix
        run: >-
          python3 scripts/smoke-canonical-compute-browser.py
          --static-bundle --mech-bin target/debug/mech
          --wasm-pkg src/wasm/pkg --software-adapter
      - name: Verify canonical document bundle activation and replacement
        env:
          MECH_BROWSER_BUNDLE_FIXTURES: ${{ runner.temp }}/canonical-document-bundles
        run: |
          cargo fetch --locked --manifest-path tests/fixtures/full-source-runtime/Cargo.toml
          cargo run --locked --offline --manifest-path tests/fixtures/full-source-runtime/Cargo.toml
          python3 scripts/smoke-canonical-document-bundle-browser.py --fixtures "$MECH_BROWSER_BUNDLE_FIXTURES" --served-compute
      - name: Verify report-only particle WebGPU execution
        run: >-
          MECH_BIN=target/debug/mech
          python3 scripts/smoke-gpu-particles-browser.py
          --backend gpu --particle-count 16384 --software-adapter

  browser-ekf-cpu:
    name: Browser EKF scalar
    needs:
      - impact
      - browser-compute-build
    if: needs.impact.outputs.browser_canary_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        id: checkout
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Record exact-head checkout identity
        env:
          VALIDATION_KIND: exact-head
          REQUESTED_REF: ${{ github.event.pull_request.head.sha }}
          CHECKOUT_REF: ${{ steps.checkout.outputs.ref }}
          CHECKOUT_SHA: ${{ steps.checkout.outputs.commit }}
        shell: bash
        run: bash --noprofile --norc -euo pipefail -c "$RECORD_CHECKOUT_IDENTITY"
      - name: Download the shared compute browser build
        uses: actions/download-artifact@v4
        with:
          name: browser-compute-canary-build
          path: /tmp/browser-compute-canary
      - name: Restore the shared compute browser build
        run: tar -xzf /tmp/browser-compute-canary/browser-compute-canary.tar.gz
      - name: Verify scalar EKF rendering
        run: |
          MECH_BIN=target/debug/mech \
            MECH_EKF_COMPUTE_BACKEND=cpu-scalar \
            MECH_EKF_FILTER_COUNT=1 \
            MECH_EKF_RESULT_FILE=/tmp/ekf-cpu-single.json \
            bash scripts/smoke-served-resident-ekf-browser.sh
          MECH_BIN=target/debug/mech \
            MECH_EKF_COMPUTE_BACKEND=cpu-scalar \
            MECH_EKF_FILTER_COUNT=1 \
            MECH_EKF_CONTINUITY_EDIT=false \
            MECH_EKF_RESULT_FILE=/tmp/ekf-cpu-single-no-edit.json \
            bash scripts/smoke-served-resident-ekf-browser.sh
          MECH_BIN=target/debug/mech \
            MECH_EKF_COMPUTE_BACKEND=cpu-scalar \
            MECH_EKF_CONTINUITY_EDIT=false \
            MECH_EKF_RESULT_FILE=/tmp/ekf-cpu-no-edit.json \
            bash scripts/smoke-served-resident-ekf-browser.sh
          MECH_BIN=target/debug/mech \
            MECH_EKF_COMPUTE_BACKEND=cpu-scalar \
            MECH_EKF_RESULT_FILE=/tmp/ekf-cpu.json \
            bash scripts/smoke-served-resident-ekf-browser.sh
      - name: Upload scalar EKF evidence
        uses: actions/upload-artifact@v4
        with:
          name: browser-ekf-cpu-results
          path: /tmp/ekf-cpu*.json
          if-no-files-found: error
          retention-days: 1
      - name: Retain scalar EKF failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-ekf-cpu-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/served-resident-ekf-browser.*
          if-no-files-found: ignore
          retention-days: 7

  browser-ekf-wgpu:
    name: Browser EKF WebGPU
    needs:
      - impact
      - browser-compute-build
    if: needs.impact.outputs.browser_canary_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
        id: checkout
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Record exact-head checkout identity
        env:
          VALIDATION_KIND: exact-head
          REQUESTED_REF: ${{ github.event.pull_request.head.sha }}
          CHECKOUT_REF: ${{ steps.checkout.outputs.ref }}
          CHECKOUT_SHA: ${{ steps.checkout.outputs.commit }}
        shell: bash
        run: bash --noprofile --norc -euo pipefail -c "$RECORD_CHECKOUT_IDENTITY"
      - name: Download the shared compute browser build
        uses: actions/download-artifact@v4
        with:
          name: browser-compute-canary-build
          path: /tmp/browser-compute-canary
      - name: Restore the shared compute browser build
        run: tar -xzf /tmp/browser-compute-canary/browser-compute-canary.tar.gz
      - name: Verify WebGPU EKF rendering
        run: |
          MECH_BIN=target/debug/mech \
            MECH_EKF_COMPUTE_BACKEND=wgpu \
            MECH_EKF_CONTINUITY_EDIT=false \
            MECH_EKF_TERMINAL_SUBMIT_PROBE=false \
            MECH_EKF_RESULT_FILE=/tmp/ekf-wgpu-no-edit.json \
            bash scripts/smoke-served-resident-ekf-browser.sh
          MECH_BIN=target/debug/mech \
            MECH_EKF_COMPUTE_BACKEND=wgpu \
            MECH_EKF_RESULT_FILE=/tmp/ekf-wgpu.json \
            bash scripts/smoke-served-resident-ekf-browser.sh
      - name: Upload WebGPU EKF evidence
        uses: actions/upload-artifact@v4
        with:
          name: browser-ekf-wgpu-results
          path: /tmp/ekf-wgpu*.json
          if-no-files-found: error
          retention-days: 1
      - name: Retain WebGPU EKF failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-ekf-wgpu-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/served-resident-ekf-browser.*
          if-no-files-found: ignore
          retention-days: 7

  browser-ekf-parity:
    name: Browser EKF parity
    needs:
      - impact
      - browser-ekf-cpu
      - browser-ekf-wgpu
    if: needs.impact.outputs.browser_canary_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        id: checkout
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Record exact-head checkout identity
        env:
          VALIDATION_KIND: exact-head
          REQUESTED_REF: ${{ github.event.pull_request.head.sha }}
          CHECKOUT_REF: ${{ steps.checkout.outputs.ref }}
          CHECKOUT_SHA: ${{ steps.checkout.outputs.commit }}
        shell: bash
        run: bash --noprofile --norc -euo pipefail -c "$RECORD_CHECKOUT_IDENTITY"
      - name: Download scalar and WebGPU EKF evidence
        uses: actions/download-artifact@v4
        with:
          pattern: browser-ekf-*-results
          path: /tmp/browser-ekf-results
          merge-multiple: true
      - name: Verify scalar continuity and WebGPU parity
        run: python3 scripts/check-ekf-browser-results.py /tmp/browser-ekf-results

  browser-compute-canary:
    name: Browser compute canary
    needs:
      - impact
      - browser-compute-build
      - browser-compute-smoke
      - browser-ekf-cpu
      - browser-ekf-wgpu
      - browser-ekf-parity
    if: always() && needs.impact.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every selected compute browser suite
        env:
          REQUIRED: ${{ needs.impact.outputs.browser_canary_required }}
          BUILD_RESULT: ${{ needs.browser-compute-build.result }}
          SMOKE_RESULT: ${{ needs.browser-compute-smoke.result }}
          CPU_RESULT: ${{ needs.browser-ekf-cpu.result }}
          WGPU_RESULT: ${{ needs.browser-ekf-wgpu.result }}
          PARITY_RESULT: ${{ needs.browser-ekf-parity.result }}
        run: |
          if test "$REQUIRED" = true
          then
            test "$BUILD_RESULT" = success
            test "$SMOKE_RESULT" = success
            test "$CPU_RESULT" = success
            test "$WGPU_RESULT" = success
            test "$PARITY_RESULT" = success
          else
            test "$BUILD_RESULT" = skipped
            test "$SMOKE_RESULT" = skipped
            test "$CPU_RESULT" = skipped
            test "$WGPU_RESULT" = skipped
            test "$PARITY_RESULT" = skipped
          fi

  browser-canary:
    name: Browser canary
    needs:
      - impact
      - browser-standard-canary
      - browser-nbody-reference
      - browser-compute-canary
    if: always() && needs.impact.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every selected browser suite
        env:
          REQUIRED: ${{ needs.impact.outputs.browser_canary_required }}
          STANDARD_RESULT: ${{ needs.browser-standard-canary.result }}
          NBODY_RESULT: ${{ needs.browser-nbody-reference.result }}
          COMPUTE_RESULT: ${{ needs.browser-compute-canary.result }}
        run: |
          if test "$REQUIRED" = true
          then
            test "$STANDARD_RESULT" = success
            test "$NBODY_RESULT" = success
            test "$COMPUTE_RESULT" = success
          else
            test "$STANDARD_RESULT" = skipped
            test "$NBODY_RESULT" = skipped
            test "$COMPUTE_RESULT" = skipped
          fi

  full-validation:
    name: Requested full validation
    needs:
      - impact
      - static-contracts
      - standard-linux
      - changed-owner-tests
      - standard-windows
      - browser-canary
    if: >-
      ${{
        !cancelled() &&
        needs.impact.outputs.full_validation_required == 'true' &&
        (needs.static-contracts.result == 'success' ||
          (needs.impact.outputs.docs_only == 'true' && needs.static-contracts.result == 'skipped')) &&
        (needs.standard-linux.result == 'success' ||
          (needs.impact.outputs.docs_only == 'true' && needs.standard-linux.result == 'skipped')) &&
        (needs.standard-windows.result == 'success' ||
          (needs.impact.outputs.docs_only == 'true' && needs.standard-windows.result == 'skipped')) &&
        (needs.changed-owner-tests.result == 'success' || needs.changed-owner-tests.result == 'skipped') &&
        (needs.browser-canary.result == 'success' || needs.browser-canary.result == 'skipped')
      }}
    uses: ./.github/workflows/ci-full.yml
    with:
      release_channel: stable
      validation_ref: ${{ github.event.pull_request.head.sha }}
      native_plan_in_caller: true
      rich_browser_smoke_in_caller: ${{ needs.impact.outputs.browser_canary_required == 'true' }}

  pr-gate:
    name: PR gate
    if: always() && needs.impact.result != 'cancelled'
    needs:
      - impact
      - static-contracts
      - standard-linux
      - changed-owner-tests
      - standard-windows
      - browser-canary
      - early-native-plan
      - full-validation
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Require exactly the selected validation set
        env:
          DOCS_ONLY: ${{ needs.impact.outputs.docs_only }}
          REVIEW_ONLY: ${{ needs.impact.outputs.review_only }}
          FULL_REQUIRED: ${{ needs.impact.outputs.full_validation_required }}
          IMPACT_RESULT: ${{ needs.impact.result }}
          STATIC_RESULT: ${{ needs.static-contracts.result }}
          LINUX_RESULT: ${{ needs.standard-linux.result }}
          OWNER_RESULT: ${{ needs.changed-owner-tests.result }}
          WINDOWS_RESULT: ${{ needs.standard-windows.result }}
          BROWSER_RESULT: ${{ needs.browser-canary.result }}
          FULL_RESULT: ${{ needs.full-validation.result }}
          NATIVE_PLAN_RESULT: ${{ needs.early-native-plan.result }}
        run: |
          test "$IMPACT_RESULT" = success
          if test "$REVIEW_ONLY" = true
          then
            if test "$DOCS_ONLY" = true; then test "$STATIC_RESULT" = skipped; else test "$STATIC_RESULT" = success; fi
            test "$OWNER_RESULT" = success
            test "$LINUX_RESULT" = skipped
            test "$WINDOWS_RESULT" = skipped
            test "$BROWSER_RESULT" = success
          elif test "$DOCS_ONLY" = true
          then
            test "$STATIC_RESULT" = skipped
            test "$LINUX_RESULT" = skipped
            test "$OWNER_RESULT" = skipped
            test "$WINDOWS_RESULT" = skipped
            # The always-running aggregate verifies that browser suites skipped.
            test "$BROWSER_RESULT" = success
          else
            test "$STATIC_RESULT" = success
            test "$LINUX_RESULT" = success
            test "$WINDOWS_RESULT" = success
            test "$OWNER_RESULT" = success -o "$OWNER_RESULT" = skipped
            test "$BROWSER_RESULT" = success -o "$BROWSER_RESULT" = skipped
          fi
          if test "$FULL_REQUIRED" = true
          then
            test "$FULL_RESULT" = success
            test "$NATIVE_PLAN_RESULT" = success
          else
            test "$FULL_RESULT" = skipped
            test "$NATIVE_PLAN_RESULT" = skipped
          fi
