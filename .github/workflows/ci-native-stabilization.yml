name: Native stabilization
on:
  push:
    branches: [codex/r21-native-stabilization]
  workflow_dispatch:
concurrency:
  group: native-stabilization-${{ github.sha }}
  cancel-in-progress: false
env:
  CARGO_BUILD_JOBS: "1"
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  MECH_NATIVE_OWNER_BUILD_TIMEOUT_SECS: "900"
  MECH_NATIVE_OWNER_RUN_TIMEOUT_SECS: "540"
  MECH_NATIVE_HOST_TARGET_TIMEOUT_SECS: "30"
jobs:
  harness:
    name: Unix targeting and native harness contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Verify exact staging checkout
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install syscall tracing if absent
        run: |
          if ! command -v strace >/dev/null; then
            sudo apt-get update -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=-
            sudo apt-get install --yes strace
          fi
      - name: Probe actual external kill with signal delivery blocked
        timeout-minutes: 2
        run: |
          python3 -B scripts/tests/test_probe_unix_kill_targeting.py
          python3 scripts/probe-unix-kill-targeting.py
      - name: Verify stage cleanup, readiness, and console backpressure
        timeout-minutes: 2
        run: python3 -B scripts/tests/test_native_plan_stage.py
      - name: Install Rust nightly-2026-03-03
        run: rustup toolchain install nightly-2026-03-03 --profile minimal
      - name: Fetch locked dependencies
        run: cargo +nightly-2026-03-03 fetch --locked
      - name: Verify Rust signal arguments and containment
        timeout-minutes: 20
        run: |
          python3 scripts/run-native-plan-stage.py --stage unix-containment --timeout-secs 1080 -- \
            cargo +nightly-2026-03-03 test --locked --offline -p mech-build --test isolated_process -- --nocapture
      - name: Retain harness and blocked-syscall traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-stabilization-harness-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/native-plan-logs
            target/bytecode-v1-fixtures/owner-runner/logs
          if-no-files-found: error
          retention-days: 14
  native-plan:
    name: Early native cold preparation and fresh-process reuse
    needs: harness
    uses: ./.github/workflows/ci-native-plan.yml
    with:
      validation_ref: ${{ github.sha }}
      verify_reuse: true
  applications:
    name: Native ${{ matrix.suite }} cold and fresh-process reuse
    needs: harness
    runs-on: ubuntu-latest
    timeout-minutes: 310
    strategy:
      fail-fast: false
      matrix:
        suite: [engine, hosted]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Verify exact staging checkout
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install Rust nightly-2026-03-03
        run: rustup toolchain install nightly-2026-03-03 --profile minimal
      - name: Fetch locked generated-project dependencies
        run: |
          cargo +nightly-2026-03-03 fetch --locked
          cargo +nightly-2026-03-03 fetch --locked --manifest-path tests/fixtures/native-build-owner-runner/Cargo.toml
      - name: Cold native command set
        timeout-minutes: 150
        uses: ./.github/actions/native-applications
        with:
          suite: ${{ matrix.suite }}
          phase: cold
      - name: Fresh-process repeat with retained profile outputs
        timeout-minutes: 150
        uses: ./.github/actions/native-applications
        with:
          suite: ${{ matrix.suite }}
          phase: reuse
