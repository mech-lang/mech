[package]
name = "audit-inventory"
version = "0.0.0"
edition = "2024"
[dependencies]
mech-core = { path = "../../../../../src/core", default-features = false }
mech-engine = { path = "../../../../../src/engine", default-features = false, features = ["semantic-compiler", "resident-artifact", "variable_assign"] }
mech-runtime = { path = "../../../../../src/runtime", default-features = false, features = ["source"] }
mech-syntax = { path = "../../../../../src/syntax", default-features = false }
mech-stdlib = { path = "../../../../../src/stdlib", default-features = false, features = ["source", "i64", "math_add", "math_sub", "variable_define", "assign", "bool", "compare_gte", "invariant_define", "matrixd", "row_vectord", "vectord"] }
serde_json = "1"
[patch.crates-io]
mech-combinatorics = { path = "../../../../../machines/combinatorics" }
mech-compare = { path = "../../../../../machines/compare" }
mech-logic = { path = "../../../../../machines/logic" }
mech-math = { path = "../../../../../machines/math" }
mech-matrix = { path = "../../../../../machines/matrix" }
mech-range = { path = "../../../../../machines/range" }
mech-set = { path = "../../../../../machines/set" }
mech-stats = { path = "../../../../../machines/stats" }
mech-string = { path = "../../../../../machines/string" }
[workspace]
