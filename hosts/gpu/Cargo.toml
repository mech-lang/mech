[package]
name = "mech-gpu"
version = "0.3.5"
authors = ["Corey Montella <corey@mech-lang.org>"]
description = "ProgramArtifact admission and GPU kernel lowering for Mech."
documentation = "https://docs.mech-lang.org"
homepage = "https://mech-lang.org"
repository = "https://github.com/mech-lang/mech"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.92"

[features]
default = []
native = ["dep:bytemuck", "dep:pollster", "dep:wgpu"]

[dependencies]
mech-core = { version = "0.3.5", default-features = false }
mech-engine = { version = "0.3.5", default-features = false }
bytemuck = { version = "1.24.0", optional = true }
pollster = { version = "0.3.0", optional = true }
wgpu = { version = "0.20.1", optional = true }

[dev-dependencies]
mech-core = { version = "0.3.5", default-features = false, features = ["f32", "matrixd"] }
mech-engine = { version = "0.3.5", default-features = false, features = ["full_compiler"] }
mech-stdlib = { version = "0.3.5", default-features = false, features = ["full_compiler"] }
