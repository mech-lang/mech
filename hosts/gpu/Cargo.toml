[package]
name = "mech-gpu"
version = "0.3.5"
authors = ["Corey Montella <corey@mech-lang.org>"]
description = "Resident CPU and wgpu compute backends for Mech."
documentation = "https://docs.mech-lang.org"
homepage = "https://mech-lang.org"
repository = "https://github.com/mech-lang/mech"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.92"

[features]
default = []
runtime-host = ["dep:mech-runtime"]
native = ["runtime-host", "dep:bytemuck", "dep:pollster", "dep:wgpu"]
metal-native = ["native", "dep:metal", "dep:naga"]
jit = [
  "mech-engine/runtime",
  "dep:cranelift-codegen",
  "dep:cranelift-frontend",
  "dep:cranelift-jit",
  "dep:cranelift-module",
]

[dependencies]
mech-compute = { version = "0.3.5", path = "../../src/compute" }
mech-core = { version = "0.3.5", path = "../../src/core", default-features = false }
mech-engine = { version = "0.3.5", path = "../../src/engine", default-features = false, features = ["resident-artifact"] }
mech-runtime = { version = "0.3.5", path = "../../src/runtime", default-features = false, features = ["runtime", "string", "f64"], optional = true }
bytemuck = { version = "1.24.0", optional = true }
pollster = { version = "0.3.0", optional = true }
web-time = "1.1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.11.0", default-features = false }
wgpu = { version = "0.20.1", optional = true }
naga = { version = "0.20.0", optional = true, features = ["wgsl-in", "msl-out"] }
wide = "0.7.33"
cranelift-codegen = { version = "=0.131.3", optional = true }
cranelift-frontend = { version = "=0.131.3", optional = true }
cranelift-jit = { version = "=0.131.3", optional = true }
cranelift-module = { version = "=0.131.3", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
metal = { version = "0.28.0", optional = true }

[[example]]
name = "particle_benchmark"
path = "examples/particle_benchmark.rs"
required-features = ["native"]

[[example]]
name = "compute_backend_benchmark"
path = "examples/compute_backend_benchmark.rs"
required-features = ["native"]

[[example]]
name = "parallel_ekf_benchmark"
path = "examples/parallel_ekf_benchmark.rs"
required-features = ["native", "jit"]

[[example]]
name = "parallel_ekf_rust_scalar"
path = "examples/parallel_ekf_rust_scalar.rs"

[[test]]
name = "parallel_ekf"
path = "tests/parallel_ekf.rs"
required-features = ["native"]

[[test]]
name = "particle_source"
path = "tests/particle_source.rs"
required-features = ["native"]

[dev-dependencies]
mech-core = { version = "0.3.5", path = "../../src/core", default-features = false, features = ["f32", "matrixd"] }
mech-engine = { version = "0.3.5", path = "../../src/engine", default-features = false, features = ["full_compiler"] }
mech-stdlib = { version = "0.3.5", path = "../../src/stdlib", default-features = false, features = ["full_compiler", "native-plan"] }
mech-syntax = { version = "0.3.5", path = "../../src/syntax", default-features = false, features = ["full"] }
mech-runtime = { version = "0.3.5", path = "../../src/runtime", default-features = false, features = ["full_compiler", "resident-routing-source", "compute"] }
