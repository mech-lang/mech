[package]
name = "mech-scene"
version = "0.3.5"
authors = ["Corey Montella <corey@mech-lang.org>"]
description = "Cross-platform scene presentation host provider for Mech."
documentation = "https://docs.mech-lang.org"
homepage = "https://mech-lang.org"
repository = "https://github.com/mech-lang/mech"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.92"

[features]
default = []
native = []
browser = ["dep:wasm-bindgen", "dep:js-sys", "dep:web-sys", "rich-output"]
rich-output = ["dep:serde", "dep:serde_json", "mech-runtime/serde"]

[dependencies]
mech-core = { version = "0.3.5", path = "../../src/core", default-features = false, features = ["u64", "i64", "f64", "string", "record", "table", "tuple", "matrix", "matrixd"] }
mech-runtime = { version = "0.3.5", path = "../../src/runtime", default-features = false, features = ["runtime", "u64", "i64", "f64", "string", "record", "table", "matrixd"] }
wasm-bindgen = { version = "0.2.105", optional = true }
js-sys = { version = "0.3.82", optional = true }
web-sys = { version = "0.3.82", optional = true, features = ["Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "CanvasRenderingContext2d", "SvgElement", "SvgsvgElement", "Node", "NodeList", "DomTokenList", "CssStyleDeclaration"] }
serde = { version = "1.0.228", features = ["derive"], optional = true }
serde_json = { version = "1.0.150", optional = true }

[dev-dependencies]
mech-runtime = { version = "0.3.5", path = "../../src/runtime", default-features = false, features = ["resident-routing-source", "source_default"] }
mech-stdlib = { version = "0.3.5", path = "../../src/stdlib", default-features = false, features = ["full_compiler", "native-plan"] }
