[package]
name = "mech-host-lidar"
version = "0.3.5"
authors = ["Aung Khant Ko"]
description = "LiDAR host provider for Mech runtime host inputs (Slamtec RPLIDAR)."
license = "Apache-2.0"
edition = "2024"
rust-version = "1.92"

[features]
default = []
native = ["dep:rplidar_drv_rs", "dep:serialport"]

[dependencies]
mech-core = { version = "0.3.5", default-features = false, features = ["f64"] }
mech-runtime = { version = "0.3.5", default-features = false, features = ["program", "f64"] }
rplidar_drv_rs = { version = "0.7", optional = true }
serialport = { version = "4", optional = true }
