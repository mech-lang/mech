test:cargo:
  variables:
    CARGO_TERM_COLOR: always
    RUST_BACKTRACE: full
  script:
  - rustup show
  - rustup default nightly-2026-03-03
  - cargo clean
  - cargo build --bin mech --release --features linked_stdlib
  - cargo test -p mech-syntax --tests
  - cargo test -p mech-syntax --tests --no-default-features --features base
  - cargo test -p mech-syntax --test grammar_conformance --no-default-features --features "baselib pretty_print serde compiler program statements_default subscript_default mechdown"
  - ./target/release/mech test docs
  - ./target/release/mech test examples/working
  - cargo build --no-default-features
  - cargo test interpret
  - cargo test bytecode
  - cargo test -p mech-runtime --lib --tests
